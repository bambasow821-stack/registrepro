<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>RegistrePro</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#130b18">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
:root{
  color-scheme: light dark; /* l'application gère ses couleurs : navigateurs, n'y touchez pas */
  --bg:#130b18; --card:#1e1026; --border:rgba(210,145,100,0.18);
  --gold:#d4956a; --goldL:#f0c09a; --text:#f0e6da; --sub:#9a8478;
  --green:#5ec98a; --red:#e05c5c; --blue:#5b9bd5;
  --fieldBg:rgba(255,255,255,0.04); --navBg:#160c1e;
}
/* Mode clair — mêmes variables, valeurs adaptées à un fond clair.
   Les reçus/relevés (documents imprimés) ne sont volontairement PAS concernés :
   ils gardent toujours leur fond "papier" crème, quel que soit le thème choisi. */
body.theme-light{
  --bg:#f7f1e8; --card:#ffffff; --border:rgba(150,95,55,0.22);
  --gold:#b5713f; --goldL:#8a5228; --text:#2a1a12; --sub:#7a6455;
  --green:#1e7a4f; --red:#c9403f; --blue:#3a6ea8;
  --fieldBg:rgba(0,0,0,0.035); --navBg:#ffffff;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Georgia,'Times New Roman',serif;
  -webkit-tap-highlight-color:transparent; overscroll-behavior:none;}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:78px;position:relative;}
button,select,input{font-family:inherit;}
input,select{
  width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--border);
  background:var(--fieldBg);color:var(--text);font-size:14px;outline:none;
}
select{background:var(--navBg);}
.header{background:var(--fieldBg);border-bottom:1px solid var(--border);padding:14px 18px;
  display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50;backdrop-filter:blur(8px);}
.brand{font-size:19px;font-weight:bold;color:var(--gold);letter-spacing:0.5px;}
.brand-sub{font-size:10px;color:var(--sub);letter-spacing:0.5px;}
.cap-box{text-align:right;background:rgba(212,149,106,0.1);border-radius:10px;padding:8px 14px;border:1px solid var(--border);}
.cap-label{font-size:9px;color:var(--sub);letter-spacing:0.8px;margin-bottom:2px;}
.cap-val{font-size:16px;font-weight:bold;color:var(--gold);}
.content{padding:14px 16px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;}
.section-title{font-size:13px;font-weight:bold;color:var(--goldL);letter-spacing:0.3px;margin:16px 0 10px;
  display:flex;justify-content:space-between;align-items:center;}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;}
.kpi .ic{font-size:26px;}
.kpi .lab{font-size:10px;color:var(--sub);letter-spacing:0.5px;margin-bottom:3px;}
.kpi .val{font-size:15px;font-weight:bold;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
  background:var(--navBg);border-top:1px solid var(--border);display:flex;z-index:100;
  padding-bottom:env(safe-area-inset-bottom);}
nav button{flex:1;padding:10px 0 8px;border:none;background:transparent;color:var(--sub);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px;font-family:sans-serif;}
nav button.active{color:var(--gold);}
nav .nic{font-size:20px;}
nav .nlab{font-size:9px;}
nav button.active .nlab{font-weight:bold;}
.btn{padding:12px 0;border-radius:10px;border:none;color:#fff;font-size:14px;font-weight:bold;cursor:pointer;width:100%;}
.field{margin-bottom:13px;}
.field label{display:block;font-size:10px;color:var(--sub);letter-spacing:0.8px;margin-bottom:5px;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:200;display:flex;
  align-items:flex-end;justify-content:center;}
.modal-box{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:480px;
  padding:22px 20px calc(34px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
.modal-title{font-size:16px;font-weight:bold;color:var(--gold);}
.modal-close{background:none;border:none;color:var(--sub);font-size:22px;cursor:pointer;line-height:1;}
.pill{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:transparent;
  color:var(--sub);font-size:12px;cursor:pointer;}
.pill.active{background:rgba(212,149,106,0.2);color:var(--gold);font-weight:bold;}
.row-between{display:flex;justify-content:space-between;align-items:center;}
.muted{color:var(--sub);}
.banner{border-radius:16px;padding:18px 20px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;}
.empty{text-align:center;color:var(--sub);padding:30px;}
.del-btn{background:rgba(224,92,92,0.1);border:none;border-radius:6px;color:var(--red);cursor:pointer;padding:4px 9px;font-size:13px;}
.add-dashed{background:none;border:1px dashed var(--border);border-radius:8px;color:var(--sub);width:100%;padding:10px;cursor:pointer;margin-bottom:12px;}
#onboarding{position:fixed;inset:0;background:var(--bg);z-index:500;display:flex;align-items:center;justify-content:center;padding:24px;overflow-y:auto;}
.ob-box{max-width:380px;width:100%;}
.ob-logo{font-size:40px;text-align:center;margin-bottom:6px;}
.ob-title{font-size:22px;color:var(--gold);text-align:center;font-weight:bold;margin-bottom:4px;}
.ob-sub{font-size:13px;color:var(--sub);text-align:center;margin-bottom:28px;}
#lockScreen{position:fixed;inset:0;background:var(--bg);z-index:600;display:flex;align-items:center;justify-content:center;padding:24px;}
.keypad{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;max-width:230px;margin:0 auto;}
.key-btn{padding:16px 0;border-radius:50%;border:1px solid var(--border);background:var(--fieldBg);color:var(--text);font-size:18px;cursor:pointer;}
.key-btn:active{background:rgba(212,149,106,0.2);}
.chip-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;}
.chip-scroll::-webkit-scrollbar{height:0;}
#printArea{display:none;}
@media print{
  @page{ size:A4; margin:14mm; }
  body *{visibility:hidden;}
  #printArea, #printArea *{visibility:visible;}
  #printArea{position:absolute;top:0;left:0;width:100%;display:block !important;}
  #printArea #receiptContent{max-width:300px;margin:0 auto;}
  #printArea table{width:100%;border-collapse:collapse;}
  #printArea tr{page-break-inside:avoid;}
  #printArea, #printArea *{
    -webkit-print-color-adjust:exact !important;
    print-color-adjust:exact !important;
    color-adjust:exact !important;
  }
}
/* ── Listes personnalisées (remplacent les <select> natifs) ── */
.picker-trigger{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--border);
  background:var(--fieldBg);color:var(--text);font-size:14px;display:flex;
  justify-content:space-between;align-items:center;cursor:pointer;text-align:left;gap:8px;}
.picker-trigger .pt-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.picker-trigger.placeholder .pt-label{color:var(--sub);}
.picker-trigger .pt-arrow{color:var(--gold);font-size:11px;flex-shrink:0;}
#modalRoot .modal-overlay{z-index:700;}
#pickerRoot .modal-overlay{z-index:800;}
#accountPageRoot{position:fixed;inset:0;z-index:650;}
.acct-page{position:absolute;inset:0;background:var(--bg);transform:translateX(-100%);transition:transform 0.22s ease;overflow-y:auto;display:flex;flex-direction:column;}
.acct-page.open{transform:translateX(0);}
.acct-page-head{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);background:var(--fieldBg);position:sticky;top:0;z-index:2;}
.acct-back{background:none;border:none;color:var(--gold);font-size:20px;cursor:pointer;padding:4px 6px;line-height:1;}
.acct-page-title{font-size:17px;font-weight:bold;color:var(--gold);}
.acct-page-body{padding:18px 16px 40px;max-width:520px;width:100%;margin:0 auto;}
.picker-list{max-height:50vh;overflow-y:auto;margin:0 -4px;}
.picker-group-label{font-size:10px;color:var(--gold);letter-spacing:0.8px;text-transform:uppercase;
  padding:14px 8px 6px;font-weight:bold;}
.picker-item{display:flex;justify-content:space-between;align-items:center;padding:12px 10px;
  border-radius:10px;cursor:pointer;margin-bottom:2px;}
.picker-item:active{background:rgba(212,149,106,0.18);}
.picker-item.selected{background:rgba(212,149,106,0.14);}
.picker-item .pi-text{display:flex;flex-direction:column;}
.picker-item .pi-label{font-size:14px;color:var(--text);}
.picker-item .pi-sub{font-size:11px;color:var(--sub);margin-top:1px;}
.picker-item .pi-check{color:var(--gold);font-size:15px;margin-left:8px;flex-shrink:0;}
.picker-add-row{display:flex;align-items:center;justify-content:center;gap:6px;padding:12px 10px;
  border:1px dashed var(--gold);border-radius:10px;color:var(--gold);font-weight:bold;cursor:pointer;
  margin-bottom:10px;font-size:13px;}
.picker-add-form{display:flex;gap:8px;margin-bottom:10px;}
.picker-add-form input{flex:1;}
.picker-empty{text-align:center;color:var(--sub);padding:24px 10px;font-size:13px;}
.cat-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--border);gap:10px;}
.cat-row:first-child{border-top:none;}
.icon-btn{background:var(--fieldBg);border:none;border-radius:6px;color:var(--sub);
  cursor:pointer;padding:6px 9px;font-size:13px;flex-shrink:0;}
.icon-btn.edit{color:var(--gold);}
.receipt-offscreen{position:absolute;left:-10000px;top:0;}
.icon-btn.del{color:var(--red);}
/* ── Notifications discrètes (toasts) ── */
#toastRoot{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  z-index:900;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:100%;max-width:480px;padding:0 16px;}
.toast{background:var(--card);border:1px solid var(--border);color:var(--text);padding:11px 18px;border-radius:30px;
  font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,0.45);opacity:0;transform:scale(0.9);
  transition:opacity 0.25s ease, transform 0.25s ease;text-align:center;max-width:100%;}
.toast.show{opacity:1;transform:scale(1);}
.toast.success{border-color:rgba(94,201,138,0.45);}
.toast.error{border-color:rgba(224,92,92,0.45);}
.toast.info{border-color:rgba(212,149,106,0.45);}
</style>
</head>

</div>
<div id="modalRoot"></div>
<div id="pickerRoot"></div>
<div id="accountPageRoot" style="display:none;"></div>
<div id="toastRoot"></div>

   STORAGE & STATE
════════════════════════════════════════════════ */
const STORE_KEY = "registrepro_data_v2";
const SETTINGS_KEY = "registrepro_settings_v2";

// Liste de départ des catégories de dépenses (modifiable ensuite : ajouter/renommer/supprimer,
// comme les catégories de produits). "Autre" reste en dernier.
// Listes de départ, dans les deux langues. Elles ne servent QU'UNE FOIS, à la création
// du compte : ensuite ce sont les données de l'utilisateur (renommables, supprimables).
// Un compte créé en anglais démarre donc avec la liste anglaise, et inversement.
const DEFAULT_EXPENSE_CATEGORIES_I18N = {
  fr: ["Livraison","Transport","Douane","Communication","Emballage","Loyer","Salaires","Marketing & Publicité","Fournitures","Autre"],
  en: ["Delivery","Transport","Customs","Communication","Packaging","Rent","Salaries","Marketing & Advertising","Supplies","Other"]
};

// Catégories de produits par défaut — volontairement plus générales pour couvrir
// plusieurs types de commerce (électronique, mode, alimentation, pharmacie...).
// Toutes (y compris celles-ci) peuvent être renommées ou supprimées depuis les Réglages.
const DEFAULT_CATEGORIES_I18N = {
  fr: ["Alimentation & Boissons","Santé & Pharmacie","Beauté & Hygiène","Mode & Habillement",
       "Chaussures","Sacs & Accessoires","Bijoux & Montres","Téléphones & Électronique",
       "Ordinateurs & Informatique","Maison & Décoration","Papeterie & Bureau",
       "Bricolage & Outillage","Jouets & Enfants","Autre"],
  en: ["Food & Drinks","Health & Pharmacy","Beauty & Hygiene","Fashion & Clothing",
       "Shoes","Bags & Accessories","Jewelry & Watches","Phones & Electronics",
       "Computers & IT","Home & Decor","Stationery & Office",
       "DIY & Tools","Toys & Kids","Other"]
};

// Renvoie la liste de départ dans la langue demandée (français si la langue est inconnue).
function defaultCategories(l){ return [...(DEFAULT_CATEGORIES_I18N[l] || DEFAULT_CATEGORIES_I18N.fr)]; }
function defaultExpenseCategories(l){ return [...(DEFAULT_EXPENSE_CATEGORIES_I18N[l] || DEFAULT_EXPENSE_CATEGORIES_I18N.fr)]; }

const CURRENCY_LABELS = {GNF:"Franc Guinéen (GNF)", XOF:"FCFA (XOF)", EUR:"Euro (€)", USD:"Dollar ($)"};

// Symbole affiché à côté des montants. L'euro et le dollar ont un symbole universel (€ / $).
// Le franc guinéen et le FCFA n'en ont pas, on garde donc leur code écrit.
const CURRENCY_SYMBOLS = {GNF:"GNF", XOF:"FCFA", EUR:"€", USD:"$"};

// Taux par défaut : GNF est la devise de référence interne (1 GNF = 1 GNF).
// Ce sont des taux de secours, utilisés seulement tant que l'app n'a pas encore réussi
// à récupérer les taux du jour en ligne (au démarrage ou au changement de devise).
const DEFAULT_RATES = { GNF: 1, EUR: 9500, USD: 8600, XOF: 14.5 };

/* ════════════════════════════════════════════════

   Le français reste la langue de référence : si une traduction anglaise manque,

   On ajoute les écrans petit à petit, morceau par morceau.
════════════════════════════════════════════════ */

// Langue courante ("fr" par défaut).
// Avant que le compte existe (écran d'inscription), aucun réglage n'est encore enregistré :
// on part alors de la langue du téléphone, que l'utilisateur peut changer sur cet écran.
// Règle : téléphone en français → français. Tout le reste (anglais, mandarin, espagnol,
// arabe...) → anglais, qui a le plus de chances d'être compris partout dans le monde.
let obLang = (function(){
  try{
    const l = (navigator.language || navigator.userLanguage || "en").toLowerCase();
    return l.indexOf("fr")===0 ? "fr" : "en";
  }catch(e){ return "en"; }
})();
function lang(){ if(settings && settings.lang) return settings.lang; return obLang || "fr"; }
// Traduit une clé ; si l'anglais manque, retombe sur le français, puis sur la clé.
function t(key){
  const L = lang();
  return (I18N[L] && I18N[L][key]) || I18N.fr[key] || key;
}

function loadSettings(){ try{ return JSON.parse(localStorage.getItem(SETTINGS_KEY)); }catch(e){ return null; } }
function saveSettings(s){ localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); }
function loadData(){
  try{
    const d = JSON.parse(localStorage.getItem(STORE_KEY));
    if(d){
      d.receiptCounter = d.receiptCounter || 0;
      if(!Array.isArray(d.payments)) d.payments = []; // migration douce : ventes à crédit
      if(!Array.isArray(d.clients)) d.clients = []; // migration douce : identité client unique
      if(!Array.isArray(d.deletedLog)) d.deletedLog = []; // migration douce : journal des suppressions définitives
      if(!Array.isArray(d.orders)) d.orders = []; // migration douce : commandes (réservations non encore livrées)
      // migration douce : toute opération sans statut est considérée "active" (comportement d'avant)
      d.purchases.forEach(p=>{ if(!p.status) p.status = "active"; });
      d.sales.forEach(s=>{ if(!s.status) s.status = "active"; });
      d.expenses.forEach(e=>{ if(!e.status) e.status = "active"; });
      return d;
    }
  }catch(e){}
  return {capitalInitial:0, products:[], variants:[], purchases:[], sales:[], expenses:[], payments:[], clients:[], deletedLog:[], orders:[], receiptCounter:0};
}
// ════════════════════════════════════════════════
// PORTE UNIQUE D'ÉCRITURE DES DONNÉES
// ════════════════════════════════════════════════
// persist() est le SEUL endroit de toute l'application qui écrit les données dans la
// mémoire du téléphone. Aucun autre code ne doit appeler localStorage.setItem(STORE_KEY, ...)
// directement. Le jour où on ajoutera la synchronisation en ligne, c'est ici — et
// uniquement ici — qu'on branchera l'envoi vers le serveur.
//
// Deux métiers séparés volontairement :
//   persist()  = enregistre seulement (sans redessiner l'écran)
//   saveData() = enregistre PUIS redessine (le cas normal après une action de l'utilisateur)
// Certaines réparations silencieuses se produisent pendant l'affichage d'un reçu : elles
// doivent enregistrer sans redessiner, sinon le reçu sauterait sous les yeux de l'utilisateur.
function persist(){
  stampRecords(); // marque boutique + heure de modification (fondation de la synchronisation)
  localStorage.setItem(STORE_KEY, JSON.stringify(state.data));
  // Porte unique de la synchronisation : on planifie l'envoi vers le coffre.
  if(typeof scheduleSyncPush === "function") scheduleSyncPush();
}
function saveData(){ persist(); render(); }

// Une opération compte dans les calculs (capital, rapports, relevés) tant qu'elle n'est pas
// à la corbeille — "active" et "archivée" comptent pareil (l'argent reste réel), seule la
// corbeille annule ses effets (comme une vraie suppression, mais réversible).
function isCounted(item){ return (item.status||"active")!=="trash"; }

// Vérifie qu'un fichier de sauvegarde a bien la forme attendue AVANT de l'appliquer —
// évite qu'un fichier corrompu, incomplet, ou qui n'est simplement pas une sauvegarde
// RegistrePro n'écrase les données actuelles par des données invalides et ne casse l'app.
function validateBackupPayload(payload){
  if(!payload || typeof payload!=="object" || Array.isArray(payload)){
    return {ok:false, msg:"Ce fichier n'a pas la structure d'une sauvegarde RegistrePro."};
  }
  const s = payload.settings, d = payload.data;
  if(!s || typeof s!=="object") return {ok:false, msg:t("bk.badSettings")};
  if(typeof s.businessName!=="string" || !s.businessName.trim()) return {ok:false, msg:"Le nom du commerce est manquant — ce n'est probablement pas une sauvegarde RegistrePro."};
  if(!["GNF","XOF","EUR","USD"].includes(s.currency)) return {ok:false, msg:t("bk.badCurrency")};
  if(!d || typeof d!=="object") return {ok:false, msg:t("bk.badData")};
  const requiredArrays = ["products","variants","purchases","sales","expenses"];
  for(const key of requiredArrays){
    if(!Array.isArray(d[key])) return {ok:false, msg:"La section \""+key+"\" est manquante ou n'est pas une liste valide — le fichier semble corrompu."};
    for(const item of d[key]){
      if(!item || typeof item!=="object" || !item.id){
        return {ok:false, msg:"Un élément invalide a été trouvé dans \""+key+"\" — le fichier semble corrompu."};
      }
    }
  }
  if(d.capitalInitial!==undefined && typeof d.capitalInitial!=="number"){
    return {ok:false, msg:"Le capital initial dans ce fichier n'est pas un nombre valide."};
  }
  return {ok:true};
}

function ensureCategoriesIncludeUsed(){

/* ════════════════════════════════════════════════
   IDENTITÉ CLIENT — chaque client a un identifiant unique interne,
   séparé de son nom. Deux personnes portant exactement le même nom
   restent toujours deux fiches distinctes, jamais confondues — même
   si le numéro de téléphone n'est pas renseigné.
════════════════════════════════════════════════ */
function findClientsByName(name){
  const n = (name||"").trim().toLowerCase();
  if(!n) return [];
  return state.data.clients.filter(c=>(c.name||"").trim().toLowerCase()===n);
}
function getClientById(id){ return state.data.clients.find(c=>c.id===id) || null; }
function createClient(name, phone){
  const c = {id:uid(), name:(name||"").trim(), phone:(phone||"").trim(), createdAt:todayFR()};
  state.data.clients.push(c);
  return c;
}

// Appelé à chaque vente à crédit. Si le nom tapé correspond déjà à une ou plusieurs
// fiches client, on demande TOUJOURS confirmation avant de continuer — c'est ce qui
// garantit qu'on ne mélange jamais deux personnes différentes portant le même nom,
// même si le numéro de téléphone n'est pas renseigné cette fois-ci.
function resolveClientForCreditSale(name, phone, onResolved){
  const matches = findClientsByName(name);
  if(matches.length===0){
    const c = createClient(name, phone);
    onResolved(c.id);
    return;
  }
  const items = matches.map(c=>({
    value: c.id,
    label: c.name,
    sub: c.phone ? c.phone : t("credit.noPhone")
  }));
  items.push({value:"__new__", label:t("cli.someoneElse")});
  openCustomPicker({
    title: t("cli.whoIsA")+name+t("cli.whoIsB"),
    groups:[{label: matches.length>1?t("cli.severalSameName"):t("cli.oneSameName"), items}],
    onSelect:(val)=>{
      if(val==="__new__"){
        const c = createClient(name, phone);
        onResolved(c.id);
      } else {
        const c = getClientById(val);
        // Si un numéro est tapé cette fois et que la fiche existante n'en avait pas, on le complète.
        if(c && phone && !c.phone){ c.phone = phone; }
        onResolved(val);
      }
    }
  });
}

// Migration ponctuelle (exécutée une fois au démarrage) : les anciennes ventes/paiements
// à crédit enregistrés avant ce système n'avaient qu'un nom en texte libre, ce qui pouvait
// mélanger deux personnes différentes portant le même nom. On reconstruit ici des fiches
// client distinctes à partir de la combinaison nom+téléphone réellement enregistrée sur
// chaque vente/paiement — c'est la meilleure reconstitution possible, mais elle ne peut pas
// deviner rétroactivement si deux entrées sans téléphone étaient ou non la même personne.
function migrateCreditClients(){
  const d = state.data;
  if(!Array.isArray(d.clients)) d.clients = [];
  let changed = false;
  const keyToId = {};
  d.clients.forEach(c=>{ keyToId[(c.name||"").trim().toLowerCase()+"||"+(c.phone||"").trim()] = c.id; });
  function resolve(name, phone){
    const cleanName = (name||"").trim();
    if(!cleanName) return null;
    const key = cleanName.toLowerCase()+"||"+(phone||"").trim();
    if(keyToId[key]) return keyToId[key];
    const c = createClient(cleanName, phone);
    keyToId[key] = c.id;
    changed = true;
    return c.id;
  }
  d.sales.forEach(s=>{
    if(s.isCredit && !s.clientId){
      const cid = resolve(s.client, s.clientPhone);
      if(cid){ s.clientId = cid; changed = true; }
    }
  });
  (d.payments||[]).forEach(p=>{
    if(!p.clientId){
      const cid = resolve(p.client, p.clientPhone);
      if(cid){ p.clientId = cid; changed = true; }
    }
  });
  if(changed) persist();
}
migrateCreditClients();


/* ════════════════════════════════════════════════
   UTILS & CONVERSION DE DEVISES
   Tout est stocké en interne en GNF. L'affichage convertit
   vers la devise active via settings.rates.
════════════════════════════════════════════════ */
function cur(){ return settings && settings.currency ? settings.currency : "GNF"; }
function rate(curCode){
  const r = settings && settings.rates ? settings.rates[curCode] : null;
  return r || DEFAULT_RATES[curCode] || 1;
}
function toGNF(amount, fromCur){ fromCur = fromCur || cur(); return (amount||0) * rate(fromCur); }
function fromGNF(amountGNF, toCur){ toCur = toCur || cur(); return (amountGNF||0) / rate(toCur); }
// Renvoie le symbole (€ / $) ou le code (GNF / FCFA) de la devise pour l'affichage.
function curSym(curCode){ curCode = curCode || cur(); return CURRENCY_SYMBOLS[curCode] || curCode; }
function fmtRaw(n, curCode){ return new Intl.NumberFormat("fr-FR").format(Math.round(n||0)) + " " + curSym(curCode||cur()); }
function fmt(nGNF){ return fmtRaw(fromGNF(nGNF||0, cur()), cur()); }
// Comme fmt(), mais SANS le code de devise — utilisé à l'intérieur du corps du reçu,
// où la devise ne doit apparaître qu'une seule fois, sur la ligne TOTAL finale.
function fmtNoCur(nGNF){ return new Intl.NumberFormat("fr-FR").format(Math.round(fromGNF(nGNF||0, cur()))); }

// Identifiant d'une opération. Deux parties :
//   - la date (base 36) : conserve l'ordre chronologique, sur lequel repose
//     le classement des crédits « par activité récente » ;
//   - 10 caractères tirés au sort par le générateur sécurisé du téléphone :
//     deux appareils hors réseau ne peuvent plus produire le même identifiant.
function uid(){ return Date.now().toString(36) + "-" + randomToken(10); }
function todayFR(){ const d=new Date(); return d.toLocaleDateString("fr-FR"); }
function monthOf(d){ if(!d) return ""; const p=d.split("/"); return p[1]+"/"+p[2]; }
function curMonth(){ const d=new Date(); return String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear(); }
// Convertit une date stockée "DD/MM/YYYY" en "YYYY-MM-DD" (comparable et compatible <input type="date">).
function frToISO(frDate){
  if(!frDate) return "";
  const p = frDate.split("/");
  if(p.length!==3) return "";
  return p[2]+"-"+p[1].padStart(2,"0")+"-"+p[0].padStart(2,"0");
}
function todayISO(){ return frToISO(todayFR()); }
function isoToFRShort(iso){
  if(!iso) return "";
  const p = iso.split("-");
  if(p.length!==3) return iso;
  return p[2]+"/"+p[1]+"/"+p[0];
}
// Renvoie le premier et le dernier jour (en ISO) d'un mois donné au format "MM/YYYY".
function monthBoundsISO(mmYYYY){
  const parts = (mmYYYY||curMonth()).split("/");
  const mm = parts[0], yyyy = parts[1];
  const y = parseInt(yyyy,10), m = parseInt(mm,10);
  const from = yyyy+"-"+mm.padStart(2,"0")+"-01";
  const lastDay = new Date(y, m, 0).getDate();
  const to = yyyy+"-"+mm.padStart(2,"0")+"-"+String(lastDay).padStart(2,"0");
  return {from, to};
}
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

// Va chercher les taux du jour en ligne (source : open.er-api.com), en silence.
// Renvoie true si les taux ont été mis à jour, false si ça n'a pas marché (pas de
// connexion, source indisponible...). N'affiche AUCUN message : c'est à l'appelant
// de décider quoi montrer. En cas d'échec, les derniers taux connus restent en place.
async function refreshRatesOnline(){
  try{
    const res = await fetch("https://open.er-api.com/v6/latest/USD");
    const data = await res.json();
    if(!data || !data.rates) return false;
    const gnfPerUsd = data.rates.GNF;
    const eurPerUsd = data.rates.EUR;
    if(!gnfPerUsd || !eurPerUsd) return false;
    const gnfPerEur = gnfPerUsd / eurPerUsd;
    const gnfPerXof = gnfPerEur / 655.957; // peg fixe FCFA/EUR
    // On ne remplace les taux que si tout est cohérent (nombres strictement positifs).
    if(!(gnfPerUsd>0) || !(gnfPerEur>0) || !(gnfPerXof>0)) return false;
    settings.rates = { GNF:1, USD: gnfPerUsd, EUR: gnfPerEur, XOF: gnfPerXof };
    settings.ratesUpdatedAt = new Date().toLocaleString("fr-FR");
    saveSettings(settings);
    return true;
  }catch(err){
    return false;
  }
}

// Au démarrage de l'app : si on a du réseau, on rafraîchit discrètement les taux,
// sans message ni blocage. Si ça échoue, on garde simplement les derniers taux connus.
async function refreshRatesInBackground(){
  if(!settings) return; // pas encore de compte (avant l'inscription)
  if(typeof navigator!=="undefined" && navigator.onLine===false) return; // clairement hors-ligne
  const ok = await refreshRatesOnline();
  if(ok && isUnlocked) render();
}


/* ════════════════════════════════════════════════
   CATÉGORIES DE PRODUITS — ajouter / renommer / supprimer
════════════════════════════════════════════════ */
function getCategories(){ return (settings && settings.categories) ? settings.categories : defaultCategories(lang()); }
function addCategory(name){
  name = (name||"").trim();
  if(!name) return {ok:false, msg:t("cat.emptyName")};
  if(getCategories().some(c=>c.toLowerCase()===name.toLowerCase())) return {ok:false, msg:t("cat.exists")};
  settings.categories.push(name);
  saveSettings(settings);
  return {ok:true};
}
function renameCategory(oldName, newName){
  newName = (newName||"").trim();
  if(!newName) return {ok:false, msg:t("cat.emptyName")};
  const idx = settings.categories.indexOf(oldName);
  if(idx<0) return {ok:false, msg:t("cat.notFound")};
  if(settings.categories.some((c,i)=>i!==idx && c.toLowerCase()===newName.toLowerCase())) return {ok:false, msg:t("cat.nameTaken")};
  settings.categories[idx] = newName;
  state.data.products.forEach(p=>{ if(p.category===oldName) p.category = newName; });
  saveSettings(settings); saveData();
  return {ok:true};
}
function deleteCategory(name){
  const idx = settings.categories.indexOf(name);
  if(idx<0) return {ok:false, affected:0};
  const affected = state.data.products.filter(p=>p.category===name).length;
  settings.categories.splice(idx,1);
  saveSettings(settings);
  return {ok:true, affected};
}

/* ────────────────────────────────────────────────
   CATÉGORIES DE DÉPENSES — même principe que les catégories de produits :
   ajouter / renommer / supprimer. Renommer met aussi à jour les dépenses
   existantes qui utilisaient l'ancien nom.
──────────────────────────────────────────────── */
function getExpenseCategories(){ return (settings && settings.expenseCategories) ? settings.expenseCategories : defaultExpenseCategories(lang()); }
function addExpenseCategory(name){
  name = (name||"").trim();
  if(!name) return {ok:false, msg:t("cat.emptyName")};
  if(getExpenseCategories().some(c=>c.toLowerCase()===name.toLowerCase())) return {ok:false, msg:t("cat.exists")};
  settings.expenseCategories.push(name);
  saveSettings(settings);
  return {ok:true};
}
function renameExpenseCategory(oldName, newName){
  newName = (newName||"").trim();
  if(!newName) return {ok:false, msg:t("cat.emptyName")};
  const idx = settings.expenseCategories.indexOf(oldName);
  if(idx<0) return {ok:false, msg:t("cat.notFound")};
  if(settings.expenseCategories.some((c,i)=>i!==idx && c.toLowerCase()===newName.toLowerCase())) return {ok:false, msg:t("cat.nameTaken")};
  settings.expenseCategories[idx] = newName;
  state.data.expenses.forEach(e=>{ if(e.category===oldName) e.category = newName; });
  saveSettings(settings); saveData();
  return {ok:true};
}
function deleteExpenseCategory(name){
  const idx = settings.expenseCategories.indexOf(name);
  if(idx<0) return {ok:false, affected:0};
  const affected = state.data.expenses.filter(e=>e.category===name).length;
  settings.expenseCategories.splice(idx,1);
  saveSettings(settings);
  return {ok:true, affected};
}
// Filet de sécurité utilisé UNIQUEMENT après une restauration de sauvegarde
// (jamais au démarrage), même logique que pour les catégories de produits :
// une catégorie supprimée volontairement doit rester supprimée.
function ensureExpenseCategoriesIncludeUsed(){
  if(!settings || !settings.expenseCategories) return;
  const used = new Set(state.data.expenses.map(e=>e.category).filter(Boolean));
  let changed = false;
  used.forEach(c=>{ if(!settings.expenseCategories.includes(c)){ settings.expenseCategories.push(c); changed = true; } });
  if(changed) saveSettings(settings);
}


/* ════════════════════════════════════════════════
   NUMÉRO DE REÇU UNIQUE (lettres + chiffres, imprévisible)
   Vérifié contre toutes les ventes existantes pour garantir
   qu'il n'y aura jamais deux reçus avec le même numéro.
════════════════════════════════════════════════ */
const RECEIPT_CODE_CHARS = "23456789ABCDEFGHJKLMNPQRSTUVWXYZ"; // sans 0/O/1/I pour éviter toute confusion
/* ════════════════════════════════════════════════
   FONDATIONS DE LA SYNCHRONISATION (invisibles à l'écran)
   ════════════════════════════════════════════════
   Trois choses posées maintenant, une fois pour toutes, pour ne JAMAIS avoir à
   refaire les données plus tard :

   1. Un numéro d'appareil (deviceId), tiré au sort à la première ouverture.
   2. Des identifiants uniques dans le monde entier : deux téléphones hors réseau
      ne peuvent plus fabriquer par hasard le même identifiant, donc une vente ne
      peut jamais en écraser une autre au retour du réseau.
      Le début reste une date : l'ordre chronologique des identifiants, sur lequel
      repose l'affichage des crédits « par activité récente », est préservé.
   3. Sur chaque opération : la boutique à laquelle elle appartient (shopId) et
      l'heure de sa dernière modification (updatedAt) — ce qui permettra de dire
      « la plus récente gagne » en cas de modification simultanée sur deux appareils.
════════════════════════════════════════════════ */
function randomToken(len){
  const chars = "abcdefghijklmnopqrstuvwxyz0123456789";
  let out = "";
  try{
    const buf = new Uint8Array(len);
    (window.crypto || window.msCrypto).getRandomValues(buf);
    for(let i=0;i<len;i++) out += chars[buf[i] % chars.length];
    return out;
  }catch(e){
    for(let i=0;i<len;i++) out += chars[Math.floor(Math.random()*chars.length)];
    return out;
  }
}
function newDeviceId(){ return "dev-" + randomToken(12); }
// Lettre propre à cet appareil, utilisée dans les numéros de reçus.
function newDeviceChar(){
  const r = randomToken(4);
  let h = 0;
  for(let i=0;i<r.length;i++) h = (h*131 + r.charCodeAt(i)) >>> 0;
  return RECEIPT_CODE_CHARS[h % RECEIPT_CODE_CHARS.length];
}
function getDeviceId(){
  if(settings && settings.deviceId) return settings.deviceId;
  return "";
}

// Le nom de l'article, gravé dans l'opération elle-même.
// Tant que la variante existe, c'est le stock qui fait foi : renommer un produit
// met donc à jour tout l'historique, ce qui est bien ce qu'on attend d'une correction.
// Quand la variante a disparu, on lit le nom gravé : un vieux reçu continue d'afficher
// « Écouteurs (Noir) » au lieu d'une ligne vide. Le reçu ne dépend plus du stock.
function itemNameParts(rec){
  const d = state.data;
  const v = (rec && rec.variantId && d && d.variants) ? d.variants.find(x=>x.id===rec.variantId) : null;
  if(v){
    const p = d.products.find(x=>x.id===v.productId);
    return { product:(p && p.name) || "", variant: v.label || "" };
  }
  return { product:(rec && rec.itemName) || "", variant:(rec && rec.itemVariant) || "" };
}
function itemFullName(rec){
  const x = itemNameParts(rec);
  if(x.product && x.variant) return x.product + " — " + x.variant;
  return x.product || x.variant || "";
}
function itemReceiptLabel(rec){
  const x = itemNameParts(rec);
  return (x.product || "?") + (x.variant ? (" (" + x.variant + ")") : "");
}
// Recopie le nom dans l'opération. Appelée à chaque enregistrement : les opérations
// déjà existantes sont donc rattrapées automatiquement, sans rien demander.
function freezeItemNames(){
  const d = state.data;
  if(!d || !d.variants) return;
  function fill(rec){
    if(!rec || !rec.variantId) return;
    const v = d.variants.find(x=>x.id===rec.variantId);
    if(!v) return; // variante déjà disparue : on ne peut pas inventer un nom
    const p = d.products.find(x=>x.id===v.productId);
    rec.itemName = p ? p.name : "";
    rec.itemVariant = v.label || "";
  }
  (d.sales||[]).forEach(fill);
  (d.purchases||[]).forEach(pu=>(pu.items||[]).forEach(fill));
  (d.orders||[]).forEach(o=>(o.items||[]).forEach(fill));
}

// Opérations qui devront un jour monter en ligne.
// Le journal des suppressions en fait partie : chaque appareil doit voir la même
// histoire du commerce, y compris ce qui a été effacé et par qui, sinon deux
// téléphones du même compte racontent deux versions différentes.
const SYNC_COLLECTIONS = ["products","variants","purchases","sales","expenses","payments","clients","orders","deletedLog"];
/* ════════════════════════════════════════════════
   SYNCHRONISATION — LA MONTÉE (étape 2b)
   ════════════════════════════════════════════════
   Ton téléphone envoie ses opérations vers le coffre (Supabase), tout seul,
   dès qu'il y a du réseau. Aucun bouton : ça se passe en arrière-plan.

   Comment on sait quoi envoyer ?
     Chaque opération porte une heure de dernière modification (updatedAt).
     On retient, pour chaque opération, l'heure DÉJÀ confirmée par le coffre.
     Est « en attente » toute opération dont l'updatedAt est plus récent que
     ce que le coffre connaît — donc : les nouvelles, et les modifiées.

   Trois promesses tenues :
     1. Hors réseau, rien n'est perdu : ça part au retour du réseau.
     2. Jamais de doublon : le coffre reconnaît chaque opération à son
        identifiant unique et se contente de la mettre à jour.
     3. On n'envoie jamais deux fois la même chose pour rien : une fois
        confirmée, une opération n'est renvoyée que si elle change encore.
════════════════════════════════════════════════ */

// Ce que le coffre a déjà confirmé : identifiant d'opération -> updatedAt confirmé.
// Rangé sur l'appareil, à part du registre, pour survivre à la fermeture de l'app.
const SYNC_STATE_KEY = "registrepro_sync_v1";
function loadSyncState(){
  try{ return JSON.parse(localStorage.getItem(SYNC_STATE_KEY)) || {}; }catch(e){ return {}; }
}
function saveSyncState(s){
  try{ localStorage.setItem(SYNC_STATE_KEY, JSON.stringify(s)); }catch(e){}
}
// { acked: { recordId: updatedAtISO }, pulledAt: ISO }  (pulledAt servira à la descente)
let syncState = loadSyncState();

let syncInFlight = false;   // un envoi est-il déjà en cours ? (on n'en lance jamais deux à la fois)
let syncPendingAgain = false; // une modification est survenue pendant l'envoi ? on relancera

// Traduit une opération du registre en ligne du coffre.
// « façon A » : l'opération entière part d'un bloc dans le champ data.
function toCoffreRow(kind, rec){
  return {
    kind: kind,
    record_id: String(rec.id),
    data: rec,
    deleted: (rec.status === "trash")  // la corbeille = marqué effacé, jamais détruit
  };
}

// Liste toutes les opérations qui doivent monter (nouvelles ou modifiées depuis
// la dernière confirmation du coffre).
function collectPending(){
  const pending = [];
  if(!state || !state.data) return pending;
  SYNC_COLLECTIONS.forEach(function(kind){
    const arr = state.data[kind];
    if(!Array.isArray(arr)) return;
    arr.forEach(function(rec){
      if(!rec || typeof rec !== "object" || !rec.id) return;
      const acked = syncState.acked ? syncState.acked[rec.id] : undefined;
      const current = rec.updatedAt || "";
      if(acked !== current){
        pending.push({ kind: kind, rec: rec });
      }
    });
  });
  return pending;
}

// Combien d'opérations attendent de monter ? (pour la pastille discrète)
function pendingCount(){
  return collectPending().length;
}

// Le numéro de boutique est la clé qui ouvre le coffre. S'il manque (compte créé
// avant une correction, ou fiche jamais relue), on va le rechercher tout seul au
// lieu d'abandonner. Ainsi un appareil se répare lui-même, sans rien demander.
async function ensureShopId(){
  if(settings && settings.account && settings.account.shopId) return settings.account.shopId;
  if(!auth || !auth.access_token || !settings) return "";
  const r = await profileFetch();
  if(!r.ok) return "";
  const row = Array.isArray(r.data) ? r.data[0] : r.data;
  if(!row || !row.shop_id) return "";
  if(!settings.account) settings.account = {};
  settings.account.shopId = row.shop_id;
  if(row.role) settings.account.role = row.role;
  saveSettings(settings);
  return row.shop_id;
}

// ── Notes de décès ──────────────────────────────────────────────────────
// Quand une opération est supprimée DÉFINITIVEMENT, elle quitte le téléphone.
// Sans trace, le coffre ne l'apprendrait jamais et la renverrait à la descente :
// une vente effacée réapparaîtrait, avec son argent. On garde donc une petite note
// — juste le type et l'identifiant — le temps de prévenir le coffre.
// Elle est effacée dès que le coffre a confirmé. Rien de tout cela n'est visible
// à l'écran : l'application ne change pas d'apparence.
// ── Les réglages de la boutique ─────────────────────────────────────────
// Le capital de départ et les catégories ne sont pas des opérations : ce sont des
// réglages du commerce. Sans eux, un second appareil afficherait toutes les ventes
// mais un Capital disponible FAUX. Ils montent donc aussi, dans une ligne à part.
function shopSettingsRecord(){
  return {
    id: "shop-settings",
    capitalInitial: (state && state.data) ? (state.data.capitalInitial || 0) : 0,
    receiptCounter: (state && state.data) ? (state.data.receiptCounter || 0) : 0,
    categories: (settings && settings.categories) ? settings.categories : [],
    expenseCategories: (settings && settings.expenseCategories) ? settings.expenseCategories : [],
    currency: (settings && settings.currency) ? settings.currency : "GNF",
    businessName: (settings && settings.businessName) ? settings.businessName : "",
    ownerName: (settings && settings.ownerName) ? settings.ownerName : "",
    contact: (settings && settings.contact) ? settings.contact : "",
    updatedAt: (syncState && syncState.shopSettingsAt) ? syncState.shopSettingsAt : new Date().toISOString()
  };
}
// Signature des réglages, pour ne les envoyer QUE s'ils ont vraiment changé.
function shopSettingsSignature(){
  const r = shopSettingsRecord();
  return JSON.stringify([r.capitalInitial, r.receiptCounter, r.categories, r.expenseCategories, r.currency, r.businessName, r.ownerName, r.contact]);
}

// Notes de décès
function markDeletedForSync(kind, recordId){
  if(!recordId) return;
  if(!syncState.tombstones) syncState.tombstones = [];
  const id = String(recordId);
  if(syncState.tombstones.some(function(x){ return x.kind===kind && x.id===id; })) return;

  // Photo complète de l'opération, prise AVANT qu'elle disparaisse du téléphone.
  // C'est elle qui permettra au propriétaire de consulter, des mois plus tard,
  // le montant, le produit, le client et la date d'une opération pourtant effacée.
  let snapshot = null;
  try{
    const arr = (state && state.data) ? state.data[kind] : null;
    if(Array.isArray(arr)){
      const found = arr.find(function(x){ return x && String(x.id) === id; });
      if(found) snapshot = JSON.parse(JSON.stringify(found));
    }
  }catch(e){}

  syncState.tombstones.push({ kind:kind, id:id, snap:snapshot });
  // L'opération n'existe plus : sa confirmation n'a plus lieu d'être.
  if(syncState.acked) delete syncState.acked[recordId];
  saveSyncState(syncState);
}

// Envoie les opérations en attente vers le coffre, par lots.
// Renvoie {ok, sent, error}. Ne lève jamais d'exception.
async function syncPush(){
  if(syncInFlight){ syncPendingAgain = true; return {ok:false, sent:0, error:"busy"}; }
  if(!auth || !auth.access_token){ return {ok:false, sent:0, error:"no-session"}; }
  if(!settings || !settings.account){ return {ok:false, sent:0, error:"no-account"}; }

  syncInFlight = true;
  let totalSent = 0;
  try{
    // On renouvelle la session si besoin (sans réseau, ça échoue proprement).
    await authRefreshSession();

    // Filet : sans numéro de boutique, on tente de le récupérer avant de renoncer.
    const shopId = await ensureShopId();
    if(!shopId){ syncInFlight = false; return {ok:false, sent:0, error:"no-shop"}; }
    // Les opérations déjà en mémoire n'ont pas encore ce numéro : on le pose maintenant.
    stampRecords();

    let pending = collectPending();
    const BATCH = 100; // on envoie par paquets de 100 pour rester léger

    while(pending.length > 0){
      const slice = pending.slice(0, BATCH);
      const rows = slice.map(function(p){ return toCoffreRow(p.kind, p.rec); });

      // « upsert » : si la ligne existe déjà (même boutique + type + identifiant),
      // le coffre la met à jour ; sinon il la crée. C'est ça, l'anti-doublon.
      const r = await supaCall(
        "/rest/v1/records?on_conflict=shop_id,kind,record_id",
        { method:"POST", withToken:true,
          headers:{ "Prefer":"resolution=merge-duplicates,return=minimal" },
          body: rows }
      );
      if(!r.ok){
        syncInFlight = false;
        return {ok:false, sent:totalSent, error:r.error || "push-failed"};
      }

      // Confirmé : on retient l'heure acceptée pour ne plus renvoyer ces opérations.
      if(!syncState.acked) syncState.acked = {};
      slice.forEach(function(p){ syncState.acked[p.rec.id] = p.rec.updatedAt || ""; });
      saveSyncState(syncState);
      totalSent += slice.length;

      // Une modification a-t-elle eu lieu entre-temps ? On recalcule la file.
      pending = collectPending();
    }

    // Les réglages de la boutique (capital de départ, catégories, infos du commerce).
    // Envoyés seulement s'ils ont changé, pour ne pas encombrer le réseau.
    // Un VENDEUR ne les envoie jamais : son nom et son téléphone sont les siens, ils
    // ne doivent pas devenir ceux du commerce. Ces réglages appartiennent au propriétaire.
    // Un appareil qui vient de REJOINDRE le commerce ne les envoie pas non plus tant
    // qu'il n'a rien reçu : son registre est encore vide, il annoncerait « capital = 0 »
    // et effacerait le vrai chiffre pour tout le monde.
    const sig = shopSettingsSignature();
    if(!sellerRO() && !syncState.awaitingFirstPull && syncState.shopSettingsSig !== sig){
      syncState.shopSettingsAt = new Date().toISOString();
      const rec = shopSettingsRecord();
      const rs = await supaCall(
        "/rest/v1/records?on_conflict=shop_id,kind,record_id",
        { method:"POST", withToken:true,
          headers:{ "Prefer":"resolution=merge-duplicates,return=minimal" },
          body: [{ kind:"shopsettings", record_id:"shop-settings", data:rec, deleted:false }] }
      );
      if(!rs.ok){
        syncInFlight = false;
        return {ok:false, sent:totalSent, error:rs.error || "settings-failed"};
      }
      syncState.shopSettingsSig = sig;
      saveSyncState(syncState);
      totalSent += 1;
    }

    // Les suppressions définitives : on prévient le coffre que ces opérations sont
    // mortes. Il les garde (archivées, consultables par le propriétaire) mais ne les
    // renverra JAMAIS à la descente. Aucun fantôme ne peut ressusciter.
    const tombs = syncState.tombstones || [];
    if(tombs.length > 0){
      for(let i = 0; i < tombs.length; i += BATCH){
        const slice = tombs.slice(i, i + BATCH);
        const rows = slice.map(function(x){
          // On envoie l'opération ENTIÈRE (sa photo), enrichie des marques
          // « supprimée définitivement » et de la date de suppression. Le coffre
          // garde ainsi tout le détail, consultable, tout en sachant qu'elle
          // ne doit jamais redescendre vers les appareils.
          const base = x.snap ? Object.assign({}, x.snap) : {id:x.id};
          base.purged = true;
          base.purgedAt = new Date().toISOString();
          return { kind:x.kind, record_id:x.id, data:base, deleted:true };
        });
        const rd = await supaCall(
          "/rest/v1/records?on_conflict=shop_id,kind,record_id",
          { method:"POST", withToken:true,
            headers:{ "Prefer":"resolution=merge-duplicates,return=minimal" },
            body: rows }
        );
        if(!rd.ok){
          syncInFlight = false;
          return {ok:false, sent:totalSent, error:rd.error || "tombstone-failed"};
        }
        totalSent += slice.length;
      }
      // Confirmées : on peut oublier les notes, elles ont fait leur travail.
      syncState.tombstones = [];
      saveSyncState(syncState);
    }

    syncInFlight = false;
    // Si quelque chose a changé pendant qu'on envoyait, on refait un tour.
    if(syncPendingAgain){ syncPendingAgain = false; return await syncPush(); }
    return {ok:true, sent:totalSent, error:null};
  }catch(e){
    syncInFlight = false;
    return {ok:false, sent:totalSent, error:"exception"};
  }
}

// Purge du carnet de confirmations : au changement de compte / déconnexion,
// pour ne jamais mélanger les confirmations de deux boutiques.
// Les notes de décès NON ENCORE ENVOYÉES sont conservées : ce sont des suppressions
// réelles qui doivent encore être annoncées au coffre. Les perdre ferait revenir
// des opérations effacées à la prochaine descente.
function resetSyncState(){
  const pendingTombs = (syncState && syncState.tombstones) ? syncState.tombstones : [];
  syncState = pendingTombs.length ? { tombstones: pendingTombs } : {};
  saveSyncState(syncState);
}

/* ════════════════════════════════════════════════
   SYNCHRONISATION — LA DESCENTE (étape 2c)
   ════════════════════════════════════════════════
   Ton téléphone récupère ce que les autres appareils ont envoyé au coffre,
   et fusionne avec ce qu'il a déjà. C'est ce qui fait que deux téléphones
   du même commerce finissent par afficher exactement la même chose.

   Les règles, décidées ensemble :

   1. « LA PLUS RÉCENTE GAGNE ». Si la même opération existe des deux côtés,
      on garde la version modifiée en dernier — d'après l'horloge du SERVEUR,
      qui est la même pour tout le monde (un téléphone mal réglé ne fausse rien).

   2. LA SUPPRESSION L'EMPORTE TOUJOURS. Si une opération est effacée d'un
      côté et modifiée de l'autre, elle reste effacée. Ressusciter une vente
      que quelqu'un a voulu supprimer serait bien pire que perdre une retouche.

   3. ON NE DESCEND QUE LE NOUVEAU. On retient l'heure de la dernière descente
      et on ne redemande que ce qui a changé depuis. Rapide, et léger en données
      mobiles — ce qui compte quand on paie sa connexion.

   4. RIEN N'EST JAMAIS ÉCRASÉ EN SILENCE. Ce que le téléphone a de plus récent
      que le coffre est conservé, et repartira à la prochaine montée.
════════════════════════════════════════════════ */

// Applique une ligne venue du coffre dans le registre local.
// Renvoie true si quelque chose a réellement changé sur le téléphone.
function applyIncomingRow(row){
  if(!row || !row.kind || !row.record_id) return false;

  // Les réglages de la boutique (capital, catégories) suivent un chemin à part.
  if(row.kind === "shopsettings") return applyIncomingSettings(row);

  if(SYNC_COLLECTIONS.indexOf(row.kind) < 0) return false; // type inconnu : on ignore
  const arr = state.data[row.kind];
  if(!Array.isArray(arr)) return false;

  const id = String(row.record_id);
  const idx = arr.findIndex(function(x){ return x && String(x.id) === id; });
  const localRec = idx >= 0 ? arr[idx] : null;

  // Cas 1 : le coffre dit que cette opération est effacée.
  if(row.deleted){
    // Purge définitive annoncée par un autre appareil : on retire aussi ici.
    if(row.data && row.data.purged){
      if(idx >= 0){ arr.splice(idx, 1); _recordSignatures.delete(id); return true; }
      return false;
    }
    // Sinon c'est la corbeille : l'opération existe, avec le statut "trash".
    if(idx >= 0){
      if(localRec.status === "trash") return false; // déjà à la corbeille
      // La suppression l'emporte, même si notre version est plus récente.
      arr[idx] = Object.assign({}, row.data, {status:"trash"});
      _recordSignatures.set(id, recordSignature(arr[idx]));
      return true;
    }
    // On ne connaissait pas cette opération : on l'ajoute déjà à la corbeille,
    // pour rester fidèle à ce que montrent les autres appareils.
    const rec = Object.assign({}, row.data, {status:"trash"});
    arr.push(rec);
    _recordSignatures.set(id, recordSignature(rec));
    return true;
  }

  // Cas 2 : opération vivante.
  if(idx < 0){
    // Inconnue ici : c'est du nouveau venu d'un autre appareil.
    arr.push(row.data);
    _recordSignatures.set(id, recordSignature(row.data));
    return true;
  }

  // Cas 3 : elle existe des deux côtés — la plus récente gagne.
  const localAt = localRec.updatedAt || "";
  const remoteAt = (row.data && row.data.updatedAt) || row.updated_at || "";
  if(remoteAt > localAt){
    arr[idx] = row.data;
    _recordSignatures.set(id, recordSignature(row.data));
    return true;
  }
  // Notre version est plus récente (ou identique) : on la garde. Elle repartira
  // d'elle-même à la prochaine montée, rien n'est perdu.
  return false;
}

// Réglages de la boutique venus du coffre (capital de départ, catégories, infos).
function applyIncomingSettings(row){
  const d = row.data || {};
  const remoteAt = d.updatedAt || row.updated_at || "";
  const localAt = (syncState && syncState.shopSettingsAt) ? syncState.shopSettingsAt : "";
  if(!(remoteAt > localAt)) return false; // le nôtre est plus récent : on le garde

  let changed = false;
  if(typeof d.capitalInitial === "number" && d.capitalInitial !== state.data.capitalInitial){
    state.data.capitalInitial = d.capitalInitial;
    changed = true;
  }
  // Le compteur de reçus ne doit JAMAIS reculer : deux appareils peuvent en avoir
  // consommé chacun de leur côté. On garde donc toujours le plus grand des deux,
  // sinon on risquerait de réattribuer un numéro déjà utilisé.
  if(typeof d.receiptCounter === "number" && d.receiptCounter > (state.data.receiptCounter||0)){
    state.data.receiptCounter = d.receiptCounter;
    changed = true;
  }
  if(Array.isArray(d.categories) && d.categories.length){
    settings.categories = d.categories; changed = true;
  }
  if(Array.isArray(d.expenseCategories) && d.expenseCategories.length){
    settings.expenseCategories = d.expenseCategories; changed = true;
  }
  if(d.businessName){ settings.businessName = d.businessName; changed = true; }
  if(d.ownerName !== undefined && !sellerRO()){ settings.ownerName = d.ownerName; changed = true; }
  if(d.contact !== undefined){ settings.contact = d.contact; changed = true; }
  if(changed){
    saveSettings(settings);
    syncState.shopSettingsAt = remoteAt;
    syncState.shopSettingsSig = shopSettingsSignature();
    saveSyncState(syncState);
  }
  return changed;
}

// Va chercher au coffre tout ce qui a changé depuis la dernière fois.
// Renvoie {ok, received, changed, error}. Ne lève jamais d'exception.
async function syncPull(){
  if(!auth || !auth.access_token){ return {ok:false, received:0, changed:0, error:"no-session"}; }
  if(!settings || !settings.account){ return {ok:false, received:0, changed:0, error:"no-account"}; }

  try{
    await authRefreshSession();
    const shopId = await ensureShopId();
    if(!shopId){ return {ok:false, received:0, changed:0, error:"no-shop"}; }

    const since = syncState.pulledAt || "1970-01-01T00:00:00Z";
    let received = 0, changed = 0;
    let newest = since;
    const PAGE = 500;
    let offset = 0;

    // On pagine : même avec des milliers d'opérations, la mémoire reste tranquille.
    while(true){
      const path = "/rest/v1/records?select=kind,record_id,data,updated_at,deleted"
        + "&updated_at=gt." + encodeURIComponent(since)
        + "&order=updated_at.asc"
        + "&offset=" + offset + "&limit=" + PAGE;
      const r = await supaCall(path, {withToken:true});
      if(!r.ok) return {ok:false, received:received, changed:changed, error:r.error || "pull-failed"};

      const rows = Array.isArray(r.data) ? r.data : [];
      rows.forEach(function(row){
        received++;
        if(applyIncomingRow(row)) changed++;
        if(row.updated_at && row.updated_at > newest) newest = row.updated_at;
      });

      if(rows.length < PAGE) break;
      offset += PAGE;
    }

    if(changed > 0){
      // On écrit SANS déclencher de nouvelle montée pour ce qu'on vient de recevoir :
      // ces opérations viennent du coffre, les renvoyer serait inutile.
      SYNC_COLLECTIONS.forEach(function(kind){
        const arr = state.data[kind];
        if(!Array.isArray(arr)) return;
        arr.forEach(function(rec){
          if(rec && rec.id && rec.updatedAt){
            if(!syncState.acked) syncState.acked = {};
            if(syncState.acked[rec.id] === undefined) syncState.acked[rec.id] = rec.updatedAt;
          }
        });
      });
      persist();
    }

    // On avance le repère seulement si tout s'est bien passé.
    if(newest > since){
      syncState.pulledAt = newest;
      saveSyncState(syncState);
    }
    // L'appareil a maintenant écouté : il peut parler. On baisse le drapeau ICI et
    // nulle part ailleurs — une descente en échec est sortie plus haut, donc arriver
    // jusqu'à cette ligne veut bien dire que le coffre a répondu.
    if(syncState.awaitingFirstPull){
      syncState.awaitingFirstPull = false;
      saveSyncState(syncState);
    }
    return {ok:true, received:received, changed:changed, error:null};
  }catch(e){
    return {ok:false, received:0, changed:0, error:"exception"};
  }
}

// Une synchronisation complète : on envoie d'abord, on reçoit ensuite.
// Cet ordre est important — ainsi nos propres modifications sont déjà dans le
// coffre quand on compare, et « la plus récente gagne » tranche justement.
async function syncFull(){
  const up = await syncPush();
  const down = await syncPull();
  const ok = !!(up.ok && down.ok);
  const err = up.ok ? (down.ok ? null : down.error) : up.error;
  if(down.changed > 0 && typeof render === "function"){
    try{ render(); }catch(e){}
  }
  if(typeof updateSyncBadge === "function") updateSyncBadge();
  return {ok:ok, sent:up.sent||0, received:down.received||0, changed:down.changed||0, error:err};
}

// Descente régulière tant que l'application reste ouverte, plus une au démarrage.
// Et surtout : dès que l'on revient dans l'application (écran rallumé, retour depuis
// une autre application). C'est le geste naturel — on ouvre pour regarder, ça se met
// à jour à cet instant. Bien plus économe qu'une connexion permanente, pour le même
// ressenti : quand on regarde son téléphone, c'est à jour.
let _pullTimer = null;
let _lastAutoSync = 0;
function runSyncNow(){
  if(!(settings && settings.account && auth && auth.access_token)) return;
  const now = Date.now();
  if(now - _lastAutoSync < 3000) return; // jamais deux fois coup sur coup
  _lastAutoSync = now;
  syncFull().then(function(res){
    lastSyncError = (res && res.ok) ? null : (res ? res.error : "inconnu");
    if(typeof updateSyncBadge === "function") updateSyncBadge();
  });
}
function startSyncLoop(){
  if(_pullTimer) return;
  runSyncNow();
  _pullTimer = setInterval(runSyncNow, 30000); // toutes les 30 secondes, discrètement
  // Retour dans l'application : mise à jour immédiate.
  try{
    document.addEventListener("visibilitychange", function(){
      if(!document.hidden) runSyncNow();
    });
    window.addEventListener("focus", runSyncNow);
  }catch(e){}
}

// Déclenche une montée en arrière-plan, sans bloquer l'écran. Silencieux.
let _syncTimer = null;
let lastSyncError = null; // dernière erreur de synchro (pour diagnostic dans Mon compte)
function scheduleSyncPush(){
  if(_syncTimer) return; // on regroupe les demandes rapprochées en un seul envoi
  _syncTimer = setTimeout(function(){
    _syncTimer = null;
    syncPush().then(function(res){
      lastSyncError = (res && res.ok) ? null : (res ? res.error : "inconnu");
      // On rafraîchit discrètement la pastille si l'écran l'affiche.
      if(typeof updateSyncBadge === "function") updateSyncBadge();
    });
  }, 1200); // petite pause : on laisse l'utilisateur finir sa saisie avant d'envoyer
}


// Empreinte du contenu de chaque opération, gardée en mémoire vive. Elle permet de
// détecter automatiquement TOUTE modification, où qu'elle se produise dans le code,
// et de mettre à jour l'heure — sans avoir à y penser à chaque endroit.
let _recordSignatures = new Map();
let _lastStampISO = null;
function recordSignature(r){
  return JSON.stringify(r, function(key, val){ return key === "updatedAt" ? undefined : val; });
}
function stampRecords(){
  if(!state || !state.data) return;
  freezeItemNames();
  const shopId = (settings && settings.account && settings.account.shopId) ? settings.account.shopId : "";
  let now = new Date().toISOString();
  // Deux modifications dans la même milliseconde donneraient la même heure, et la
  // seconde passerait inaperçue (jamais synchronisée). On fait donc toujours avancer
  // l'heure d'au moins un cran par rapport à la dernière posée.
  if(_lastStampISO && now <= _lastStampISO){
    now = new Date(new Date(_lastStampISO).getTime() + 1).toISOString();
  }
  _lastStampISO = now;
  SYNC_COLLECTIONS.forEach(function(key){
    const arr = state.data[key];
    if(!Array.isArray(arr)) return;
    arr.forEach(function(r){
      if(!r || typeof r !== "object" || !r.id) return;
      if(shopId && !r.shopId) r.shopId = shopId;
      const sig = recordSignature(r);
      const known = _recordSignatures.get(r.id);
      if(known === undefined){
        if(!r.updatedAt) r.updatedAt = now;
      } else if(known !== sig){
        r.updatedAt = now;
      }
      _recordSignatures.set(r.id, sig);
    });
  });
}

function randomReceiptCode(len){
  let s = "";
  for(let i=0;i<len;i++) s += RECEIPT_CODE_CHARS[Math.floor(Math.random()*RECEIPT_CODE_CHARS.length)];
  return s;
}
// Chaque appareil possède sa propre lettre, tirée au sort une seule fois et conservée.
// Elle occupe toujours la même place dans le numéro de reçu : deux téléphones du même
// commerce, même hors réseau, ne sortent donc pas deux reçus portant le même numéro.
// À l'intérieur d'un même appareil, la boucle ci-dessous garantit déjà l'unicité.
function deviceReceiptChar(){
  if(!settings) return RECEIPT_CODE_CHARS[0];
  if(!settings.deviceChar){
    settings.deviceChar = newDeviceChar();
    saveSettings(settings);
  }
  return settings.deviceChar;
}
function generateReceiptNumber(prefix){
  prefix = prefix || "RC";
  let code, tries = 0;
  do{
    code = prefix+"-"+randomReceiptCode(3)+"-"+deviceReceiptChar()+randomReceiptCode(2);
    tries++;
  } while(
    (state.data.sales.some(s=>s.receiptNo===code)
      || (state.data.payments||[]).some(p=>p.receiptNo===code)
      || (state.data.orders||[]).some(o=>o.orderNo===code))
    && tries<500
  );
  return code;
}
// Normalise un numéro de reçu pour la recherche : enlève tirets/espaces, met en majuscules.
// Permet de retrouver "RC-4X9-K2P" même en tapant "4x9k2p" ou "rc4x9k2p".
function normalizeCode(str){
  return (str||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
}


/* ════════════════════════════════════════════════
   STATS CALCULATION (tout en GNF en interne)
════════════════════════════════════════════════ */
function computeStats(){
  const d = state.data;
  let totalAchats=0, totalVentes=0, totalDepenses=0, totalCreditSales=0;
  const sm = {};
  for(const p of d.purchases){
    if(!isCounted(p)) continue;
    totalAchats += (p.deliveryFee||0)+(p.customsFee||0);
    for(const it of p.items){
      totalAchats += it.qty*it.unitCost;
      if(!sm[it.variantId]) sm[it.variantId]={stock:0,totalCostIn:0,totalQtyIn:0};
      sm[it.variantId].stock += it.qty;
      sm[it.variantId].totalCostIn += it.qty*it.unitCost;
      sm[it.variantId].totalQtyIn += it.qty;
    }
  }
  let totalCoutVentes = 0; // coût d'achat des articles RÉELLEMENT vendus (prix d'achat moyen)
  for(const s of d.sales){
    if(!isCounted(s)) continue;
    const lineTotal = s.qty*s.salePrice;
    totalVentes += lineTotal;
    if(s.isCredit) totalCreditSales += lineTotal;
    const smd = sm[s.variantId];
    const avg = (smd && smd.totalQtyIn>0) ? (smd.totalCostIn/smd.totalQtyIn) : 0;
    totalCoutVentes += s.qty*avg;
    if(sm[s.variantId]) sm[s.variantId].stock -= s.qty;
  }
  for(const e of d.expenses){ if(isCounted(e)) totalDepenses += e.amount; }
  // Argent réellement en poche : les ventes au comptant comptent intégralement,
  // mais les ventes à crédit ne comptent que ce qui a été effectivement payé
  // (via state.data.payments) — pas le montant total de la vente.
  const totalPayments = (d.payments||[]).filter(p=>isCounted(p)).reduce((s,p)=>s+(p.amount||0),0);
  const totalCashFromSales = (totalVentes - totalCreditSales) + totalPayments;

  const capitalDispo = d.capitalInitial - totalAchats + totalCashFromSales - totalDepenses;
  // Bénéfice = ce qu'on a gagné sur les articles RÉELLEMENT vendus (ventes − leur coût
  // d'achat), et non ventes − TOUS les achats : ainsi, constituer du stock ne fait plus
  // apparaître un faux « négatif », et le bénéfice reflète la vraie marge réalisée.
  const beneficeBrut = totalVentes - totalCoutVentes;
  const beneficeNet = beneficeBrut - totalDepenses;
  const marge = totalVentes>0 ? (beneficeNet/totalVentes)*100 : 0;
  return {totalAchats,totalVentes,totalDepenses,totalCreditSales,totalPayments,totalCashFromSales,totalCoutVentes,capitalDispo,beneficeBrut,beneficeNet,marge,sm};
}

/* ── PRIX D'ACHAT MOYEN PAR VARIANTE ──────────────────────────────────────
   Une seule source pour tout le monde. La moyenne se calcule sur TOUS les achats
   du registre, jamais sur ceux d'une période : un mois où l'on n'a rien acheté doit
   quand même pouvoir chiffrer ce qu'il a vendu.
   Cette fonction existe pour que le bénéfice affiché à l'accueil, dans les Rapports
   et dans le graphique soit calculé de la MÊME façon. Trois calculs séparés avaient
   fini par donner trois chiffres différents pour le même mot. */
function variantAvgCosts(){
  const d = state.data;
  const acc = {};
  for(const p of d.purchases){
    if(!isCounted(p)) continue;
    for(const it of p.items){
      if(!acc[it.variantId]) acc[it.variantId] = {cost:0, qty:0};
      acc[it.variantId].cost += it.qty*it.unitCost;
      acc[it.variantId].qty  += it.qty;
    }
  }
  const avg = {};
  for(const id in acc) avg[id] = acc[id].qty > 0 ? acc[id].cost/acc[id].qty : 0;
  return avg;
}

function getLast6MonthsData(){
  const d = state.data;
  const months = [];
  const now = new Date();
  for(let i=5;i>=0;i--){
    const dt = new Date(now.getFullYear(), now.getMonth()-i, 1);
    const key = String(dt.getMonth()+1).padStart(2,"0")+"/"+dt.getFullYear();
    months.push({key, label:dt.toLocaleDateString("fr-FR",{month:"short"}), ventes:0, achats:0, depenses:0, coutVentes:0});
  }
  const byKey = {}; months.forEach(m=>byKey[m.key]=m);
  const avg = variantAvgCosts();
  for(const p of d.purchases){ if(!isCounted(p)) continue; const k=monthOf(p.date); if(byKey[k]) byKey[k].achats += p.items.reduce((s,i)=>s+i.qty*i.unitCost,0)+(p.deliveryFee||0)+(p.customsFee||0); }
  for(const s of d.sales){ if(!isCounted(s)) continue; const k=monthOf(s.date); if(byKey[k]){ byKey[k].ventes += s.qty*s.salePrice; byKey[k].coutVentes += s.qty*(avg[s.variantId]||0); } }
  for(const e of d.expenses){ if(!isCounted(e)) continue; const k=monthOf(e.date); if(byKey[k]) byKey[k].depenses += e.amount; }
  // Bénéfice = ventes − coût des articles vendus − dépenses. Faire du stock ne creuse
  // plus le bénéfice : la marchandise achetée garde sa valeur tant qu'elle est en stock.
  months.forEach(m=> m.benefice = m.ventes-m.coutVentes-m.depenses);
  return months;
}

// Renvoie TOUS les groupes de vente, quel que soit leur statut (actif/archivé/corbeille) —
// chaque appelant filtre ensuite selon son besoin (liste normale, archives, corbeille...).
function getSaleGroups(){
  const d = state.data;
  const map = {};
  d.sales.forEach(s=>{
    const gid = s.groupId || s.id;
    if(!map[gid]) map[gid] = {
      id:gid, date:s.date, client:s.client||"", clientPhone:s.clientPhone||"",
      receiptNo:s.receiptNo||"", isCredit:!!s.isCredit, clientId: s.clientId||null,
      sellerName: s.sellerName || (settings&&settings.ownerName) || "",
      status: s.status||"active",
      lines:[]
    };
    map[gid].lines.push(s);
  });
  return Object.values(map).sort((a,b)=> b.id.localeCompare(a.id));
}



/* ════════════════════════════════════════════════
   VENTES À CRÉDIT — dettes agrégées par CLIENT (identifiant unique)
   On regroupe par clientId, pas par nom — deux personnes portant le
   même nom restent toujours deux fiches séparées, sans confusion.
   On garde aussi la trace de chaque achat à crédit (par reçu), pour
   pouvoir le rouvrir directement depuis la fiche du client.
════════════════════════════════════════════════ */
function laterId(a,b){ if(!a) return b||""; if(!b) return a; return a.localeCompare(b)>=0 ? a : b; }

function getDebtsByClient(){
  const d = state.data;
  const byId = {};
  const purchasesByGroup = {}; // groupId -> reçu de crédit agrégé (peut contenir plusieurs articles)
  d.sales.forEach(s=>{
    if(!s.isCredit || !s.clientId || !isCounted(s)) return;
    if(!byId[s.clientId]) byId[s.clientId] = {clientId:s.clientId, owed:0, paid:0, payments:[], lastActivityId:""};
    byId[s.clientId].owed += s.qty*s.salePrice;
    byId[s.clientId].lastActivityId = laterId(byId[s.clientId].lastActivityId, s.id);
    const gid = s.groupId || s.id;
    if(!purchasesByGroup[gid]) purchasesByGroup[gid] = {groupId:gid, clientId:s.clientId, receiptNo:s.receiptNo||"", date:s.date, total:0, saleId:s.id};
    purchasesByGroup[gid].total += s.qty*s.salePrice;
  });
  (d.payments||[]).forEach(p=>{
    if(!p.clientId) return;
    if(!isCounted(p)) return;
    if(!byId[p.clientId]) byId[p.clientId] = {clientId:p.clientId, owed:0, paid:0, payments:[], lastActivityId:""};
    byId[p.clientId].paid += p.amount||0;
    byId[p.clientId].payments.push(p);
    byId[p.clientId].lastActivityId = laterId(byId[p.clientId].lastActivityId, p.id);
  });
  const allPurchases = Object.values(purchasesByGroup);
  const list = Object.keys(byId).map(cid=>{
    const c = getClientById(cid) || {name:t("cli.unknown"), phone:""};
    const entry = byId[cid];
    return {
      clientId: cid,
      client: c.name,
      clientPhone: c.phone,
      owed: entry.owed,
      paid: entry.paid,
      remaining: Math.max(0, Math.round(entry.owed - entry.paid)),
      payments: [...entry.payments].sort((a,b)=> (b.id||"").localeCompare(a.id||"")),
      creditPurchases: allPurchases.filter(p=>p.clientId===cid).sort((a,b)=> (b.saleId||"").localeCompare(a.saleId||"")),
      lastActivityId: entry.lastActivityId
    };
  });
  // Le client le plus récemment actif (nouvelle vente ou paiement) apparaît en premier.
  list.sort((a,b)=> (b.lastActivityId||"").localeCompare(a.lastActivityId||""));
  return list;
}

/* ════════════════════════════════════════════════
   RELEVÉ DU CLIENT (crédit)
   Mélange, dans l'ordre du temps, TOUT ce qu'un client a emprunté et payé,
   comme un petit relevé de banque personnel. Chaque ligne indique ce qu'il
   restait à devoir juste après cet événement.
   — N'écrit rien, ne modifie rien : c'est une simple fenêtre de lecture.
   — Un achat multi-articles (même groupId) = UNE seule ligne (total du groupe).
   — Les ventes en corbeille sont ignorées (leurs effets sont annulés).
   — L'ordre suit l'identifiant (uid = heure de création), plus fiable que la
     date "JJ/MM/AAAA" qui n'a pas d'heure (emprunt + paiement le même jour).
   — Le reste total reste identique à getDebtsByClient (source officielle).
════════════════════════════════════════════════ */
function buildClientStatementRows(clientId){
  const d = state.data;
  const events = [];
  // 1) Emprunts (ventes à crédit), regroupés par groupId
  const groups = {};
  (d.sales||[]).forEach(s=>{
    if(!s.isCredit || s.clientId!==clientId) return;
    if((s.status||"active")==="trash") return;
    const gid = s.groupId || s.id;
    if(!groups[gid]) groups[gid] = {id:s.id, gid, date:s.date, receiptNo:s.receiptNo||"", amount:0, names:[]};
    groups[gid].amount += s.qty*s.salePrice;
    if((s.id||"") < (groups[gid].id||"")) groups[gid].id = s.id; // ancre temporelle = plus petit id du groupe
    const nm = itemFullName(s);
    if(nm) groups[gid].names.push(nm + (s.qty>1?(" ×"+s.qty):""));
  });
  Object.values(groups).forEach(g=>{
    events.push({kind:"borrow", id:g.id, date:g.date, receiptNo:g.receiptNo, amount:g.amount, label:g.names.join(", "), groupId:g.gid});
  });
  // 2) Paiements
  (d.payments||[]).forEach(p=>{
    if(p.clientId!==clientId) return;
    if(!isCounted(p)) return;
    events.push({kind:"pay", id:p.id, date:p.date, receiptNo:p.receiptNo||"", amount:p.amount||0, paymentId:p.id});
  });
  // 3) Ordre chronologique (par identifiant)
  events.sort((a,b)=> (a.id||"").localeCompare(b.id||""));
  // 4) Reste courant après chaque ligne
  let running = 0;
  events.forEach(e=>{
    running += (e.kind==="borrow" ? e.amount : -e.amount);
    e.runningAfter = Math.round(running);
  });
  const totalBorrowed = events.filter(e=>e.kind==="borrow").reduce((s,e)=>s+e.amount,0);
  const totalPaid = events.filter(e=>e.kind==="pay").reduce((s,e)=>s+e.amount,0);
  return {
    events,
    totalBorrowed: Math.round(totalBorrowed),
    totalPaid: Math.round(totalPaid),
    remaining: Math.max(0, Math.round(totalBorrowed - totalPaid))
  };
}

    <div style="font-size:10px;color:var(--sub);font-style:italic;margin:8px 0 12px;line-height:1.5;">${t("credit.stHint")}</div>
    <div style="border:1px solid var(--border);border-radius:12px;padding:4px 12px;margin-bottom:14px;">

/* ════════════════════════════════════════════════
   SÉCURITÉ DU CODE PIN
   Le code n'est plus jamais stocké tel quel : on garde uniquement son
   "empreinte" (hash SHA-256, natif au navigateur, zéro dépendance externe).
   Impossible de retrouver le code à partir de l'empreinte — y compris en
   lisant le fichier de sauvegarde exporté. On compare juste deux empreintes
   entre elles au moment de déverrouiller.
════════════════════════════════════════════════ */
async function hashPin(pin){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(pin));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
function hasPinSet(){ return !!(settings && (settings.pinHash || settings.pin)); }

// Vérifie le code entré. Gère aussi, en douceur, la migration des anciennes
// installations qui avaient encore le code stocké en clair (settings.pin) :
// dès qu'un code correct est entré une fois, on le remplace par son empreinte
// et on supprime définitivement la version en clair.
async function verifyPin(entered){
  if(settings.pinHash){
    const h = await hashPin(entered);
    return h===settings.pinHash;
  } else if(settings.pin){
    const ok = entered===settings.pin;
    if(ok){
      settings.pinHash = await hashPin(entered);
      delete settings.pin;
      saveSettings(settings);
    }
    return ok;
  }
  return false;
}

// Blocage progressif après plusieurs codes faux d'affilée : 5 essais autorisés,
// puis verrouillage qui double à chaque nouvel échec (30s, 60s, 120s...),
// plafonné à 30 minutes — dissuasif sans jamais bloquer définitivement.
function lockoutSecondsFor(failCount){
  if(failCount < 5) return 0;
  return Math.min(30 * Math.pow(2, failCount-5), 1800);
}
function isCurrentlyLocked(){ return !!(settings.pinLockedUntil && Date.now() < settings.pinLockedUntil); }
function registerPinFailure(){
  settings.pinFailCount = (settings.pinFailCount||0)+1;
  const secs = lockoutSecondsFor(settings.pinFailCount);
  if(secs>0) settings.pinLockedUntil = Date.now()+secs*1000;
  saveSettings(settings);
}
function registerPinSuccess(){
  settings.pinFailCount = 0;
  settings.pinLockedUntil = 0;
  saveSettings(settings);
}

/* ════════════════════════════════════════════════
   COMPTE EN LIGNE — CONNEXION AU SERVEUR (Supabase)
   ════════════════════════════════════════════════
   Tout passe par des appels réseau simples (fetch). Aucune bibliothèque
   extérieure n'est ajoutée : l'application reste UN SEUL fichier autonome.

   Ce que ce bloc sait faire, et RIEN d'autre pour l'instant :
     - créer un compte (email + mot de passe)
     - vérifier l'email avec un code à 6 chiffres
     - se connecter / se déconnecter
     - mot de passe oublié (code à 6 chiffres)
     - lire et écrire la fiche du commerce (table "profiles")

   Les VENTES, ACHATS, DÉPENSES ne montent PAS encore en ligne : c'est l'étape 2.
   Le travail quotidien continue donc de fonctionner entièrement hors ligne.
════════════════════════════════════════════════ */
const SUPA_URL = "https://fclyhzndkydonscslbop.supabase.co";
const SUPA_KEY = "sb_publishable_zZ0iCEvecLGq5F_X9MbCSg_707ClCnH";
const AUTH_KEY = "registrepro_auth_v1";

// La session (jetons de connexion) est rangée à part des données du commerce :
// se déconnecter ne doit jamais toucher au registre.
function loadAuth(){ try{ return JSON.parse(localStorage.getItem(AUTH_KEY)); }catch(e){ return null; } }
function saveAuth(a){ if(a) localStorage.setItem(AUTH_KEY, JSON.stringify(a)); else localStorage.removeItem(AUTH_KEY); }
let auth = loadAuth();

function authHeaders(withToken){
  const h = { "apikey": SUPA_KEY, "Content-Type": "application/json" };
  if(withToken && auth && auth.access_token) h["Authorization"] = "Bearer " + auth.access_token;
  return h;
}

// Appel réseau unique de toute l'application vers le serveur.
// Renvoie toujours {ok, data, error} — jamais d'exception qui casserait un écran.
async function supaCall(path, opts){
  opts = opts || {};
  try{
    // En-têtes de base + éventuels en-têtes supplémentaires (ex. "Prefer" pour la synchro).
    let headers = authHeaders(opts.withToken);
    if(opts.headers){ headers = Object.assign({}, headers, opts.headers); }
    const res = await fetch(SUPA_URL + path, {
      method: opts.method || "GET",
      headers: headers,
      body: opts.body ? JSON.stringify(opts.body) : undefined
    });
    let data = null;
    const txt = await res.text();
    if(txt){ try{ data = JSON.parse(txt); }catch(e){ data = null; } }
    if(!res.ok){
      const msg = (data && (data.error_description || data.msg || data.message || data.error)) || ("HTTP " + res.status);
      return {ok:false, status:res.status, data:data, error:String(msg)};
    }
    return {ok:true, status:res.status, data:data, error:null};
  }catch(e){
    return {ok:false, status:0, data:null, error:"network"};
  }
}

// Traduit un message d'erreur du serveur (toujours en anglais) en phrase compréhensible.
function authErrorText(r){
  if(!r) return t("au.errGeneric");
  if(r.error === "network" || r.status === 0) return t("au.errNetwork");
  const e = String(r.error || "").toLowerCase();
  if(e.indexOf("already registered") >= 0 || e.indexOf("already been registered") >= 0 || r.status === 422) return t("au.errExists");
  if(e.indexOf("invalid login") >= 0 || e.indexOf("invalid credentials") >= 0) return t("au.errCredentials");
  if(e.indexOf("token has expired") >= 0 || e.indexOf("invalid token") >= 0 || e.indexOf("otp") >= 0) return t("au.errOtp");
  if(e.indexOf("email not confirmed") >= 0) return t("au.errNotConfirmed");
  if(e.indexOf("password") >= 0 && e.indexOf("6 characters") >= 0) return t("au.errPwShort");
  if(e.indexOf("rate limit") >= 0 || e.indexOf("too many") >= 0 || r.status === 429) return t("au.errTooMany");
  return t("au.errGeneric");
}

function storeSession(d){

const PENDING_OTP_KEY = "registrepro_pending_otp_v1";
const PENDING_OTP_MAX_AGE = 24 * 60 * 60 * 1000; // au-delà, le code est mort de toute façon

function savePendingOtp(screen, email){
  try{
    localStorage.setItem(PENDING_OTP_KEY, JSON.stringify({
      screen: screen, email: String(email||""), at: Date.now()

  }catch(e){}
}
function readPendingOtp(){
  try{
    const raw = localStorage.getItem(PENDING_OTP_KEY);
    if(!raw) return null;
    const n = JSON.parse(raw);
    if(!n || !n.email) return null;
    if(n.screen !== "otp" && n.screen !== "forgotOtp") return null;
    if(!n.at || (Date.now() - n.at) > PENDING_OTP_MAX_AGE) return null;
    return n;
  }catch(e){ return null; }

async function authRefreshSession(){
