function attachContentHandlers(stats){
  bindActionHandlers(document.getElementById("content"), stats);

  const monthTrigger = document.getElementById("monthTrigger");
  if(monthTrigger){
    monthTrigger.onclick = ()=>{
      const d = state.data;
      const monthSet = new Set([curMonth()]);
      [...d.purchases,...d.sales,...d.expenses].forEach(x=>{ if(x.date) monthSet.add(monthOf(x.date)); });
      const months = Array.from(monthSet).filter(Boolean).sort().reverse();
      openCustomPicker({
        title:t("rep.chooseMonth"),
        selectedValue: state.reportMonth,
        groups:[{items: months.map(m=>({value:m,label:m}))}],
        onSelect:(val)=>{ state.reportMonth = val; render(); }
      });
    };
  }

  const reportFromDate = document.getElementById("reportFromDate");
  if(reportFromDate) reportFromDate.onchange = ()=>{ state.reportDateFrom = reportFromDate.value; render(); };
  const reportToDate = document.getElementById("reportToDate");
  if(reportToDate) reportToDate.onchange = ()=>{ state.reportDateTo = reportToDate.value; render(); };

  const setCurTrigger = document.getElementById("setCurTrigger");
  if(setCurTrigger){
    setCurTrigger.onclick = ()=>{
      openCurrencyPicker(settings.currency, async (val)=>{
        const previous = settings.currency;
        settings.currency = val;
        saveSettings(settings);
        render();
        // Le GNF est la référence interne : rien à convertir, aucun taux à vérifier.
        // Si on rechoisit la même devise, rien à faire non plus.
        if(val==="GNF" || val===previous) return;
        // Sinon, on va chercher le taux du jour en arrière-plan.
        const ok = await refreshRatesOnline();
        render();
        if(ok) showToast(t("act.rateApplied"));
        else showToast(t("act.noConnection"),"info");
      });
    };
  }

  const importFile = document.getElementById("importFile");
  if(importFile) importFile.onchange = (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{
      let payload;
      try{
        payload = JSON.parse(ev.target.result);
      }catch(err){
        alert(t("set.invalidJson"));
        importFile.value = "";
        return;
      }
      const check = validateBackupPayload(payload);
      if(!check.ok){
        alert(t("set.cantRestore")+check.msg);
        importFile.value = "";
        return;
      }
      if(!confirm(t("act.restoreBackupConfirm"))){
        importFile.value = "";
        return;
      }

      // Filet de sécurité : on télécharge automatiquement une copie des données ACTUELLES
      // avant de les remplacer, au cas où la restauration ne serait finalement pas la bonne.
      try{
        const safetyPayload = {settings, data: state.data, exportedAt: new Date().toISOString(), note:"Sauvegarde automatique avant restauration"};
        const blob = new Blob([JSON.stringify(safetyPayload,null,2)], {type:"application/json"});
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = "RegistrePro_avant_restauration_" + todayFR().replace(/\//g,"-") + ".json";
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }catch(safetyErr){ /* si ce téléchargement échoue, on continue quand même la restauration demandée */ }

      settings = payload.settings;
      if(!settings.categories || !Array.isArray(settings.categories) || settings.categories.length===0){
        settings.categories = defaultCategories(settings.lang || "fr");
      }
      if(!settings.expenseCategories || !Array.isArray(settings.expenseCategories) || settings.expenseCategories.length===0){
        settings.expenseCategories = defaultExpenseCategories(settings.lang || "fr");
      }
      state.data = payload.data;
      if(!Array.isArray(state.data.payments)) state.data.payments = [];
      if(!Array.isArray(state.data.clients)) state.data.clients = [];
      if(!Array.isArray(state.data.deletedLog)) state.data.deletedLog = [];
      if(!Array.isArray(state.data.orders)) state.data.orders = [];
      if(typeof state.data.capitalInitial!=="number") state.data.capitalInitial = 0;
      if(typeof state.data.receiptCounter!=="number") state.data.receiptCounter = 0;
      state.data.purchases.forEach(p=>{ if(!p.status) p.status = "active"; });
      state.data.sales.forEach(s=>{ if(!s.status) s.status = "active"; });
      state.data.expenses.forEach(e=>{ if(!e.status) e.status = "active"; });
      saveSettings(settings);
      saveData();
      ensureCategoriesIncludeUsed();
      ensureExpenseCategoriesIncludeUsed();
      migrateCreditClients();
      alert(t("act.restoreSuccess"));
      showToast(t("set.backupRestored"));
      importFile.value = "";
    };
    reader.readAsText(file);
  };

  const catalogSearchInput = document.getElementById("catalogSearch");
  if(catalogSearchInput) catalogSearchInput.oninput = ()=>{
    state.catalogSearch = catalogSearchInput.value;
    const s2 = computeStats();
    const listEl = document.getElementById("catalogList");
    if(listEl){ listEl.innerHTML = buildCatalogListHtml(s2); bindActionHandlers(listEl, s2); }
  };

  const opsSearchInput = document.getElementById("opsSearch");
  if(opsSearchInput) opsSearchInput.oninput = ()=>{
    state.opsSearch = opsSearchInput.value;
    // Si ce qui est tapé correspond EXACTEMENT à un numéro de reçu existant (vente ou paiement),
    // on ouvre directement ce reçu — pas besoin de chercher dans la liste.
    const code = normalizeCode(opsSearchInput.value);
    if(code.length>=5){
      const saleMatch = getSaleGroups().find(g=>g.receiptNo && normalizeCode(g.receiptNo)===code);
      const paymentMatch = !saleMatch && (state.data.payments||[]).find(p=>p.receiptNo && normalizeCode(p.receiptNo)===code);
      if(saleMatch){ openReceiptModal(saleMatch.id); return; }
      if(paymentMatch){ openPaymentReceiptModal(paymentMatch.id); return; }
    }
    const s2 = computeStats();
    const listEl = document.getElementById("opsList");
    if(listEl){ listEl.innerHTML = buildOpsListHtml(s2); bindActionHandlers(listEl, s2); }
  };

  const orderSearchInput = document.getElementById("orderSearch");
  if(orderSearchInput) orderSearchInput.oninput = ()=>{
    state.orderSearch = orderSearchInput.value;
    const listEl = document.getElementById("opsList");
    if(listEl){ listEl.innerHTML = buildOrdersListHtml(); bindActionHandlers(listEl, computeStats()); }
  };

  const creditSearchInput = document.getElementById("creditSearch");
  if(creditSearchInput) creditSearchInput.oninput = ()=>{
    state.creditSearch = creditSearchInput.value;
    const listEl = document.getElementById("opsList");
    if(listEl){ listEl.innerHTML = buildCreditsListHtml(); bindActionHandlers(listEl, computeStats()); }
  };
}

function renderCatalog(stats){
  return `
    ${sellerRO() ? "" : `<div style="display:flex;gap:8px;margin-bottom:10px;">
      <button class="btn" style="background:#3a5fa0;" data-action="openAddProduct">${t("stock.newProduct")}</button>
      <button class="btn" style="background:#6a3080;" data-action="openAddVariant">${t("stock.variant")}</button>
    </div>`}
    <input id="catalogSearch" placeholder="${t("stock.searchProduct")}" value="${esc(state.catalogSearch||"")}" style="margin-bottom:12px;">
    <div id="catalogList">${buildCatalogListHtml(stats)}</div>`;
}

function buildCatalogListHtml(stats){
  const d = state.data;
  const search = (state.catalogSearch||"").toLowerCase().trim();
  const filteredProducts = d.products.filter(p=>{
    if(!search) return true;
    if((p.name||"").toLowerCase().includes(search) || (p.category||"").toLowerCase().includes(search)) return true;
    // Recherche élargie : trouve aussi le produit si le texte correspond à une de ses variantes
    // (ex: chercher "rouge" ou "Xl" retrouve le produit même si ce n'est pas dans son nom).
    return d.variants.some(v=>v.productId===p.id && (v.label||"").toLowerCase().includes(search));
  });

  if(d.products.length===0){
    return `<div class="card empty">${t("stock.noProducts")}<br>
      <span style="color:var(--gold);cursor:pointer;" data-action="openAddProduct">${t("stock.addProductLink")}</span></div>`;
  }
  if(filteredProducts.length===0){
    return `<div class="card empty">${t("stock.noResults")} "${esc(search)}".</div>`;
  }

  let html = "";
  for(const prod of filteredProducts){
    const allPvs = d.variants.filter(v=>v.productId===prod.id);
    // Pendant une recherche, si le texte vise des variantes précises, on ne montre
    // que celles-là. S'il vise le produit lui-même, on les montre toutes.
    const matchingPvs = search ? allPvs.filter(v=>(v.label||"").toLowerCase().includes(search)) : [];
    const nameHit = search && (((prod.name||"").toLowerCase().includes(search)) || ((prod.category||"").toLowerCase().includes(search)));
    const pvs = (search && matchingPvs.length && !nameHit) ? matchingPvs : allPvs;
    const totalStock = allPvs.reduce((s,v)=>s+((stats.sm[v.id]&&stats.sm[v.id].stock)||0),0);
    // Une recherche ouvre le produit d'office : on voit tout de suite ce qu'on cherche.
    const isOpen = search ? true : (state.expandedProductId===prod.id);
    html += `<div class="card" style="margin-bottom:10px;">
      <div class="row-between" style="cursor:pointer;" data-action="toggleProduct" data-id="${prod.id}">
        <div>
          <div style="font-weight:bold;color:var(--goldL);font-size:15px;">${esc(prod.name)}</div>
          <div style="font-size:11px;color:var(--sub);">${esc(prod.category)} · ${allPvs.length} ${t("stock.variantsCount")}</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <div style="background:${totalStock>0?'rgba(94,201,138,0.15)':'rgba(224,92,92,0.15)'};
            border:1px solid ${totalStock>0?'rgba(94,201,138,0.35)':'rgba(224,92,92,0.35)'};
            border-radius:8px;padding:4px 10px;font-size:12px;color:${totalStock>0?'var(--green)':'var(--red)'};">
            ${totalStock} pcs</div>
          ${sellerRO() ? "" : `<button class="icon-btn edit" data-action="editProduct" data-id="${prod.id}">✏️</button>`}
          <span style="color:var(--sub);font-size:16px;">${isOpen?"▲":"▼"}</span>
        </div>
      </div>`;
    if(isOpen){
      html += `<div style="margin-top:10px;">`;
      if(pvs.length===0){
        html += `<div style="font-size:12px;color:var(--sub);padding:6px 0;">${t("stock.noVariant")}</div>`;
      } else {
        for(const v of pvs){
          const smd = stats.sm[v.id]||{stock:0,totalCostIn:0,totalQtyIn:0};
          const avg = smd.totalQtyIn>0 ? smd.totalCostIn/smd.totalQtyIn : 0;
          html += `<div class="row-between" style="border-top:1px solid var(--border);padding:7px 0;align-items:flex-start;">
            <div>
              <div style="font-size:13px;">${esc(v.label)}</div>
              ${sellerRO() ? "" : `<div style="font-size:10px;color:var(--sub);">${t("stock.avgCost")}: ${avg>0?fmt(avg):"—"}</div>`}
              <div style="font-size:10px;color:var(--gold);">${t("stock.setPriceLabel")}: ${v.salePrice?fmt(v.salePrice):t("stock.notSet")}</div>
            </div>
            <div style="display:flex;align-items:center;gap:6px;">
              <div style="text-align:right;">
                <div style="font-weight:bold;font-size:14px;color:${smd.stock>0?'var(--green)':'var(--red)'};">${smd.stock} pcs</div>
                ${(smd.stock>0 && !sellerRO())?`<div style="font-size:10px;color:var(--sub);">${fmt(smd.stock*avg)}</div>`:""}
              </div>
              ${sellerRO() ? "" : `<button class="icon-btn edit" data-action="editVariant" data-id="${v.id}">✏️</button>
              <button class="del-btn" data-action="deleteVariant" data-id="${v.id}">🗑</button>`}
            </div>
          </div>`;
        }
      }
      html += `</div>`;
    }
    html += `</div>`;
  }
  return html;
}

// Modifier un produit : le nom et la catégorie. Les variantes, le stock et
// l'historique suivent — un nom corrigé l'est partout.
function openEditProductModal(prodId){
  const prod = state.data.products.find(p=>p.id===prodId);
  if(!prod) return;
  let epCategory = prod.category || "";
  openModal(`
    <div class="modal-head"><div class="modal-title">${t("prod.editTitle")}</div>
      <button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="field"><label>${t("prod.name")}</label>
      <input id="epName" value="${esc(prod.name||"")}" placeholder="${t("prod.namePh")}"></div>
    <div class="field"><label>${t("prod.category")}</label>
      <div id="epCatTriggerWrap">${pickerTriggerHtml("epCatTrigger", epCategory, t("prod.chooseCategory"))}</div></div>
    <button class="btn" style="background:var(--gold);" id="epSave">${t("prod.saveChanges")}</button>
  `);

  function updateCatTrigger(){
    document.getElementById("epCatTriggerWrap").innerHTML = pickerTriggerHtml("epCatTrigger", epCategory, t("prod.chooseCategory"));
    document.getElementById("epCatTrigger").onclick = openCatPicker;
  }
  function openCatPicker(){
    openCustomPicker({
      title:t("prod.chooseCategory"),
      selectedValue: epCategory,
      groups:[{items:getCategories().map(c=>({value:c,label:c}))}],
      topAction:{label:t("cat.addAction"), placeholder:t("cat.addProductPh"), onClick:(val)=>{
        const res = addCategory(val);
        if(!res.ok){ alert(res.msg); return; }
        epCategory = val;
        closePicker();
        updateCatTrigger();
        showToast(t("cat.added"));
      }},
      onSelect:(val)=>{ epCategory = val; updateCatTrigger(); }
    });
  }
  updateCatTrigger();

  document.getElementById("epSave").onclick = ()=>{
    const name = document.getElementById("epName").value.trim();
    if(!name){ alert(t("prod.nameRequired")); return; }
    if(!epCategory){ alert(t("cat.chooseAlert")); return; }
    prod.name = name;
    prod.category = epCategory;
    closeModal(); saveData();
    showToast(t("prod.updated"));
  };
}

// Remplace l'aperçu HTML du reçu par son image. Si quoi que ce soit échoue,
// l'aperçu HTML d'origine reste affiché : on ne montre jamais un écran vide.
function showReceiptImagePreview(buildCanvas){
  try{
    const rc = document.getElementById("receiptContent");
    const box = document.getElementById("receiptPreview");
    if(!rc || !box || typeof buildCanvas !== "function") return;
    const canvas = buildCanvas();
    if(!canvas || !canvas.toDataURL) return;
    box.innerHTML = '<img alt="" src="' + canvas.toDataURL("image/png") +
      '" style="width:100%;display:block;border-radius:12px;border:1px solid #e8d4c2;">';
    rc.classList.add("receipt-offscreen");
  }catch(e){ /* l'aperçu HTML reste affiché */ }
}

      onSelect:(val)=>{ mpCategory = val; updateCatTrigger(); }
    });
  }
  updateCatTrigger();

  document.getElementById("mpSave").onclick = ()=>{
    const name = document.getElementById("mpName").value.trim();
    if(!name){ alert(t("prod.nameRequired")); return; }
    if(!mpCategory){ alert(t("cat.chooseAlert")); return; }
    state.data.products.push({id:uid(),name,category:mpCategory});
    closeModal(); saveData();
    showToast(t("prod.added"));
  };
}

function openVariantFormModal(existingVariant){
  const d = state.data;
  if(d.products.length===0){ alert(t("var.createFirst")); return; }
  const isEdit = !!existingVariant;
  let selectedProductId = isEdit ? existingVariant.productId : d.products[0].id;

  openModal(`
    <div class="modal-head"><div class="modal-title">${isEdit?t("var.editTitle"):t("var.newTitle")}</div>
      <button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="field"><label>${t("var.product")}</label>
      <div id="mvProdTriggerWrap"></div></div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;">
      <div class="field"><label>${t("var.color")}</label><input id="mvColor" value="${esc(isEdit?existingVariant.color||"":"")}" placeholder="${t("var.colorPh")}"></div>
      <div class="field"><label>${t("var.size")}</label><input id="mvSize" value="${esc(isEdit?existingVariant.size||"":"")}" placeholder="M"></div>
      <div class="field"><label>${t("var.model")}</label><input id="mvModel" value="${esc(isEdit?existingVariant.model||"":"")}" placeholder="A1"></div>
    </div>
    <div class="field"><label>${t("var.detail")}</label>
      <input id="mvDetail" value="${esc(isEdit?existingVariant.detail||"":"")}" placeholder="${t("var.detailPh")}"></div>
    <div id="mvPreview" style="padding:10px 14px;background:rgba(212,149,106,0.1);border-radius:8px;margin-bottom:14px;font-size:13px;color:var(--goldL);">
      ${t("var.name")} : <strong>${esc(isEdit?existingVariant.label:"Standard")}</strong>
    </div>
    <div class="field"><label>${t("var.setPrice")} (${curSym()}) — ${t("var.optional")}</label>
      <input id="mvSalePrice" type="number" value="${isEdit&&existingVariant.salePrice?Math.round(fromGNF(existingVariant.salePrice,cur())):""}" placeholder="${t("var.pricePh")}"></div>
    <div style="font-size:11px;color:var(--sub);margin-bottom:14px;margin-top:-6px;">
      ${t("var.priceHint")}
    </div>
    <button class="btn" style="background:#6a3080;" id="mvSave">${isEdit?t("var.saveEdit"):t("var.create")}</button>
  `);

  function updateProdTrigger(){
    const prodName = (d.products.find(p=>p.id===selectedProductId)||{}).name || "";
    document.getElementById("mvProdTriggerWrap").innerHTML = pickerTriggerHtml("mvProdTrigger", prodName, t("var.chooseProduct"));
    document.getElementById("mvProdTrigger").onclick = ()=>{
      openCustomPicker({
        title:t("var.chooseProduct"),
        selectedValue: selectedProductId,
        groups:[{items: d.products.map(p=>({value:p.id,label:p.name}))}],
        onSelect:(val)=>{ selectedProductId = val; updateProdTrigger(); }
      });
    };
  }
  updateProdTrigger();

  function buildLabel(){
    const c=document.getElementById("mvColor").value.trim();
    const s=document.getElementById("mvSize").value.trim();
    const m=document.getElementById("mvModel").value.trim();
    const det=document.getElementById("mvDetail").value.trim();
    let label = [c,s,m].filter(Boolean).join(" / ");
    if(det) label = label ? label+" · "+det : det;
    return {c,s,m,det,label: label || "Standard"};
  }
  const upd = ()=>{
    const {label} = buildLabel();
    document.getElementById("mvPreview").innerHTML = `${t("var.name")} : <strong>${esc(label)}</strong>`;
  };
  ["mvColor","mvSize","mvModel","mvDetail"].forEach(id=>document.getElementById(id).oninput=upd);

  document.getElementById("mvSave").onclick = ()=>{
    const {c,s,m,det,label} = buildLabel();
    const priceInput = document.getElementById("mvSalePrice").value;
    const salePriceGNF = priceInput!=="" ? toGNF(+priceInput, cur()) : 0;
    if(isEdit){
      existingVariant.label = label; existingVariant.color=c; existingVariant.size=s; existingVariant.model=m;
      existingVariant.detail = det; existingVariant.salePrice = salePriceGNF;
    } else {
      d.variants.push({id:uid(),productId:selectedProductId,label,color:c,size:s,model:m,detail:det,salePrice:salePriceGNF});
    }
    closeModal(); saveData();
    showToast(isEdit?t("var.editedToast"):t("var.addedToast"));
  };
}
