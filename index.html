// Changer le mot de passe du compte propriétaire. On vérifie d'abord l'ancien mot de
// passe (en se reconnectant) avant d'en poser un nouveau. Nécessite internet.
function openChangePasswordModal(){
  // Les trois champs démarrent toujours masqués (l'œil permet de révéler).
  authUI.showPw.cpCurrent = false; authUI.showPw.cpNew = false; authUI.showPw.cpConfirm = false;
  openModal(`
    <div class="modal-head"><div class="modal-title">${t("au.changePwTitle")}</div>
      <button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="field"><label>${t("au.currentPw")}</label>
      ${pwFieldHtml("cpCurrent","","","current-password")}</div>
    <div class="field"><label>${t("au.newPw")}</label>
      ${pwFieldHtml("cpNew","","","new-password")}</div>
    <div class="field"><label>${t("au.confirmPw")}</label>
      ${pwFieldHtml("cpConfirm","","","new-password")}</div>
    <button class="btn" style="background:var(--gold);" id="cpSave">${t("set.save")}</button>
    <div id="cpMsg" style="font-size:12px;margin-top:10px;text-align:center;line-height:1.4;"></div>
  `);
  bindPwToggle("cpCurrent"); bindPwToggle("cpNew"); bindPwToggle("cpConfirm");
  const msg = document.getElementById("cpMsg");
  function say(text, ok){ msg.style.color = ok ? "var(--green)" : "var(--red)"; msg.textContent = text; }
  document.getElementById("cpSave").onclick = async ()=>{
    const curPw = document.getElementById("cpCurrent").value;
    const nw = document.getElementById("cpNew").value;
    const cf = document.getElementById("cpConfirm").value;
    if(!curPw || !nw || !cf){ say(t("au.pwAllFields")); return; }
    const pwErr = passwordProblem(nw);
    if(pwErr){ say(pwErr); return; }
    if(nw !== cf){ say(t("au.errPwMatch")); return; }
    if(typeof navigator!=="undefined" && navigator.onLine===false){ say(t("au.pwNeedNet")); return; }
    const email = (settings && settings.account && settings.account.email) || "";
    const btn = document.getElementById("cpSave");
    btn.disabled = true;
    msg.style.color = "var(--sub)"; msg.textContent = t("au.pwWorking");
    try{
      // 1) On prouve que c'est bien le titulaire : reconnexion avec l'ancien mot de passe.
      const check = await authSignIn(email, curPw);
      if(!check || !check.ok){ btn.disabled = false; say(t("au.pwWrongCurrent")); return; }
      // 2) On pose le nouveau mot de passe.
      const set = await authSetPassword(nw);
      if(!set || !set.ok){ btn.disabled = false; say(t("au.pwFailed")); return; }
      closeModal();
      showToast(t("au.pwChanged"));
    }catch(e){
      btn.disabled = false; say(t("au.pwFailed"));
    }
  };
}


// Suppression définitive du compte. On efface d'ABORD côté serveur ; seulement si le
// serveur confirme, on efface ce téléphone. Ainsi, si le serveur échoue, rien n'est perdu.
function openDeleteAccountModal(){
  openModal(`
    <div class="modal-head"><div class="modal-title" style="color:var(--red);">${t("au.delAcctTitle")}</div>
      <button class="modal-close" onclick="closeModal()">✕</button></div>
    <div style="background:rgba(224,92,92,0.08);border:1px solid var(--red);border-radius:10px;padding:14px;margin-bottom:16px;font-size:13px;line-height:1.5;">${t("au.delAcctWarn")}</div>
    <div style="font-size:13px;margin-bottom:8px;">${t("rst.confirmA")} <strong style="color:var(--red);">${t("rst.word")}</strong> ${t("rst.confirmB")}</div>
    <input id="delAcctInput" placeholder="${t("rst.typeVerb")} ${t("rst.word")}" autocomplete="off" style="margin-bottom:14px;text-align:center;letter-spacing:1px;">
    <button class="btn" id="delAcctBtn" style="background:#8b2e2e;opacity:0.4;pointer-events:none;">${t("au.delAcctBtn")}</button>
    <div id="delAcctMsg" style="font-size:12px;margin-top:10px;text-align:center;line-height:1.4;"></div>
  `);
  const msg = document.getElementById("delAcctMsg");
  wireResetConfirmInputs("delAcctInput", "delAcctBtn", async ()=>{
    if(typeof navigator!=="undefined" && navigator.onLine===false){
      msg.style.color = "var(--red)"; msg.textContent = t("au.delAcctNeedNet"); return;
    }
    const input = document.getElementById("delAcctInput");
    const btn = document.getElementById("delAcctBtn");
    input.disabled = true; btn.style.pointerEvents = "none"; btn.style.opacity = "0.6";
    msg.style.color = "var(--sub)"; msg.textContent = t("au.delAcctWorking");
    const r = await deleteAccountCall();
    if(!r || !r.ok){
      input.disabled = false; btn.style.pointerEvents = "auto"; btn.style.opacity = "1";
      msg.style.color = "var(--red)"; msg.textContent = t("au.delAcctFailed"); return;
    }
    // Le serveur a confirmé : on ferme la page compte, on efface ce téléphone et on
    // repart à l'accueil (sinon la page « Mon compte » resterait affichée par-dessus).
    closeModal();
    if(typeof closeAccountPage === "function") closeAccountPage();
    performFullReset();
    showToast(t("au.delAcctDone"));
  });
}

function openAddPaymentModal(clientId, clientName, clientPhone, remainingGNF){
  openModal(`
    <div class="modal-head"><div class="modal-title">${t("pay.title")}</div>
      <button class="modal-close" onclick="closeModal()">✕</button></div>
    <div style="font-size:13px;color:var(--sub);margin-bottom:14px;">
      ${t("op.client")} <strong style="color:var(--goldL);">${esc(clientName)}</strong><br>
      ${t("pay.remaining")} <strong style="color:var(--red);">${fmt(remainingGNF)}</strong>
    </div>
    <div class="field"><label>${t("pay.amountNow")} (${curSym()})</label>
      <input type="number" id="payAmount" placeholder="${t("pay.amountPh")}"></div>
    <button class="btn" style="background:var(--green);" id="paySave">${t("pay.save")}</button>
  `);

  document.getElementById("paySave").onclick = ()=>{
    const amountInput = +document.getElementById("payAmount").value;
    if(!amountInput || amountInput<=0){ alert(t("pay.invalidAmount")); return; }
    const amountGNF = toGNF(amountInput, cur());
    if(Math.round(amountGNF) > Math.round(remainingGNF)+1){
      alert(t("pay.tooMuchA")+" ("+fmt(remainingGNF)+")"+t("pay.tooMuchB"));
      return;
    }
    const paymentId = uid();
    const paymentReceiptNo = generateReceiptNumber("PAY");
    state.data.payments.push({id:paymentId, clientId, client:clientName, clientPhone:clientPhone||"", amount:amountGNF, date:todayFR(), receiptNo:paymentReceiptNo,
      recordedBy: (settings && settings.ownerName) || "", recordedById: currentActorId()});
    // On fige immédiatement l'état du compte (payé/reste) tel qu'il est juste après CE paiement —
    // ce reçu ne changera plus jamais ensuite, même si d'autres paiements arrivent par la suite.
    const debtEntryNow = getDebtsByClient().find(c=>c.clientId===clientId);
    const newPayment = state.data.payments[state.data.payments.length-1];
    newPayment.paidSnapshot = debtEntryNow ? debtEntryNow.paid : amountGNF;
    newPayment.remainingSnapshot = debtEntryNow ? debtEntryNow.remaining : 0;
    closeModal(); saveData();
    showToast(t("pay.saved"));
    // Affiche immédiatement la preuve de paiement (reçu dédié), comme pour une vente.
    openPaymentReceiptModal(paymentId);
  };
}

   sur une période donnée (bornes ISO, incluses des deux côtés).

function getReportMovements(fromISO, toISO){
  const d = state.data;
  let movements = [];
  d.purchases.forEach(p=>{
    if(!isCounted(p)) return;
    const iso = frToISO(p.date);
    if(iso && iso>=fromISO && iso<=toISO){
      const total = p.items.reduce((s,i)=>s+i.qty*i.unitCost,0)+(p.deliveryFee||0)+(p.customsFee||0);
      movements.push({_type:"achat", _iso:iso, _id:p.id, date:p.date, total, itemCount:p.items.length});
    }
  });
  getSaleGroups().forEach(g=>{
    if(!isCounted(g)) return;
    const iso = frToISO(g.date);
    if(iso && iso>=fromISO && iso<=toISO){
      const total = g.lines.reduce((s,l)=>s+l.qty*l.salePrice,0);
      movements.push({_type:"vente", _iso:iso, _id:g.id, date:g.date, total, receiptNo:g.receiptNo, client:g.client, isCredit:g.isCredit});
    }
  });
  d.expenses.forEach(e=>{
    if(!isCounted(e)) return;
    const iso = frToISO(e.date);
    if(iso && iso>=fromISO && iso<=toISO){
      movements.push({_type:"depense", _iso:iso, _id:e.id, date:e.date, total:e.amount, label:e.label, category:e.category});
    }
  });
  (d.payments||[]).forEach(p=>{
    if(!isCounted(p)) return;
    const iso = frToISO(p.date);
    if(iso && iso>=fromISO && iso<=toISO){
      movements.push({_type:"paiement", _iso:iso, _id:p.id, date:p.date, total:p.amount, receiptNo:p.receiptNo, client:p.client});
    }
  });
  movements.sort((a,b)=> b._iso.localeCompare(a._iso) || (b._id||"").localeCompare(a._id||""));
  return movements;
}

function movementDescription(m){
  if(m._type==="achat") return m.itemCount+" "+t("op.itemCount");
  if(m._type==="vente") return (m.receiptNo?m.receiptNo+" · ":"")+(m.client?t("op.client")+" "+m.client:t("rep.counterSale"))+(m.isCredit?t("rep.credit"):"");
  if(m._type==="depense"){ const l=(m.label||"").trim(); return l ? (l+(m.category?" · "+m.category:"")) : (m.category||t("exp.defaultLabel")); }
  return (m.receiptNo?m.receiptNo+" · ":"")+(m.client?t("op.client")+" "+m.client:"");
}
function movementTypeIcon(t){ return t==="achat"?"🛒":t==="vente"?"💵":t==="depense"?"💸":"📜"; }
function movementTypeLabel(ty){ return ty==="achat"?t("op.purchase"):ty==="vente"?t("op.sale"):ty==="depense"?t("rep.expenseUpper"):t("op.payment"); }
function isEntree(t){ return t==="vente"||t==="paiement"; }

// Calcule le capital disponible (trésorerie réelle) juste avant une date donnée (ISO exclue) —
// sert de "solde d'ouverture" pour le relevé, exactement comme un vrai relevé bancaire.
function computeCapitalAsOf(beforeISO){
  const d = state.data;
  let totalAchats=0, totalVentes=0, totalCreditSales=0, totalDepenses=0, totalPayments=0;
  for(const p of d.purchases){ if(!isCounted(p)) continue; const iso=frToISO(p.date); if(iso && iso<beforeISO) totalAchats += p.items.reduce((s,i)=>s+i.qty*i.unitCost,0)+(p.deliveryFee||0)+(p.customsFee||0); }
  for(const s of d.sales){ if(!isCounted(s)) continue; const iso=frToISO(s.date); if(iso && iso<beforeISO){ const lt=s.qty*s.salePrice; totalVentes+=lt; if(s.isCredit) totalCreditSales+=lt; } }
  for(const e of d.expenses){ if(!isCounted(e)) continue; const iso=frToISO(e.date); if(iso && iso<beforeISO) totalDepenses += e.amount; }
  for(const p of (d.payments||[])){ if(!isCounted(p)) continue; const iso=frToISO(p.date); if(iso && iso<beforeISO) totalPayments += p.amount||0; }
  const totalCashFromSales = (totalVentes-totalCreditSales)+totalPayments;
  return d.capitalInitial - totalAchats + totalCashFromSales - totalDepenses;
}

// Construit les lignes du relevé en ordre chronologique croissant, avec Débit / Crédit / Solde
// progressif calculés ligne par ligne — comme un vrai relevé de compte. Une vente à crédit
// apparaît (montant visible) mais n'affecte le solde qu'au moment de son paiement effectif,
// exactement comme le fait déjà le calcul du Capital disponible ailleurs dans l'app.
function computeStatementData(fromISO, toISO, filter){
  const allMovements = getReportMovements(fromISO, toISO);
  const filtered = filter==="tout" ? allMovements : allMovements.filter(m=>m._type===filter);
  const chrono = [...filtered].sort((a,b)=> a._iso.localeCompare(b._iso) || (a._id||"").localeCompare(b._id||""));

  const soldeOuverture = computeCapitalAsOf(fromISO);
  let running = soldeOuverture;
  let totalDebit=0, totalCreditEncaisse=0, totalCreditNonEncaisse=0;

  const rows = chrono.map(m=>{
    let debit=0, credit=0, cashImpact=0, note="";
    if(m._type==="achat"){ debit=m.total; cashImpact=-m.total; }
    else if(m._type==="depense"){ debit=m.total; cashImpact=-m.total; }
    else if(m._type==="vente"){
      credit = m.total;
      if(m.isCredit){ cashImpact=0; note=t("st.unpaidNote"); }
      else cashImpact = m.total;
    } else if(m._type==="paiement"){ credit=m.total; cashImpact=m.total; }
    running += cashImpact;
    if(debit>0) totalDebit += debit;
    if(credit>0){ if(cashImpact>0) totalCreditEncaisse += credit; else totalCreditNonEncaisse += credit; }
    return {...m, debit, credit, cashImpact, soldeApres:running, note};
  });

  return { rows, soldeOuverture, soldeCloture:running, totalDebit, totalCreditEncaisse, totalCreditNonEncaisse, count:rows.length, groups: groupRowsByMonth(rows) };
}

function monthLabelFR(iso){
  const p = iso.split("-");
  return monthName(parseInt(p[1],10))+" "+p[0];
}
// Regroupe les lignes (déjà triées chronologiquement) par mois calendaire — comme un relevé
// bancaire qui présente "Juin 2026", puis "Juillet 2026", etc. Le solde progressif, lui,
// continue de courir sur tout le document sans être réinitialisé à chaque groupe.
function groupRowsByMonth(rows){
  const groups = [];
  let current = null;
  rows.forEach(r=>{
    const key = r._iso.slice(0,7);
    if(!current || current.key!==key){
      current = {key, label: monthLabelFR(r._iso), rows:[], debit:0, credit:0};
      groups.push(current);
    }
    current.rows.push(r);
    current.debit += r.debit;
    current.credit += r.credit;
  });
  return groups;
}

function openStatementModal(fromISO, toISO, filter){
  const relNo = "REL-"+randomReceiptCode(3)+"-"+randomReceiptCode(3);
  const meta = {
    relNo, genDate: todayFR(),
    periodLabel: t("st.periodFrom")+" "+isoToFRShort(fromISO)+" "+t("st.periodTo")+" "+isoToFRShort(toISO),
    typeLabel: (filter==="achat"?t("ops.purchases"):filter==="vente"?t("ops.sales"):filter==="depense"?t("nav.expenses"):filter==="paiement"?t("rep.payments"):t("rep.movAll"))
  };
  const data = computeStatementData(fromISO, toISO, filter);

  openModal(`
    <div class="modal-head"><div class="modal-title">${t("st.title")}</div>
      <button class="modal-close" onclick="closeModal()">✕</button></div>
    <div id="statementContent">${renderStatementScreenHtml(data, meta)}</div>
    <div class="grid2" style="margin-top:16px;">
      <button class="btn" style="background:var(--gold);" id="stDownload">${t("st.downloadSummary")}</button>
      <button class="btn" style="background:#1e6640;" id="stShare">${t("rcp.share")}</button>
    </div>
    <button class="btn" style="background:var(--blue);margin-top:10px;" id="stPrint">${t("st.printFull")}</button>
    <div style="font-size:10px;color:var(--sub);text-align:center;margin-top:8px;">${t("st.printHint")}</div>
  `);

  // Image de résumé — pratique pour un partage rapide (WhatsApp...), pas destinée à remplacer
  // le document complet imprimé/PDF (qui, lui, contient le tableau détaillé multi-pages).
  function buildSummaryCanvas(){
    const width = 380;
    const marginX = 22;
    const innerRight = width - 22;
    const headerH = 92;
    const height = 330;

    const canvas = document.createElement("canvas");
    canvas.width = width; canvas.height = height;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#fffaf5"; ctx.fillRect(0,0,width,height);

    const grad = ctx.createLinearGradient(0,0,width,0);
    grad.addColorStop(0,"#7a4fae"); grad.addColorStop(1,"#5c3a8c");
    ctx.fillStyle = grad; ctx.fillRect(0,0,width,headerH);
    ctx.fillStyle = "#ffffff"; ctx.textAlign = "center";
    fitFont(ctx, settings.businessName, width-50, "bold", 18, 12, "Georgia");
    ctx.fillText(settings.businessName, width/2, headerH/2-4);
    ctx.fillStyle = "rgba(255,255,255,0.88)"; ctx.font = "9px Georgia";
    ctx.fillText(t("st.header")+" — "+meta.typeLabel.toUpperCase(), width/2, headerH/2+16);

    let y = headerH + 24;
    ctx.textAlign = "left"; ctx.fillStyle = "#5c463a"; ctx.font = "12px Georgia";
    ctx.fillText(t("st.periodCanvas")+meta.periodLabel, marginX, y);
    y += 16;
    ctx.fillStyle = "#8a6b58"; ctx.font = "10px Georgia";
    ctx.fillText(t("rcp.numberLabel")+" "+meta.relNo+" · "+data.count+" "+t("rep.movementCount"), marginX, y);
    y += 24;

    const lines = [
      [t("st.openingBalance"), fmtNoCur(data.soldeOuverture), "#5c463a"],
      [t("st.totalDebit"), "−"+fmtNoCur(data.totalDebit), "#b5673a"],
      [t("st.totalCredit"), "+"+fmtNoCur(data.totalCreditEncaisse), "#1e6640"],
    ];
    if(data.totalCreditNonEncaisse>0) lines.push([t("st.creditNotReceived"), fmtNoCur(data.totalCreditNonEncaisse), "#b5673a"]);
    lines.forEach(([label,val,color])=>{
      ctx.textAlign = "left"; ctx.fillStyle = "#5c463a"; ctx.font = "11px Georgia";
      ctx.fillText(label, marginX, y);
      ctx.textAlign = "right"; ctx.fillStyle = color; ctx.font = "bold 11px Arial, Helvetica, sans-serif";
      fitFont(ctx, val, 160, "bold", 11, 8);
      ctx.fillText(val, innerRight, y);
      y += 20;
    });

    y += 14;
    ctx.fillStyle = "#2a1a12";
    ctx.fillRect(marginX-8, y-18, (innerRight+8)-(marginX-8), 42);
    ctx.textAlign = "left"; ctx.fillStyle = "#e0c8f0"; ctx.font = "bold 12px Georgia";
    ctx.fillText(t("st.closingBalanceCanvas"), marginX, y+6);
    ctx.textAlign = "right"; ctx.fillStyle = "#ffffff";
    const soldeTxt = fmt(data.soldeCloture);
    fitFont(ctx, soldeTxt, 160, "bold", 14, 9);
    ctx.fillText(soldeTxt, innerRight, y+6);

    y += 44;
    ctx.textAlign = "center"; ctx.fillStyle = "#bba898"; ctx.font = "8px Georgia";
    ctx.fillText(t("st.seePdf"), width/2, y);

    return canvas;
  }

  const fileBase = (lang()==="en"?"Statement_":"Releve_")+fromISO+"_"+toISO;

  document.getElementById("stDownload").onclick = ()=>{
    try{
      const canvas = buildSummaryCanvas();
      const url = canvas.toDataURL("image/png");
      const a = document.createElement("a");
      a.href = url; a.download = fileBase+".png";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    }catch(e){ alert(t("rcp.imageError")); }
  };

  document.getElementById("stShare").onclick = ()=>{
    try{
      const canvas = buildSummaryCanvas();
      canvas.toBlob(async (blob)=>{
        try{
          const file = new File([blob], fileBase+".png", {type:"image/png"});
          if(navigator.canShare && navigator.canShare({files:[file]})){
            await navigator.share({files:[file], title:t("st.shareTitle")+settings.businessName});
          } else if(navigator.share){
            await navigator.share({title:t("st.shareTitle")+settings.businessName, text: meta.periodLabel+" — "+t("st.closingShare")+fmt(data.soldeCloture)});
          } else {
            alert(t("st.shareUnavailable"));
          }
        }catch(e2){ /* utilisateur a annulé le partage, rien à faire */ }
      }, "image/png");
    }catch(e){ alert(t("st.shareFailed")); }
  };

  document.getElementById("stPrint").onclick = ()=>{
    const pa = document.getElementById("printArea");
    if(pa){ pa.innerHTML = renderStatementPrintHtml(data, meta); }
    window.print();
  };

  showReceiptImagePreview(typeof buildCanvas === "function" ? buildCanvas : null);
}


function renderReports(stats){
  const d = state.data;
  const monthSet = new Set([curMonth()]);
  [...d.purchases,...d.sales,...d.expenses].forEach(x=>{ if(x.date) monthSet.add(monthOf(x.date)); });
  const months = Array.from(monthSet).filter(Boolean).sort().reverse();
  if(!state.reportMonth) state.reportMonth = curMonth();
  const selMonth = months.includes(state.reportMonth) ? state.reportMonth : months[0];

  // Détermine la période effective (en ISO, comparable) selon le mode choisi.
  let fromISO, toISO;
  if(state.reportMode==="periode"){
    if(!state.reportDateFrom || !state.reportDateTo){
      const mb = monthBoundsISO(curMonth());
      if(!state.reportDateFrom) state.reportDateFrom = mb.from;
      if(!state.reportDateTo) state.reportDateTo = todayISO();
    }
    fromISO = state.reportDateFrom; toISO = state.reportDateTo;
    if(fromISO > toISO){ const tmp=fromISO; fromISO=toISO; toISO=tmp; } // garde-fou si dates inversées
  } else {
    const mb = monthBoundsISO(selMonth);
    fromISO = mb.from; toISO = mb.to;
  }

  let achats=0, ventes=0, depenses=0, paiementsRecus=0, coutVentes=0;
  const avgCosts = variantAvgCosts();
  for(const p of d.purchases){ if(!isCounted(p)) continue; const iso=frToISO(p.date); if(iso>=fromISO && iso<=toISO) achats += p.items.reduce((s,i)=>s+i.qty*i.unitCost,0)+(p.deliveryFee||0)+(p.customsFee||0); }
  for(const s of d.sales){ if(!isCounted(s)) continue; const iso=frToISO(s.date); if(iso>=fromISO && iso<=toISO){ ventes += s.qty*s.salePrice; coutVentes += s.qty*(avgCosts[s.variantId]||0); } }
  for(const e of d.expenses){ if(!isCounted(e)) continue; const iso=frToISO(e.date); if(iso>=fromISO && iso<=toISO) depenses += e.amount; }
  for(const p of (d.payments||[])){ if(!isCounted(p)) continue; const iso=frToISO(p.date); if(iso>=fromISO && iso<=toISO) paiementsRecus += p.amount||0; }
  // Même définition qu'à l'accueil et que dans le Résumé Global, sans exception :
  // ventes − coût des articles vendus − dépenses.
  const benefice = ventes-coutVentes-depenses;

  const periodLabel = state.reportMode==="periode"
    ? `${t("rep.periodFrom")} ${esc(isoToFRShort(fromISO))} ${t("rep.periodTo")} ${esc(isoToFRShort(toISO))}`
    : `${t("rep.monthOf")} ${esc(selMonth)}`;

  const inventory = d.variants.map(v=>{
    const prod = d.products.find(p=>p.id===v.productId);
    const smd = stats.sm[v.id]||{stock:0,totalCostIn:0,totalQtyIn:0};
    const avgCost = smd.totalQtyIn>0 ? smd.totalCostIn/smd.totalQtyIn : 0;
    return {...v, prod, stock:smd.stock, avgCost, stockVal:smd.stock*avgCost};
  }).filter(v=>v.stock>0);
  const totalStockVal = inventory.reduce((s,v)=>s+v.stockVal,0);

  let html = `${sectionTitle(t("rep.evolution"))}
    <div class="card" style="padding:14px 10px;">
      <canvas id="evoChart" width="320" height="150" style="width:100%;height:150px;display:block;"></canvas>
      <div id="evoChips" class="chip-scroll" style="margin-top:10px;"></div>
    </div>

    ${sectionTitle(t("rep.byPeriod"))}
    <div style="display:flex;gap:6px;margin-bottom:10px;">
      <button class="pill ${state.reportMode==='mois'?'active':''}" data-action="setReportMode" data-mode="mois">${t("rep.month")}</button>
      <button class="pill ${state.reportMode==='periode'?'active':''}" data-action="setReportMode" data-mode="periode">${t("rep.customPeriod")}</button>
    </div>
    ${state.reportMode==="mois"
      ? `<div style="margin-bottom:14px;">${pickerTriggerHtml("monthTrigger", selMonth, t("rep.chooseMonth"))}</div>`
      : `<div class="grid2" style="margin-bottom:14px;gap:10px;">
           <div><div style="font-size:11px;color:var(--sub);margin-bottom:4px;">${t("rep.from")}</div><input type="date" id="reportFromDate" value="${esc(fromISO)}"></div>
           <div><div style="font-size:11px;color:var(--sub);margin-bottom:4px;">${t("rep.to")}</div><input type="date" id="reportToDate" value="${esc(toISO)}"></div>
         </div>`}
    <div style="font-size:11px;color:var(--sub);margin:-6px 0 12px;">${periodLabel}</div>
    <div class="grid2" style="margin-bottom:14px;">
      ${kpi("🛒",t("ops.purchases"),fmt(achats),"var(--red)")}
      ${kpi("💵",t("ops.sales"),fmt(ventes),"var(--green)")}
      ${kpi("💸",t("nav.expenses"),fmt(depenses),"var(--red)")}
      ${kpi("📈",t("rep.netProfit"),fmt(benefice),benefice>=0?"var(--green)":"var(--red)")}
    </div>

    ${sectionTitle(t("rep.movements"))}
    <div id="reportMovementFilterPills" style="display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;">
      <button class="pill ${state.reportMovementFilter==='tout'?'active':''}" data-action="setReportMovementFilter" data-filter="tout">${t("ops.all")}</button>
      <button class="pill ${state.reportMovementFilter==='achat'?'active':''}" data-action="setReportMovementFilter" data-filter="achat">${t("ops.purchases")}</button>
      <button class="pill ${state.reportMovementFilter==='vente'?'active':''}" data-action="setReportMovementFilter" data-filter="vente">${t("ops.sales")}</button>
      <button class="pill ${state.reportMovementFilter==='depense'?'active':''}" data-action="setReportMovementFilter" data-filter="depense">${t("nav.expenses")}</button>
      <button class="pill ${state.reportMovementFilter==='paiement'?'active':''}" data-action="setReportMovementFilter" data-filter="paiement">${t("rep.payments")}</button>
    </div>`;

  const allMovements = getReportMovements(fromISO, toISO);
  const movements = state.reportMovementFilter==="tout" ? allMovements : allMovements.filter(m=>m._type===state.reportMovementFilter);
  const filteredEntrees = movements.filter(m=>m._type==="vente"||m._type==="paiement").reduce((s,m)=>s+m.total,0);
  const filteredSorties = movements.filter(m=>m._type==="achat"||m._type==="depense").reduce((s,m)=>s+m.total,0);
  if(movements.length>0){
    html += `<button class="btn" style="background:var(--blue);margin-bottom:12px;" data-action="openStatement" data-from="${esc(fromISO)}" data-to="${esc(toISO)}" data-filter="${esc(state.reportMovementFilter)}">${t("rep.generateStatement")}</button>`;
  }
  if(movements.length===0){
    html += `<div class="card empty">${t("rep.noMovement")}${state.reportMovementFilter!=="tout"?t("rep.noMovementFilter"):""}.</div>`;
  } else if(!state.reportMovementsExpanded){
    html += `<div class="card" style="cursor:pointer;" data-action="toggleReportMovements">
      <div class="row-between">
        <div>
          <div style="font-size:13px;color:var(--goldL);font-weight:bold;">${movements.length} ${t("rep.movementCount")}</div>
          <div style="font-size:11px;color:var(--sub);margin-top:3px;">${t("rep.tapDetail")}</div>
        </div>
        <div style="text-align:right;">
          <div style="font-size:11px;color:var(--green);">↓ Entrées ${fmt(filteredEntrees)}</div>
          <div style="font-size:11px;color:var(--red);">↑ Sorties ${fmt(filteredSorties)}</div>
        </div>
      </div>
    </div>`;
  } else {
    html += `<div class="row-between" style="cursor:pointer;margin-bottom:8px;" data-action="toggleReportMovements">
      <span style="font-size:11px;color:var(--gold);">${movements.length} ${t("rep.movementCount")} — ${t("rep.tapCollapse")}</span>
      <span style="color:var(--sub);font-size:14px;">▲</span>
    </div>`;
    html += buildReportMovementsHtml(movements);
  }

  html += sectionTitle(t("rep.stockInventory"));

  if(inventory.length===0){
    html += `<div class="card empty">${t("rep.stockEmpty")}</div>`;
  } else if(!state.stockInventoryExpanded){
    html += `<div class="card" style="cursor:pointer;" data-action="toggleStockInventory">
      <div class="row-between">
        <div>
          <div style="font-size:13px;color:var(--goldL);font-weight:bold;">${inventory.length} ${t("rep.itemsInStock")}</div>
          <div style="font-size:11px;color:var(--sub);margin-top:3px;">${t("rep.tapDetail")}</div>
        </div>
        <div style="text-align:right;display:flex;align-items:center;gap:8px;">
          <div>
            <div style="color:var(--gold);font-weight:bold;font-size:15px;">${fmt(totalStockVal)}</div>
            <div style="font-size:10px;color:var(--sub);">${t("rep.totalValue")}</div>
          </div>
          <span style="color:var(--sub);font-size:14px;">▼</span>
        </div>
      </div>
    </div>`;
  } else {
    html += `<div class="card">
      <div class="row-between" style="cursor:pointer;margin-bottom:6px;" data-action="toggleStockInventory">
        <span style="font-size:11px;color:var(--gold);">${inventory.length} ${t("rep.itemsInStock")} ${t("rep.tapCollapse2")}</span>
        <span style="color:var(--sub);font-size:14px;">▲</span>
      </div>`;
    for(const v of inventory){
      html += `<div class="row-between" style="border-bottom:1px solid var(--border);padding:8px 0;">
        <div>
          <div style="font-size:13px;font-weight:bold;">${esc(v.prod?v.prod.name:"?")}</div>
          <div style="font-size:11px;color:var(--sub);">${esc(v.label)} · px moy ${fmt(v.avgCost)}</div>
        </div>
        <div style="text-align:right;">
          <div style="font-weight:bold;color:var(--green);font-size:14px;">${v.stock} pcs</div>
          <div style="font-size:11px;color:var(--sub);">${fmt(v.stockVal)}</div>
        </div>
      </div>`;
    }
    html += `<div class="row-between" style="padding-top:10px;font-weight:bold;">
      <span style="color:var(--goldL);">${t("rep.totalStockValue")}</span>
      <span style="color:var(--gold);font-size:15px;">${fmt(totalStockVal)}</span>
    </div></div>`;
  }

  const totalReceivable = getDebtsByClient().reduce((s,c)=>s+c.remaining,0);
  html += `${sectionTitle(t("rep.globalSummary"))}
    <div class="card">`;
  const rows = [
    [t("home.capitalInitial"),fmt(d.capitalInitial),"var(--blue)"],
    [t("rep.totalInvested"),fmt(stats.totalAchats),"var(--red)"],
    [t("rep.totalSales"),fmt(stats.totalVentes),"var(--green)"],
    [t("rep.totalExpenses"),fmt(stats.totalDepenses),"var(--red)"],
    [t("rep.stockRemaining"),fmt(totalStockVal),"var(--gold)"],
    [t("rep.receivables"),fmt(totalReceivable),"var(--red)"],
    [t("rep.netProfitDone"),(stats.beneficeNet>=0?"+":"")+fmt(stats.beneficeNet),stats.beneficeNet>=0?"var(--green)":"var(--red)"],
  ];
  rows.forEach((r,i)=>{
    html += `<div class="row-between" style="${i<rows.length-1?'border-bottom:1px solid var(--border);':''}padding:8px 0;">
      <span style="font-size:13px;color:var(--sub);">${r[0]}</span>
      <span style="font-size:13px;font-weight:bold;color:${r[2]};">${r[1]}</span>
    </div>`;
  });
  html += `</div>`;
  return html;
}

function drawEvoChart(){
  const canvas = document.getElementById("evoChart");
  if(!canvas || !canvas.getContext) return;
  const months = getLast6MonthsData();
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0,0,W,H);
  const padding = {top:14,right:8,bottom:22,left:8};
  const chartW = W-padding.left-padding.right;
  const chartH = H-padding.top-padding.bottom;
  const n = months.length;
  const maxVal = Math.max(1, ...months.map(m=>Math.max(m.ventes,m.achats)));
  const groupW = chartW/n;
  const barW = groupW*0.3;

  months.forEach((m,i)=>{
    const gx = padding.left + groupW*i;
    const vH = (m.ventes/maxVal)*chartH;
    const aH = (m.achats/maxVal)*chartH;
    ctx.fillStyle = "#5ec98a";
    ctx.fillRect(gx + groupW*0.14, padding.top+chartH-vH, barW, vH);
    ctx.fillStyle = "#e05c5c";
    ctx.fillRect(gx + groupW*0.14 + barW + 4, padding.top+chartH-aH, barW, aH);
    ctx.fillStyle = "#9a8478";
    ctx.font = "9px Georgia";
    ctx.textAlign = "center";
    ctx.fillText(m.label, gx+groupW/2, H-6);
  });

  ctx.fillStyle="#5ec98a"; ctx.fillRect(padding.left, 0, 8, 8);
  ctx.fillStyle="#9a8478"; ctx.font="9px Georgia"; ctx.textAlign="left";
  ctx.fillText("Ventes", padding.left+12, 8);
  ctx.fillStyle="#e05c5c"; ctx.fillRect(padding.left+62, 0, 8, 8);
  ctx.fillStyle="#9a8478";
  ctx.fillText("Achats", padding.left+74, 8);

  const chips = document.getElementById("evoChips");
  if(chips){
    chips.innerHTML = months.map(m=>`
      <div style="flex:0 0 auto;background:${m.benefice>=0?'rgba(94,201,138,0.12)':'rgba(224,92,92,0.12)'};
        border:1px solid ${m.benefice>=0?'rgba(94,201,138,0.3)':'rgba(224,92,92,0.3)'};
        border-radius:8px;padding:6px 10px;text-align:center;min-width:64px;">
        <div style="font-size:9px;color:var(--sub);">${m.label}</div>
        <div style="font-size:11px;font-weight:bold;color:${m.benefice>=0?'var(--green)':'var(--red)'};">${m.benefice>=0?"+":""}${fmt(m.benefice)}</div>
      </div>`).join("");
  }
}

/* ════════════════════════════════════════════════
   MODAL: REÇU DE PAIEMENT — preuve générée à chaque paiement
   reçu sur une dette. Numéro unique séparé (préfixe PAY-),
   format ticket identique à celui des ventes pour la cohérence.
════════════════════════════════════════════════ */
function openPaymentReceiptModal(paymentId){
  const payment = (state.data.payments||[]).find(p=>p.id===paymentId);
  if(!payment) return;

  if(!payment.receiptNo){
    payment.receiptNo = generateReceiptNumber("PAY");
    persist();
  }
  if(payment.paidSnapshot===undefined){
    // Paiement enregistré avant ce correctif : on RECONSTITUE l'état du compte tel qu'il
    // était juste après CE paiement — pas l'état d'aujourd'hui. On additionne les
    // paiements du client jusqu'à celui-ci inclus, dans l'ordre où ils ont été faits.
    const snap = rebuildPaymentSnapshot(payment);
    payment.paidSnapshot = snap.paid;
    payment.remainingSnapshot = snap.remaining;
    persist();
  }

  const totalPaid = payment.paidSnapshot;
  const remaining = payment.remainingSnapshot;
  const isPaidOff = remaining<=0;

  openModal(`
    <div class="modal-head"><div class="modal-title">${t("rcp.paymentTitle")}</div>
      <button class="modal-close" onclick="closeModal()">✕</button></div>
    <div id="receiptPreview" style="max-width:330px;margin:0 auto;"></div>
    <div id="receiptContent" style="background:#fffaf5;color:#2a1a12;border-radius:12px;font-family:Georgia,serif;overflow:hidden;border:1px solid #e8d4c2;max-width:330px;margin:0 auto;">
      <div style="background:linear-gradient(135deg,#5ec98a,#3a9d68);padding:18px 16px 14px;text-align:center;">
        <div style="font-size:18px;font-weight:bold;color:#fff;">${esc(settings.businessName)}</div>
        <div style="font-size:10px;color:rgba(255,255,255,0.88);letter-spacing:0.5px;margin-top:2px;">${t("rcp.paymentHeader")}</div>
      </div>
      <div style="padding:14px 18px 18px;">
        <div style="display:flex;justify-content:space-between;font-size:11px;color:#8a6b58;margin-bottom:8px;">
          <span>N° <strong style="color:#1e6640;font-family:Arial,Helvetica,sans-serif;letter-spacing:0.5px;">${esc(payment.receiptNo)}</strong></span><span style="font-family:Arial,Helvetica,sans-serif;">${payment.date}</span>
        </div>
        <div style="font-size:13px;color:#5c463a;margin-bottom:14px;">
          ${t("op.client")} <strong>${esc(payment.client)}</strong>${payment.clientPhone?` · <span style="font-family:Arial,Helvetica,sans-serif;">${esc(payment.clientPhone)}</span>`:""}
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;padding:11px 14px;background:#2a1a12;border-radius:8px;">
          <span style="font-size:13px;font-weight:bold;color:#9ee6bb;letter-spacing:0.5px;">${t("rcp.amountPaid")}</span>
          <span style="font-size:18px;font-weight:bold;color:#fff;font-family:Arial,Helvetica,sans-serif;">${fmt(payment.amount)}</span>
        </div>
        <div style="margin-top:10px;padding:10px 12px;background:rgba(212,149,106,0.08);border:1px dashed #d4956a;border-radius:8px;">
          <div style="font-size:10px;color:#b5673a;font-weight:bold;letter-spacing:0.5px;margin-bottom:6px;">${t("rcp.accountStatePay")}</div>
          <div style="display:flex;justify-content:space-between;font-size:12px;color:#5c463a;margin-bottom:3px;">
            <span>${t("rcp.totalPaidToDate")}</span><span style="font-weight:bold;color:#1e6640;font-family:Arial,Helvetica,sans-serif;">${fmt(totalPaid)}</span>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:12px;color:#5c463a;">
            <span>${t("rcp.remaining")}</span><span style="font-weight:bold;color:${isPaidOff?'#1e6640':'#b5673a'};font-family:Arial,Helvetica,sans-serif;">${isPaidOff?t("rcp.settled"):fmt(remaining)}</span>
          </div>
        </div>
        <div style="border-top:1px dashed #e0c4a8;margin-top:14px;padding-top:12px;">
          ${payment.recordedBy?`<div style="font-size:11px;color:#5c463a;">${t("rcp.recordedByLabel")} ${esc(payment.recordedBy)}</div>`:""}
          ${settings.contact?`<div style="font-size:11px;color:#5c463a;">${t("rcp.contactLabel")}<span style="font-family:Arial,Helvetica,sans-serif;">${esc(settings.contact)}</span></div>`:""}
        </div>
        <div style="text-align:center;margin-top:14px;font-size:12px;color:#8a6b58;">${t("rcp.thanksPayment")}</div>
        <div style="text-align:center;margin-top:6px;font-size:9px;color:#bba898;">${t("rcp.generatedBy")}</div>
      </div>
    </div>
    <div class="grid2" style="margin-top:16px;">
      <button class="btn" style="background:var(--gold);" id="rcDownload">${t("rcp.download")}</button>
      <button class="btn" style="background:#1e6640;" id="rcShare">${t("rcp.share")}</button>
    </div>
    <button class="btn" style="background:var(--blue);margin-top:10px;" id="rcPrint">${t("rcp.print")}</button>
  `);

  function buildCanvas(){
    const width = 380;
    const marginX = 22;
    const innerRight = width - 22;
    const innerWidth = innerRight - marginX;
    const headerH = 96;
    const amountBarH = 50;
    const statusH = 80;
    const metaH = 50;
    const footerH = 56;
    const height = headerH + 26 + metaH + amountBarH + 14 + statusH + footerH;

    const canvas = document.createElement("canvas");
    canvas.width = width; canvas.height = height;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#fffaf5"; ctx.fillRect(0,0,width,height);

    const grad = ctx.createLinearGradient(0,0,width,0);
    grad.addColorStop(0,"#5ec98a"); grad.addColorStop(1,"#3a9d68");
    ctx.fillStyle = grad; ctx.fillRect(0,0,width,headerH);
    ctx.fillStyle = "#ffffff";
    fitFont(ctx, settings.businessName, width-50, "bold", 19, 13, "Georgia");
    ctx.textAlign = "center";
    ctx.fillText(settings.businessName, width/2, headerH/2-2);
    ctx.fillStyle = "rgba(255,255,255,0.88)"; ctx.font = "10px Georgia";
    ctx.fillText(t("rcp.paymentHeader"), width/2, headerH/2+17);

/* ════════════════════════════════════════════════
   MODAL: REÇU DE VENTE — version professionnelle
   (tableau structuré, couleurs RegistrePro, contact,
   vendu par, numéro unique, mention de bas de page)
════════════════════════════════════════════════ */
function wrapTruncate(ctx, text, maxWidth){
  if(ctx.measureText(text).width <= maxWidth) return text;
  let t = text;
  while(t.length>0 && ctx.measureText(t+"…").width > maxWidth) t = t.slice(0,-1);
  return t+"…";
}
// Pour le ticket étroit : si la désignation est trop longue pour une seule ligne,
// on la fait passer sur 2 lignes (en coupant sur un espace si possible) plutôt que
// de la tronquer brutalement — plus lisible et plus professionnel.
function wrapTwoLines(ctx, text, maxWidth, font){
  ctx.font = font;
  if(ctx.measureText(text).width <= maxWidth) return [text];
  const words = text.split(" ");
  let line1 = "", i = 0;
  for(; i<words.length; i++){
    const test = line1 ? line1+" "+words[i] : words[i];
    if(ctx.measureText(test).width <= maxWidth){ line1 = test; } else break;
  }
  if(i===0){ line1 = wrapTruncate(ctx, words[0], maxWidth); i = 1; }
  let line2 = words.slice(i).join(" ");
  if(line2) line2 = wrapTruncate(ctx, line2, maxWidth);
  return line2 ? [line1, line2] : [line1];
}

// Réduit progressivement la taille de police jusqu'à ce que le texte rentre dans
// l'espace alloué — garantit qu'aucun montant ne pourra jamais chevaucher la colonne
// voisine, même avec un très gros chiffre. Utilisée par les deux types de reçus
// (vente et paiement).
function fitFont(ctx, text, maxWidth, weight, baseSize, minSize, family){
  family = family || "Arial, Helvetica, sans-serif";
  let size = baseSize;
  const build = (s)=> (weight?weight+" ":"") + s + "px " + family;
  ctx.font = build(size);
  while(ctx.measureText(text).width > maxWidth && size > minSize){
    size -= 1;
    ctx.font = build(size);
  }
  return size;
}

function openReceiptModal(groupId){
  const groups = getSaleGroups();
  const group = groups.find(g=>g.id===groupId);
  if(!group) return;
  const d = state.data;

  if(!group.receiptNo){
    const newNo = generateReceiptNumber();
    state.data.sales.forEach(s=>{ if((s.groupId||s.id)===group.id) s.receiptNo = newNo; });
    persist();
    group.receiptNo = newNo;
  }

  const lines = group.lines.map(s=>{
    const label = itemReceiptLabel(s);
    const total = s.qty*s.salePrice;
    return {label, qty:s.qty, price:s.salePrice, total};
  });
  const grandTotal = lines.reduce((s,l)=>s+l.total,0);
  const receiptNo = group.receiptNo;

  // Pour une vente à crédit, on affiche l'état du compte du client TEL QU'IL ÉTAIT au moment
  // de cette vente — figé une fois pour toutes, pour que ce reçu reste un document fixe et ne
  // change plus jamais, même si d'autres paiements arrivent ensuite (chaque paiement génère son
  // propre reçu séparé, sans jamais modifier les reçus déjà émis).
  let accountStatus = null;
  if(group.isCredit && group.clientId){
    const firstLine = group.lines[0];
    if(firstLine && firstLine.accountPaidSnapshot===undefined){
      // Reçu créé avant ce correctif (migration douce, une seule fois) : on fige maintenant
      // l'état actuel comme meilleure estimation possible, puis ça ne bougera plus jamais.
      const debtEntry = getDebtsByClient().find(c=>c.clientId===group.clientId);
      const snapPaid = debtEntry ? debtEntry.paid : 0;
      const snapRemaining = debtEntry ? debtEntry.remaining : 0;
      state.data.sales.forEach(s=>{ if((s.groupId||s.id)===group.id){ s.accountPaidSnapshot = snapPaid; s.accountRemainingSnapshot = snapRemaining; } });
      persist();
      firstLine.accountPaidSnapshot = snapPaid;
      firstLine.accountRemainingSnapshot = snapRemaining;
    }
    if(firstLine){
      accountStatus = { paid: firstLine.accountPaidSnapshot||0, remaining: firstLine.accountRemainingSnapshot||0, isPaidOff: (firstLine.accountRemainingSnapshot||0)<=0 };
    }
  }

  const lineRowsHtml = lines.map((l,i)=>`
    <div style="padding:9px 0;${i<lines.length-1?'border-bottom:1px dashed #e8d4c2;':''}">
      <div style="font-size:13px;color:#2a1a12;">${esc(l.label)}</div>

        <span style="font-size:12px;color:#8a6b58;">${l.qty} × ${fmtNoCur(l.price)}</span>
        <span style="font-size:13px;color:#2a1a12;font-weight:bold;">${fmtNoCur(l.total)}</span>

    </div>`).join("");

  openModal(`
    <div class="modal-head"><div class="modal-title">${t("rcp.saleTitle")}</div>
      <button class="modal-close" onclick="closeModal()">✕</button></div>
    <div id="receiptPreview" style="max-width:330px;margin:0 auto;"></div>
    <div id="receiptContent" style="background:#fffaf5;color:#2a1a12;border-radius:12px;font-family:Georgia,serif;overflow:hidden;border:1px solid #e8d4c2;max-width:330px;margin:0 auto;">
      <div style="background:linear-gradient(135deg,#d4956a,#c97f4f);padding:18px 16px 14px;text-align:center;">
        <div style="font-size:18px;font-weight:bold;color:#fff;">${esc(settings.businessName)}</div>
        <div style="font-size:10px;color:rgba(255,255,255,0.88);letter-spacing:0.5px;margin-top:2px;">${t("rcp.saleHeader")}</div>
      </div>
      <div style="padding:14px 18px 4px;">
        <div style="display:flex;justify-content:space-between;font-size:11px;color:#8a6b58;margin-bottom:4px;">
          <span>N° <strong style="color:#b5673a;font-family:Arial,Helvetica,sans-serif;letter-spacing:0.5px;">${esc(receiptNo)}</strong></span><span style="font-family:Arial,Helvetica,sans-serif;">${group.date}</span>
        </div>
        ${group.isCredit?`<div style="font-size:10px;color:#b5673a;font-weight:bold;letter-spacing:0.5px;margin-bottom:4px;">${t("rcp.creditSale")}</div>`:""}
        ${(group.client||group.clientPhone) ? `<div style="font-size:12px;color:#5c463a;margin-bottom:6px;">
          ${group.client?`${t("op.client")} <strong>${esc(group.client)}</strong>`:""}${(group.client&&group.clientPhone)?" · ":""}${group.clientPhone?`<span style="font-family:Arial,Helvetica,sans-serif;">${esc(group.clientPhone)}</span>`:""}
        </div>`:""}
        <div style="border-top:2px solid #d4956a;margin-top:8px;padding-top:2px;">
          ${lineRowsHtml}
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding:11px 14px;background:#2a1a12;border-radius:8px;">
          <span style="font-size:13px;font-weight:bold;color:#f0c09a;letter-spacing:0.5px;">${t("rcp.total")}</span>
          <span style="font-size:18px;font-weight:bold;color:#fff;font-family:Arial,Helvetica,sans-serif;">${fmt(grandTotal)}</span>
        </div>
        ${accountStatus?`<div style="margin-top:10px;padding:10px 12px;background:rgba(212,149,106,0.08);border:1px dashed #d4956a;border-radius:8px;">
          <div style="font-size:10px;color:#b5673a;font-weight:bold;letter-spacing:0.5px;margin-bottom:6px;">${t("rcp.accountStateSale")}</div>
          <div style="display:flex;justify-content:space-between;font-size:12px;color:#5c463a;margin-bottom:3px;">
            <span>${t("rcp.paidToDate")}</span><span style="font-weight:bold;color:#1e6640;font-family:Arial,Helvetica,sans-serif;">${fmt(accountStatus.paid)}</span>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:12px;color:#5c463a;">
            <span>${t("rcp.remaining")}</span><span style="font-weight:bold;color:${accountStatus.isPaidOff?'#1e6640':'#b5673a'};font-family:Arial,Helvetica,sans-serif;">${accountStatus.isPaidOff?t("rcp.settledShort"):fmt(accountStatus.remaining)}</span>
          </div>
        </div>`:""}
      </div>
      <div style="padding:14px 18px 18px;border-top:1px dashed #e0c4a8;margin-top:6px;">
        ${group.sellerName?`<div style="font-size:11px;color:#5c463a;">${t("rcp.soldByLabel")} ${esc(group.sellerName)}</div>`:""}
        ${settings.contact?`<div style="font-size:11px;color:#5c463a;">${t("rcp.contactLabel")}<span style="font-family:Arial,Helvetica,sans-serif;">${esc(settings.contact)}</span></div>`:""}
        <div style="text-align:center;margin-top:12px;font-size:12px;color:#8a6b58;">${t("rcp.thanksSale")}</div>
        <div style="text-align:center;margin-top:6px;font-size:9px;color:#bba898;">${t("rcp.generatedBy")}</div>
      </div>
    </div>
    <div class="grid2" style="margin-top:16px;">
      <button class="btn" style="background:var(--gold);" id="rcDownload">${t("rcp.download")}</button>
      <button class="btn" style="background:#1e6640;" id="rcShare">${t("rcp.share")}</button>
    </div>
    <button class="btn" style="background:var(--blue);margin-top:10px;" id="rcPrint">${t("rcp.print")}</button>
  `);

  function buildCanvas(){
    const width = 380;            // ticket étroit, façon pharmacie/restaurant
    const marginX = 22;
    const innerRight = width - 22;
    const innerWidth = innerRight - marginX;
    const headerH = 96;

    // Canvas temporaire utilisé uniquement pour MESURER le texte avant de connaître
    // la hauteur finale (on ne peut pas mesurer sans contexte, et la hauteur du
    // ticket dépend du nombre de lignes que prendront les désignations longues).
    const measureCanvas = document.createElement("canvas");
    const mctx = measureCanvas.getContext("2d");

    const lineBlocks = lines.map(l=>{
      const wrapped = wrapTwoLines(mctx, l.label, innerWidth, "13px Georgia");
      return { ...l, labelLines: wrapped, blockH: 18*wrapped.length + 18 + 10 };
    });
    const itemsH = lineBlocks.reduce((s,b)=>s+b.blockH, 0);

    let metaH = 40;
    if(group.client||group.clientPhone) metaH += 16;
    if(group.isCredit) metaH += 16;
    const totalBarH = 54;
    const accountStatusH = accountStatus ? 68 : 0;
    let footerH = 30;
    if(group.sellerName) footerH += 17;
    if(settings.contact) footerH += 17;
    footerH += 48;

    const height = headerH + metaH + itemsH + 18 + totalBarH + accountStatusH + footerH;

    const canvas = document.createElement("canvas");
    canvas.width = width; canvas.height = height;
    const ctx = canvas.getContext("2d");

    ctx.fillStyle = "#fffaf5"; ctx.fillRect(0,0,width,height);

    const grad = ctx.createLinearGradient(0,0,width,0);
    grad.addColorStop(0,"#d4956a"); grad.addColorStop(1,"#c97f4f");
    ctx.fillStyle = grad; ctx.fillRect(0,0,width,headerH);
    ctx.fillStyle = "#ffffff";
    fitFont(ctx, settings.businessName, width-50, "bold", 19, 13, "Georgia");
    ctx.textAlign = "center";
    ctx.fillText(settings.businessName, width/2, headerH/2-2);
    ctx.fillStyle = "rgba(255,255,255,0.88)"; ctx.font = "10px Georgia";
    ctx.fillText(t("rcp.saleHeader"), width/2, headerH/2+17);

    let y = headerH + 24;
    ctx.fillStyle = "#8a6b58"; ctx.font = "11px Georgia"; ctx.textAlign = "left";
    ctx.fillText(t("rcp.numberLabel"), marginX, y);
    ctx.font = "bold 11px Arial, Helvetica, sans-serif"; ctx.fillStyle = "#b5673a";
    ctx.fillText(receiptNo, marginX+16, y);
    ctx.fillStyle = "#8a6b58"; ctx.font = "11px Arial, Helvetica, sans-serif"; ctx.textAlign = "right";
    ctx.fillText(group.date, innerRight, y);

    if(group.isCredit){
      y += 16;
      ctx.fillStyle = "#b5673a"; ctx.font = "bold 10px Georgia"; ctx.textAlign = "left";
      ctx.fillText(t("rcp.creditSale"), marginX, y);
    }

    if(group.client || group.clientPhone){
      y += 18;
      ctx.fillStyle = "#5c463a"; ctx.font = "11px Georgia"; ctx.textAlign = "left";
      let line = "";
      if(group.client) line += t("op.client")+" "+group.client;
      if(group.clientPhone) line += (line?" · ":"")+group.clientPhone;
      ctx.fillText(wrapTruncate(ctx, line, innerWidth), marginX, y);
    }

    y += 22;
    ctx.strokeStyle = "#d4956a"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(marginX,y); ctx.lineTo(innerRight,y); ctx.stroke();
    y += 18;

    lineBlocks.forEach((b)=>{
      ctx.fillStyle = "#2a1a12"; ctx.font = "13px Georgia"; ctx.textAlign = "left";
      b.labelLines.forEach(lineTxt=>{ ctx.fillText(lineTxt, marginX, y); y += 16; });

      // "qté × prix unitaire" à gauche, sous-total à droite — montants SANS devise
      // (la devise n'apparaît qu'une seule fois, sur la ligne TOTAL finale).
      const qtyPriceTxt = b.qty+" × "+fmtNoCur(b.price);
      ctx.textAlign = "left";
      fitFont(ctx, qtyPriceTxt, innerWidth*0.55, "", 12, 9);
      ctx.fillStyle = "#8a6b58";
      ctx.fillText(qtyPriceTxt, marginX, y);

      const subTotalTxt = fmtNoCur(b.total);
      ctx.textAlign = "right";
      fitFont(ctx, subTotalTxt, innerWidth*0.42, "bold", 13, 9);
      ctx.fillStyle = "#2a1a12";
      ctx.fillText(subTotalTxt, innerRight, y);

      y += 24;
    });

    y += 4;
    ctx.fillStyle = "#2a1a12";
    ctx.fillRect(marginX-8, y-25, (innerRight+8)-(marginX-8), totalBarH-10);
    ctx.fillStyle = "#f0c09a"; ctx.font = "bold 13px Georgia"; ctx.textAlign = "left";
    ctx.fillText(t("rcp.total"), marginX, y);
    ctx.textAlign = "right";
    const grandTotalTxt = fmt(grandTotal); // seule ligne du reçu où la devise est affichée
    fitFont(ctx, grandTotalTxt, innerWidth-70, "bold", 17, 10);
    ctx.fillStyle = "#ffffff";
    ctx.fillText(grandTotalTxt, innerRight, y);

    y += totalBarH-14;

    if(accountStatus){
      y += 12;
      ctx.strokeStyle = "#d4956a"; ctx.lineWidth = 1; ctx.setLineDash([3,3]);
      ctx.strokeRect(marginX-8, y-16, (innerRight+8)-(marginX-8), accountStatusH-12);
      ctx.setLineDash([]);
      ctx.fillStyle = "#b5673a"; ctx.font = "bold 9px Georgia"; ctx.textAlign = "left";
      ctx.fillText(t("rcp.accountStateSale"), marginX, y);
      y += 18;
      ctx.fillStyle = "#5c463a"; ctx.font = "11px Georgia"; ctx.textAlign = "left";
      ctx.fillText(t("rcp.paidToDate"), marginX, y);
      const paidTxt = fmtNoCur(accountStatus.paid);
      ctx.textAlign = "right"; ctx.fillStyle = "#1e6640";
      fitFont(ctx, paidTxt, innerWidth*0.4, "bold", 11, 8);
      ctx.fillText(paidTxt, innerRight, y);
      y += 17;
      ctx.fillStyle = "#5c463a"; ctx.font = "11px Georgia"; ctx.textAlign = "left";
      ctx.fillText(t("rcp.remaining"), marginX, y);
      const remainingTxt = accountStatus.isPaidOff ? t("rcp.settledShort") : fmtNoCur(accountStatus.remaining);
      ctx.textAlign = "right"; ctx.fillStyle = accountStatus.isPaidOff ? "#1e6640" : "#b5673a";
      fitFont(ctx, remainingTxt, innerWidth*0.4, "bold", 11, 8);
      ctx.fillText(remainingTxt, innerRight, y);
      y += 14;
    }

    ctx.strokeStyle = "#e0c4a8"; ctx.beginPath(); ctx.moveTo(marginX,y); ctx.lineTo(innerRight,y); ctx.stroke();
    y += 20;
    ctx.fillStyle = "#5c463a"; ctx.font = "10px Georgia"; ctx.textAlign = "left";
    if(group.sellerName){ ctx.fillText(t("rcp.soldByLabel")+" "+group.sellerName, marginX, y); y += 16; }
    if(settings.contact){
      ctx.font = "10px Georgia"; ctx.fillText(t("rcp.contactLabel"), marginX, y);
      ctx.font = "10px Arial, Helvetica, sans-serif";
      ctx.fillText(settings.contact, marginX + ctx.measureText(t("rcp.contactLabel")).width, y);
      y += 16;
    }
    y += 10;
    ctx.fillStyle = "#8a6b58"; ctx.font = "11px Georgia"; ctx.textAlign = "center";
    ctx.fillText(t("rcp.thanksSale"), width/2, y);
    y += 16;
    ctx.fillStyle = "#bba898"; ctx.font = "8px Georgia";
    ctx.fillText(t("rcp.generatedBy"), width/2, y);

    return canvas;
  }

  document.getElementById("rcDownload").onclick = ()=>{
    try{
      const canvas = buildCanvas();
      const url = canvas.toDataURL("image/png");
      const a = document.createElement("a");
      a.href = url; a.download = receiptNo+".png";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    }catch(e){ alert(t("rcp.imageError")); }
  };

  document.getElementById("rcShare").onclick = ()=>{
    try{
      const canvas = buildCanvas();
      canvas.toBlob(async (blob)=>{
        try{
          const file = new File([blob], receiptNo+".png", {type:"image/png"});
          if(navigator.canShare && navigator.canShare({files:[file]})){
            await navigator.share({files:[file], title:t("rcp.shareSale")});
          } else if(navigator.share){
            await navigator.share({title:t("rcp.shareSale"), text: settings.businessName+" - "+receiptNo+" - "+t("rcp.total")+": "+fmt(grandTotal)});
          } else {
            alert(t("rcp.shareUnavailable"));
          }
        }catch(e2){ /* utilisateur a annulé le partage, rien à faire */ }
      }, "image/png");
    }catch(e){ alert(t("rcp.shareFailed")); }
  };

  document.getElementById("rcPrint").onclick = ()=>{
    const pa = document.getElementById("printArea");
    const rc = document.getElementById("receiptContent");
    if(pa && rc){
      // On imprime le reçu en pleine page : la copie ne garde pas le décalage hors écran.
      const printable = rc.cloneNode(true);
      printable.classList.remove("receipt-offscreen");
      pa.innerHTML = printable.outerHTML;
    }
    window.print();
  };

  showReceiptImagePreview(typeof buildCanvas === "function" ? buildCanvas : null);
}

/* ════════════════════════════════════════════════
   PWA: SERVICE WORKER REGISTRATION
════════════════════════════════════════════════ */
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("service-worker.js").catch(()=>{});
  });
}

/* ════════════════════════════════════════════════
   INIT
════════════════════════════════════════════════ */
// Une inscription (ou une réinitialisation) interrompue par le déchargement de
// l'application se reprend là où elle en était. À faire AVANT le premier affichage,
// sans quoi l'écran d'accueil s'afficherait puis sauterait.
restorePendingOtp();
checkLockOrRender();
// Après l'affichage : si on a du réseau, on rafraîchit discrètement les taux du jour
// et on renouvelle la session du compte. Sans réseau, rien ne bloque : l'application
// continue de fonctionner hors ligne, c'est le principe.
refreshRatesInBackground();
authRefreshSession();
// Synchronisation complète au démarrage (envoi puis réception), puis en boucle
// discrète tant que l'application reste ouverte.
if(typeof startSyncLoop === "function" && settings && settings.account && auth && auth.access_token){
  startSyncLoop();
}
// Quand le réseau revient, on rattrape aussitôt.
try{ window.addEventListener("online", function(){ if(typeof syncFull==="function") syncFull(); }); }catch(e){}

/* ════════════════════════════════════════════════
   BOUTON RETOUR DU TÉLÉPHONE (Android)
   ════════════════════════════════════════════════
   Sans cela, la flèche « retour » du téléphone quitte l'application d'un coup, même
   quand une fenêtre, une liste ou la page « Mon compte » est ouverte. On veut qu'elle
   ferme d'abord ce qui est ouvert, couche par couche, et ne quitte l'application que
   lorsqu'il n'y a plus rien à fermer.

   Le principe : à chaque ouverture, on dépose un « repère » dans l'historique du
   navigateur. Le bouton retour retire ce repère au lieu de sortir ; on en profite pour
   fermer la couche du dessus. On garde toujours un repère d'avance pour rester devant
   la vraie sortie.
════════════════════════════════════════════════ */
(function backButton(){
  try{ history.replaceState({rp:true}, ""); }catch(e){ return; }

  function topLayerClose(){
    const ov = document.getElementById("accountPageRoot");
    if(ov && ov.style.display !== "none" && ov.innerHTML.trim()){ return closeAccountPage; }
    const picker = document.getElementById("pickerRoot");
    if(picker && picker.innerHTML.trim()){ return closePicker; }
    const modal = document.getElementById("modalRoot");
    if(modal && modal.innerHTML.trim()){ return closeModal; }
    return null;
  }

  // Appelée par chaque fonction d'ouverture (openModal, openCustomPicker, openAccountPage…).
  // Dépose un repère dans l'historique : le prochain retour du téléphone le retirera au
  // lieu de quitter l'application.
  window.rpArmBack = function(){
    try{ history.pushState({rp:true, guard:true}, ""); }catch(e){}
  };

  window.addEventListener("popstate", function(){
    const closer = topLayerClose();
    if(closer){
      closer();
      // Une couche pouvait en cacher une autre : si oui, on garde un repère devant.
      if(topLayerClose()) window.rpArmBack();
    }
    // Rien d'ouvert : on laisse le retour suivre son cours (l'app peut se fermer).
  });
})();
</script>
