// Nombre de commandes encore en attente (pour le badge de la pilule).
function pendingOrdersCount(){
  return (state.data.orders||[]).filter(o=>(o.status||"pending")==="pending").length;
}

/* ────────────────────────────────────────────────
   COMMANDES (réservations)
   Une commande est une PROMESSE, pas une vente : le client a réservé mais n'a
   rien reçu et n'a rien payé. Elle ne compte donc NULLE PART — ni dans le Capital,
   ni dans les ventes, ni dans le stock. Le jour où elle est livrée, elle crée une
   vraie vente (comptant ou à crédit) : c'est SEULEMENT à ce moment que l'argent
   et le stock bougent. Statuts : "pending" | "delivered" | "cancelled".
──────────────────────────────────────────────── */
function orderTotalGNF(o){
  return (o.items||[]).reduce((sum,it)=>sum + (it.qty||0)*(it.salePrice||0), 0);
}

function buildOrdersListHtml(){
  const d = state.data;
  const all = d.orders || [];
  const search = normalizeCode(state.orderSearch||"");
  const rawSearch = (state.orderSearch||"").trim().toLowerCase();

  const filtered = all.filter(o=>{
    if((o.status||"pending") !== state.orderFilter) return false;
    if(!rawSearch) return true;
    if((o.client||"").toLowerCase().includes(rawSearch)) return true;
    if((o.clientPhone||"").toLowerCase().includes(rawSearch)) return true;
    if(normalizeCode(o.orderNo||"").includes(search)) return true;
    return false;
  }).sort((a,b)=> frToISO(b.date||"").localeCompare(frToISO(a.date||"")));

  const counts = {
    pending: all.filter(o=>(o.status||"pending")==="pending").length,
    delivered: all.filter(o=>o.status==="delivered").length,
    cancelled: all.filter(o=>o.status==="cancelled").length
  };

  let html = `<div style="display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;">
    <button class="pill ${state.orderFilter==='pending'?'active':''}" data-action="setOrderFilter" data-filter="pending">${t("order.pending")} (${counts.pending})</button>
    <button class="pill ${state.orderFilter==='delivered'?'active':''}" data-action="setOrderFilter" data-filter="delivered">${t("order.delivered")} (${counts.delivered})</button>
    <button class="pill ${state.orderFilter==='cancelled'?'active':''}" data-action="setOrderFilter" data-filter="cancelled">${t("order.cancelled")} (${counts.cancelled})</button>
  </div>`;

  if(!filtered.length){
    const empty = state.orderFilter==="pending" ? t("order.emptyPending")
      : state.orderFilter==="delivered" ? t("order.emptyDelivered")
      : t("order.emptyCancelled");
    html += `<div class="card" style="text-align:center;color:var(--sub);font-size:13px;padding:22px;">${empty}</div>`;
    return html;
  }

  filtered.forEach(o=>{
    const status = o.status||"pending";
    const isOpen = state.expandedOrders.has(o.id);
    const items = o.items||[];
    const preview = items.slice(0,2).map(it=>{
      const nm = itemFullName(it);
      return `${it.qty} × ${esc(nm || t("op.deletedItem"))}`;
    }).join("<br>");
    const more = items.length>2 ? `<div style="font-size:11px;color:var(--gold);">+ ${items.length-2} ${t("op.moreView")}</div>` : "";
    const fullItems = items.map(it=>{
      const v = d.variants.find(x=>x.id===it.variantId);
      const p = v ? d.products.find(x=>x.id===v.productId) : null;
      return `<div class="row-between" style="font-size:12px;padding:3px 0;">
        <span>${it.qty} × ${esc(v?((p?p.name+" — ":"")+v.label):t("op.deletedItem"))}</span>
        <span style="color:var(--sub);">${fmt((it.qty||0)*(it.salePrice||0))}</span>
      </div>`;
    }).join("");

    const badge = status==="pending" ? `<span style="background:rgba(91,155,213,0.18);color:var(--blue);padding:2px 8px;border-radius:20px;font-size:10px;">${t("order.pending")}</span>`
      : status==="delivered" ? `<span style="background:rgba(94,201,138,0.18);color:var(--green);padding:2px 8px;border-radius:20px;font-size:10px;">${t("order.deliveredBadge")}</span>`
      : `<span style="background:rgba(224,92,92,0.18);color:var(--red);padding:2px 8px;border-radius:20px;font-size:10px;">${t("order.cancelledBadge")}</span>`;

    html += `<div class="card">
      <div class="row-between" style="align-items:flex-start;gap:8px;cursor:pointer;" data-action="toggleOrder" data-id="${o.id}">
        <div style="flex:1;min-width:0;">
          <div style="font-size:14px;color:var(--goldL);font-weight:bold;">${esc(o.client||t("ord.noClientName"))}</div>
          <div style="font-size:11px;color:var(--sub);">${esc(o.orderNo||"")} · ${esc(o.date||"")}</div>
        </div>
        <div style="text-align:right;">
          <div style="color:var(--goldL);font-weight:bold;white-space:nowrap;">${fmt(orderTotalGNF(o))}</div>
          <div style="margin-top:4px;">${badge}</div>
        </div>
      </div>
      <div style="border-top:1px solid var(--border);margin:10px 0;padding-top:8px;font-size:12px;">
        ${isOpen ? fullItems : preview + more}
      </div>
      ${o.clientPhone?`<div style="font-size:11px;color:var(--sub);">📞 ${esc(o.clientPhone)}</div>`:""}
      ${o.deliveryPlace?`<div style="font-size:11px;color:var(--sub);">📍 ${esc(o.deliveryPlace)}</div>`:""}
      ${o.dueDate?`<div style="font-size:11px;color:var(--sub);">${t("order.dueDate")} ${esc(o.dueDate)}</div>`:""}
      ${o.note?`<div style="font-size:11px;color:var(--sub);font-style:italic;">📝 ${esc(o.note)}</div>`:""}
      ${status==="delivered" && o.saleGroupId ? `<div style="font-size:11px;color:var(--green);margin-top:6px;cursor:pointer;text-decoration:underline;" data-action="openReceipt" data-id="${esc(o.saleGroupId)}">${t("order.viewSale")}</div>` : ""}
      <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:10px;">
        ${orderActionButtons(o)}
      </div>
    </div>`;
  });
  return html;
}

function orderActionButtons(o){
  const status = o.status||"pending";
  const receiptBtn = `<button class="del-btn" style="background:rgba(212,149,106,0.12);color:var(--gold);" data-action="openOrderReceipt" data-id="${o.id}">${t("order.receipt")}</button>`;
  if(status==="pending"){
    return `${receiptBtn}
      <button class="del-btn" style="background:rgba(94,201,138,0.15);color:var(--green);" data-action="deliverOrder" data-id="${o.id}">${t("order.deliver")}</button>
      <button class="del-btn" style="background:rgba(91,155,213,0.15);color:var(--blue);" data-action="editOrder" data-id="${o.id}">${t("btn.edit")}</button>
      <button class="del-btn" data-action="cancelOrder" data-id="${o.id}">${t("order.cancel")}</button>`;
  }
  if(status==="cancelled"){
    return `${receiptBtn}
      <button class="del-btn" style="background:rgba(94,201,138,0.15);color:var(--green);" data-action="reopenOrder" data-id="${o.id}">${t("order.reopen")}</button>
      ${sellerRO() ? "" : `<button class="del-btn" data-action="permDeleteOrder" data-id="${o.id}">${t("order.permDelete")}</button>`}`;
  }
  // livrée : on ne touche plus à rien (la vente existe), on peut juste consulter le reçu
  return receiptBtn;
}

// Construit les boutons d'action d'une carte achat/vente selon son statut actuel —
// actif (courant), archivé (rangé, argent compté) ou corbeille (supprimé, récupérable).
// Archiver / Supprimer sont écrits en toutes lettres (pas juste une icône) : la distinction
// entre les deux est cruciale pour l'argent compté, elle doit être visible sans avoir à cliquer.
function opActionButtons(op){
  const status = op.status||"active";
  const isVente = op._type==="vente";

  // Un vendeur voit toutes les opérations de la boutique — il peut ainsi retrouver
  // le reçu d'un client servi par un collègue absent. Mais il ne MODIFIE que ses
  // propres ventes, et ne touche jamais aux achats, qui ne le concernent pas.
  if(typeof isSeller === "function" && isSeller()){
    const receiptOnly = isVente ? `<button class="del-btn" style="background:rgba(212,149,106,0.12);color:var(--gold);" data-action="openReceipt" data-id="${op.id}">🧾</button>` : "";
    const mine = isVente && (typeof canEditSale === "function") && canEditSale(op);
    if(!mine) return receiptOnly;
  }

  const receiptBtn = isVente ? `<button class="del-btn" style="background:rgba(212,149,106,0.12);color:var(--gold);" data-action="openReceipt" data-id="${op.id}">🧾</button>` : "";
  const editAction = isVente ? "editSaleGroup" : "editPurchase";
  const archiveAction = isVente ? "archiveSaleGroup" : "archivePurchase";
  const unarchiveAction = isVente ? "unarchiveSaleGroup" : "unarchivePurchase";
  const trashAction = isVente ? "deleteSaleGroup" : "deletePurchase";
  const restoreAction = isVente ? "restoreSaleGroup" : "restorePurchase";
  const permDeleteAction = isVente ? "permDeleteSaleGroup" : "permDeletePurchase";

  if(status==="trash"){
    return `${receiptBtn}
      <button class="del-btn" style="background:rgba(94,201,138,0.15);color:var(--green);" data-action="${restoreAction}" data-id="${op.id}">${t("btn.restore")}</button>
      ${sellerRO() ? "" : `<button class="del-btn" data-action="${permDeleteAction}" data-id="${op.id}">${t("btn.permDelete")}</button>`}`;
  }
  if(status==="archived"){
    return `${receiptBtn}
      <button class="del-btn" style="background:rgba(58,95,160,0.12);color:var(--blue);" data-action="${editAction}" data-id="${op.id}">✏️</button>
      <button class="del-btn" style="background:rgba(212,149,106,0.15);color:var(--gold);" data-action="${unarchiveAction}" data-id="${op.id}">${t("btn.unarchive")}</button>`;
  }
  return `${receiptBtn}
    <button class="del-btn" style="background:rgba(58,95,160,0.12);color:var(--blue);" data-action="${editAction}" data-id="${op.id}">✏️</button>
    <button class="del-btn" style="background:rgba(122,79,174,0.15);color:#a87fd4;" data-action="${archiveAction}" data-id="${op.id}">${t("btn.archive")}</button>
    <button class="del-btn" data-action="${trashAction}" data-id="${op.id}">${t("btn.delete")}</button>`;
}

/* ════════════════════════════════════════════════
   NAVIGATION PAR DATE — comme des dossiers dans lesquels on ENTRE
   • Le jour EN COURS n'est jamais rangé : ses opérations s'affichent directement
     en haut de la liste. Elles ne partent dans les dossiers que le lendemain.
   • Les périodes passées sont des dossiers : on touche 2026 → l'écran ne montre
     QUE les mois de 2026. On touche Juillet → QUE les jours de juillet. On touche
     un jour → QUE les opérations de ce jour. Un fil d'Ariane permet de revenir.
   Utilisé pour les Opérations ET les Dépenses (chaque vue a son propre chemin).
════════════════════════════════════════════════ */

// Chemin de navigation courant pour une vue donnée ("ops" ou "exp").
// null = racine ; {year} = dans une année ; {year,month} = dans un mois ; {day} = dans un jour.
function getDatePath(scope){
  if(!state.datePath) state.datePath = {};
  return state.datePath[scope] || {};
}
function setDatePath(scope, path){
  if(!state.datePath) state.datePath = {};
  state.datePath[scope] = path || {};
}

const MONTH_NAMES_I18N = {
  fr: ["","Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"],
  en: ["","January","February","March","April","May","June","July","August","September","October","November","December"]
};
function monthName(n){
  const arr = MONTH_NAMES_I18N[lang()] || MONTH_NAMES_I18N.fr;
  return arr[n] || "";
}
const MONTH_NAMES = new Proxy({}, { get(_, k){ return monthName(parseInt(k,10)); } });

// Construit la liste : opérations d'aujourd'hui à plat, puis navigation dans le passé.
// - items / getDate / getAmount / renderItem : comme avant
// - scope : "ops" ou "exp" (chaque vue garde son propre chemin de navigation)
// - color : couleur des montants
function buildDateNavHtml(items, getDate, getAmount, renderItem, scope, color){
  const today = todayFR();
  const amountColor = color || "var(--goldL)";
  const path = getDatePath(scope);

  const todayItems = items.filter(it=>getDate(it)===today);
  const pastItems  = items.filter(it=>getDate(it)!==today);

  const sumOf = arr => arr.reduce((s,it)=>s+(getAmount(it)||0), 0);

  // ── Niveau 3 : à l'intérieur d'un JOUR ──────────────────────────────
  if(path.day){
    const dayItems = pastItems.filter(it=>getDate(it)===path.day);
    const monthNum = parseInt(path.day.split("/")[1],10);
    return `
      ${dateNavBackBar(scope, [
        {label:"📆 "+path.year, path:{year:path.year}},
        {label:MONTH_NAMES[monthNum]||"", path:{year:path.year, month:path.month}}
      ], "📅 "+path.day, dayItems.length, sumOf(dayItems), amountColor, {year:path.year, month:path.month})}
      ${dayItems.length ? dayItems.map(renderItem).join("") : `<div class="card empty">${t("act.noOpThatDay")}</div>`}`;
  }

  // ── Niveau 2 : à l'intérieur d'un MOIS → on ne montre QUE ses jours ──
  if(path.month){
    const monthItems = pastItems.filter(it=>{
      const p = (getDate(it)||"").split("/");
      return p.length===3 && (p[1]+"/"+p[2])===path.month;
    });
    const byDay = {};
    monthItems.forEach(it=>{
      const dk = getDate(it);
      if(!byDay[dk]) byDay[dk] = {count:0,total:0};
      byDay[dk].count++; byDay[dk].total += (getAmount(it)||0);
    });
    const days = Object.keys(byDay).sort((a,b)=>frToISO(b).localeCompare(frToISO(a)));
    const monthNum = parseInt(path.month.split("/")[0],10);
    let html = dateNavBackBar(scope, [
      {label:"📆 "+path.year, path:{year:path.year}}
    ], "🗓️ "+(MONTH_NAMES[monthNum]||path.month)+" "+path.year, monthItems.length, sumOf(monthItems), amountColor, {year:path.year});

    days.forEach(dk=>{
      const dd = byDay[dk];
      html += `<div class="card" style="margin-bottom:8px;cursor:pointer;" data-action="openDateFolder" data-scope="${scope}" data-year="${esc(path.year)}" data-month="${esc(path.month)}" data-day="${esc(dk)}">
        <div class="row-between">
          <div style="display:flex;align-items:center;gap:8px;">
            <span style="color:var(--gold);font-size:13px;">📅</span>
            <span style="font-size:14px;color:var(--text);">${esc(dk)}</span>
          </div>
          <div style="text-align:right;display:flex;align-items:center;gap:8px;">
            <div>
              <div style="font-size:10px;color:var(--sub);">${dd.count} ${t("ops.opCount")}</div>
              ${sellerRO() ? "" : `<div style="font-size:13px;font-weight:bold;color:${amountColor};">${fmt(dd.total)}</div>`}
            </div>
            <span style="color:var(--gold);font-size:15px;">›</span>
          </div>
        </div>
      </div>`;
    });
    return html;
  }

  // ── Niveau 1 : à l'intérieur d'une ANNÉE → on ne montre QUE ses mois ──
  if(path.year){
    const yearItems = pastItems.filter(it=>{
      const p = (getDate(it)||"").split("/");
      return p.length===3 && p[2]===path.year;
    });
    const byMonth = {};
    yearItems.forEach(it=>{
      const p = (getDate(it)||"").split("/");
      const mk = p[1]+"/"+p[2];
      if(!byMonth[mk]) byMonth[mk] = {count:0,total:0};
      byMonth[mk].count++; byMonth[mk].total += (getAmount(it)||0);
    });
    const months = Object.keys(byMonth).sort((a,b)=>b.split("/")[0].localeCompare(a.split("/")[0]));
    let html = dateNavBackBar(scope, [], "📆 "+path.year, yearItems.length, sumOf(yearItems), amountColor, {});

    months.forEach(mk=>{
      const md = byMonth[mk];
      const monthNum = parseInt(mk.split("/")[0],10);
      html += `<div class="card" style="margin-bottom:8px;cursor:pointer;" data-action="openDateFolder" data-scope="${scope}" data-year="${esc(path.year)}" data-month="${esc(mk)}">
        <div class="row-between">
          <div style="display:flex;align-items:center;gap:8px;">
            <span style="color:var(--gold);font-size:13px;">🗓️</span>
            <span style="font-size:14px;color:var(--text);font-weight:bold;">${esc(MONTH_NAMES[monthNum]||mk)}</span>
          </div>
          <div style="text-align:right;display:flex;align-items:center;gap:8px;">
            <div>
              <div style="font-size:10px;color:var(--sub);">${md.count} ${t("ops.opCount")}</div>
              ${sellerRO() ? "" : `<div style="font-size:13px;font-weight:bold;color:${amountColor};">${fmt(md.total)}</div>`}
            </div>
            <span style="color:var(--gold);font-size:15px;">›</span>
          </div>
        </div>
      </div>`;
    });
    return html;
  }

  // ── Racine : les opérations D'AUJOURD'HUI à plat, puis les dossiers du passé ──
  let html = "";

  if(todayItems.length){
    html += `<div class="row-between" style="margin:2px 4px 8px;">
      <span style="font-size:12px;color:var(--green);font-weight:bold;">📅 ${t("ops.today")} · ${esc(today)}</span>
      ${sellerRO() ? "" : `<span style="font-size:12px;font-weight:bold;color:${amountColor};">${fmt(sumOf(todayItems))}</span>`}
    </div>`;
    html += todayItems.map(renderItem).join("");
  }

  const byYear = {};
  pastItems.forEach(it=>{
    const p = (getDate(it)||"").split("/");
    if(p.length!==3) return;
    const y = p[2];
    if(!byYear[y]) byYear[y] = {count:0,total:0};
    byYear[y].count++; byYear[y].total += (getAmount(it)||0);
  });
  const years = Object.keys(byYear).sort((a,b)=>b.localeCompare(a));

  if(years.length){
    html += `<div style="font-size:11px;color:var(--sub);margin:${todayItems.length?"16px":"2px"} 4px 8px;">${t("ops.history")}</div>`;
    years.forEach(y=>{
      const yd = byYear[y];
      html += `<div class="card" style="margin-bottom:8px;cursor:pointer;" data-action="openDateFolder" data-scope="${scope}" data-year="${esc(y)}">
        <div class="row-between">
          <div style="display:flex;align-items:center;gap:8px;">
            <span style="color:var(--gold);font-size:14px;">📆</span>
            <span style="font-size:15px;font-weight:bold;color:var(--goldL);">${esc(y)}</span>
          </div>
          <div style="text-align:right;display:flex;align-items:center;gap:8px;">
            <div>
              <div style="font-size:10px;color:var(--sub);">${yd.count} ${t("ops.opCount")}</div>
              ${sellerRO() ? "" : `<div style="font-size:13px;font-weight:bold;color:${amountColor};">${fmt(yd.total)}</div>`}
            </div>
            <span style="color:var(--gold);font-size:15px;">›</span>
          </div>
        </div>
      </div>`;
    });
  }

  if(!todayItems.length && !years.length){
    html = `<div class="card empty">${t("op.none")}</div>`;
  }
  return html;
}

// Barre de retour + fil d'Ariane affichée en haut quand on est entré dans un dossier.
// "⬅ Retour" recule d'UN SEUL niveau (jour → mois → année → racine), comme de vrais dossiers.
function dateNavBackBar(scope, crumbs, title, count, total, color, parentPath){
  const p = parentPath || {};
  const backAttrs = `data-action="openDateFolder" data-scope="${scope}"`
    + (p.year?` data-year="${esc(p.year)}"`:"")
    + (p.month?` data-month="${esc(p.month)}"`:"");
  const crumbHtml = crumbs.map(c=>
    `<span style="cursor:pointer;color:var(--gold);" data-action="openDateFolder" data-scope="${scope}" ${c.path.year?`data-year="${esc(c.path.year)}"`:""} ${c.path.month?`data-month="${esc(c.path.month)}"`:""}>${esc(c.label)}</span>`
  ).join(`<span style="color:var(--sub);"> › </span>`);

  return `<div class="card" style="margin-bottom:10px;background:rgba(212,149,106,0.06);">
    <div class="row-between" style="align-items:center;">
      <div style="flex:1;min-width:0;">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11px;margin-bottom:4px;">
          <span style="cursor:pointer;color:var(--gold);font-weight:bold;" ${backAttrs}>${t("ops.back")}</span>
          ${crumbs.length?`<span style="color:var(--sub);">·</span>${crumbHtml}`:""}
        </div>
        <div style="font-size:15px;font-weight:bold;color:var(--goldL);">${esc(title)}</div>
      </div>
      <div style="text-align:right;">
        <div style="font-size:10px;color:var(--sub);">${count} ${t("ops.opCount")}</div>
        ${sellerRO() ? "" : `<div style="font-size:14px;font-weight:bold;color:${color};">${fmt(total)}</div>`}
      </div>
    </div>
  </div>`;
}

function buildOpsListHtml(stats){
  const d = state.data;
  const search = (state.opsSearch||"").toLowerCase().trim();
  const searchCode = normalizeCode(state.opsSearch); // pour comparer aux n° de reçu (RC-XXX-XXX / PAY-XXX-XXX)
  const purchaseOps = sellerRO() ? [] : d.purchases.map(p=>({...p,_type:"achat", _sortKey:p.id}));
  const saleGroups = getSaleGroups().map(g=>({...g,_type:"vente", _sortKey:g.id}));
  // Les paiements ne sont mélangés dans la liste que lors d'une recherche active (et filtre "Tout") —
  // sinon ils restent visibles uniquement dans l'onglet Crédits, pour ne pas surcharger la liste normale.
  const paymentOps = (search && state.opsFilter==="tout")
    ? (d.payments||[]).filter(p=>isCounted(p)).map(p=>({...p,_type:"paiement", _sortKey:p.id}))
    : [];
  let allOps = [...purchaseOps, ...saleGroups, ...paymentOps].sort((a,b)=>b._sortKey.localeCompare(a._sortKey));

  if(state.opsFilter==="archive"){
    allOps = allOps.filter(o=>o._type!=="paiement" && (o.status||"active")==="archived");
  } else if(state.opsFilter==="corbeille"){
    allOps = allOps.filter(o=>o._type!=="paiement" && (o.status||"active")==="trash");
  } else {
    // Vues normales (Tout / Achats / Ventes) : uniquement les opérations actives —
    // archivées et corbeille restent rangées dans leurs propres filtres dédiés.
    allOps = allOps.filter(o=>o._type==="paiement" || (o.status||"active")==="active");
  }

  let filtered = (state.opsFilter==="tout" || state.opsFilter==="archive" || state.opsFilter==="corbeille")
    ? allOps : allOps.filter(o=>o._type===state.opsFilter);

  if(search){
    filtered = filtered.filter(op=>{
      if(op._type==="achat"){
        if((op.note||"").toLowerCase().includes(search)) return true;
        return op.items.some(it=>itemFullName(it).toLowerCase().includes(search));
      } else if(op._type==="paiement"){
        if(searchCode && normalizeCode(op.receiptNo).includes(searchCode)) return true;
        if((op.client||"").toLowerCase().includes(search)) return true;
        if((op.clientPhone||"").toLowerCase().includes(search)) return true;
        return false;
      } else {
        if(searchCode && normalizeCode(op.receiptNo).includes(searchCode)) return true;
        if((op.client||"").toLowerCase().includes(search)) return true;
        if((op.clientPhone||"").toLowerCase().includes(search)) return true;
        return op.lines.some(s=>itemFullName(s).toLowerCase().includes(search));
      }
    });
  }

  if(filtered.length===0){
    return `<div class="card empty">${t("op.none").replace(/\.$/,"")}${search?` ${t("op.noneFor")} "${esc(search)}"`:""}.</div>`;
  }

  // Dessine UNE opération (rendu inchangé : achat, paiement ou vente).
  function renderOneOp(op){
    let html = "";
    const opKey = op._type+":"+op.id;
    const isOpen = state.expandedOps.has(opKey);
    if(op._type==="achat"){
      const total = op.items.reduce((s,i)=>s+i.qty*i.unitCost,0)+(op.deliveryFee||0)+(op.customsFee||0);
      const itemsToShow = isOpen ? op.items : op.items.slice(0,2);
      let itemsHtml = "";
      itemsToShow.forEach(it=>{
        const nm = itemNameParts(it);
        itemsHtml += `<div style="font-size:11px;color:var(--sub);">• ${esc(nm.product||"?")} ${esc(nm.variant)} × ${it.qty}</div>`;
      });
      const hiddenCount = op.items.length - itemsToShow.length;
      if(hiddenCount>0) itemsHtml += `<div style="font-size:11px;color:var(--gold);">+ ${hiddenCount} ${t("op.moreAll")}</div>`;
      html += `<div class="card" style="margin-bottom:8px;border-left:3px solid var(--red);">
        <div class="row-between" style="align-items:flex-start;cursor:pointer;" data-action="toggleOpExpanded" data-key="${esc(opKey)}">
          <div style="flex:1;">
            <div style="font-size:11px;color:var(--red);font-weight:bold;margin-bottom:2px;">🛒 ${t("op.purchase")} · ${op.date}${op.status==="archived"?` · <span style="color:#a87fd4;">${t("op.archived")}</span>`:""}${op.status==="trash"?` · <span style="color:var(--red);">${t("op.trashed")}</span>`:""}</div>
            <div style="font-size:12px;color:var(--sub);">${esc(op.note||t("op.noNote"))}</div>
            <div style="font-size:12px;color:var(--sub);">${op.items.length} ${t("op.itemCount")}${(op.deliveryFee||op.customsFee)?" · "+t("op.feesIncluded"):""}</div>
            ${itemsHtml}
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
            <div style="font-weight:bold;color:var(--red);font-size:15px;">${fmt(total)}</div>
            ${opActionButtons(op)}
            ${op.items.length>2?`<span style="color:var(--sub);font-size:13px;">${isOpen?"▲":"▼"}</span>`:""}
          </div>
        </div>
      </div>`;
    } else if(op._type==="paiement"){
      html += `<div class="card" style="margin-bottom:8px;border-left:3px solid var(--green);cursor:pointer;" data-action="openPaymentReceipt" data-id="${op.id}">
        <div class="row-between" style="align-items:flex-start;">
          <div style="flex:1;">
            <div style="font-size:11px;color:var(--green);font-weight:bold;margin-bottom:2px;">📜 ${t("op.payment")} · ${op.date}${op.receiptNo?(" · "+esc(op.receiptNo)):""}</div>
            ${op.client?`<div style="font-size:11px;color:var(--sub);">${t("op.client")} ${esc(op.client)}</div>`:""}
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
            <div style="font-weight:bold;color:var(--green);font-size:15px;">${fmt(op.amount)}</div>
            <span style="color:var(--gold);font-size:13px;">🧾</span>
          </div>
        </div>
      </div>`;
    } else {
      let total=0, profit=0, hasCost=false, anyDiscount=false;
      const allLinesComputed = op.lines.map(s=>{
        const nm = itemNameParts(s);
        const lineTotal = s.qty*s.salePrice;
        total += lineTotal;
        const smd = stats.sm[s.variantId];
        const avg = smd && smd.totalQtyIn>0 ? smd.totalCostIn/smd.totalQtyIn : 0;
        if(avg>0){ profit += lineTotal - s.qty*avg; hasCost=true; }
        // Remise = écart entre le prix fixé (étiquette) et le prix réellement pratiqué.
        // Petite tolérance pour éviter qu'un arrondi de conversion crée une fausse remise.
        const hasDiscount = s.listPrice!=null && s.listPrice > s.salePrice + 0.5;
        let lineHtml = `<div style="font-size:12px;color:var(--sub);">• ${esc(nm.product||"?")} ${esc(nm.variant)} × ${s.qty} = ${fmt(lineTotal)}</div>`;
        if(hasDiscount){
          anyDiscount = true;
          const lineDiscount = s.qty*(s.listPrice - s.salePrice);
          lineHtml += `<div style="font-size:10px;color:var(--gold);margin-left:10px;">🏷️ ${t("op.discount")} −${fmt(lineDiscount)} · ${t("pick.fixedPrice")} ${fmt(s.qty*s.listPrice)}</div>`;
        }
        return lineHtml;
      });
      const linesToShow = isOpen ? allLinesComputed : allLinesComputed.slice(0,2);
      let linesHtml = linesToShow.join("");
      const hiddenLines = allLinesComputed.length - linesToShow.length;
      if(hiddenLines>0) linesHtml += `<div style="font-size:11px;color:var(--gold);">+ ${hiddenLines} ${t("op.moreLines")}</div>`;
      html += `<div class="card" style="margin-bottom:8px;border-left:3px solid var(--green);">
        <div class="row-between" style="align-items:flex-start;cursor:pointer;" data-action="toggleOpExpanded" data-key="${esc(opKey)}">
          <div style="flex:1;">
            <div style="font-size:11px;color:var(--green);font-weight:bold;margin-bottom:2px;">💵 ${t("op.sale")} · ${op.date}${op.receiptNo?(" · "+esc(op.receiptNo)):""}${op.isCredit?` · <span style="background:rgba(224,92,92,0.18);color:var(--red);border-radius:6px;padding:1px 6px;font-size:10px;">${t("op.credit")}</span>`:""}${anyDiscount?` · <span style="background:rgba(212,149,106,0.18);color:var(--gold);border-radius:6px;padding:1px 6px;font-size:10px;">🏷️ ${t("op.discount")}</span>`:""}${op.status==="archived"?` · <span style="color:#a87fd4;">${t("op.archived")}</span>`:""}${op.status==="trash"?` · <span style="color:var(--red);">${t("op.trashed")}</span>`:""}</div>
            ${linesHtml}
            ${op.client?`<div style="font-size:11px;color:var(--sub);">${t("op.client")} ${esc(op.client)}</div>`:""}
            ${(hasCost && !sellerRO())?`<div style="font-size:11px;color:${profit>=0?'var(--green)':'var(--red)'};">${t("op.estMargin")} : ${profit>=0?"+":""}${fmt(profit)}</div>`:""}
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
            <div style="font-weight:bold;color:var(--green);font-size:15px;">${fmt(total)}</div>
            <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:160px;">
              ${opActionButtons(op)}
            </div>
            ${op.lines.length>2?`<span style="color:var(--sub);font-size:13px;">${isOpen?"▲":"▼"}</span>`:""}
          </div>
        </div>
      </div>`;
    }
    return html;
  }

  // Pendant une recherche, on affiche les résultats à plat (sans tiroirs) : quand on
  // cherche quelque chose de précis, on veut le voir tout de suite, pas avoir à ouvrir
  // des dossiers pour le trouver.
  if(search){
    return filtered.map(renderOneOp).join("");
  }

  // Sinon : rangement Année ▸ Mois ▸ Jour (aujourd'hui déjà ouvert).
  function opAmount(op){
    if(op._type==="achat") return op.items.reduce((s,i)=>s+i.qty*i.unitCost,0)+(op.deliveryFee||0)+(op.customsFee||0);
    if(op._type==="paiement") return op.amount||0;
    return op.lines.reduce((s,l)=>s+l.qty*l.salePrice,0);
  }
  return buildDateNavHtml(filtered, op=>op.date, opAmount, renderOneOp, "ops", "var(--goldL)");
}


/* ════════════════════════════════════════════════
   VUE "QUI ME DOIT" — dettes par client (filtre Crédits)
════════════════════════════════════════════════ */
function buildCreditsListHtml(){
  let debts = getDebtsByClient();
  if(debts.length===0){
    return `<div class="card empty">${t("credit.empty")}<br>
      <span style="font-size:11px;">${t("credit.emptyHint")}</span></div>`;
  }
  const search = (state.creditSearch||"").toLowerCase().trim();
  const searchCode = normalizeCode(state.creditSearch);
  if(search){
    debts = debts.filter(c=>{
      if((c.client||"").toLowerCase().includes(search)) return true;
      if((c.clientPhone||"").toLowerCase().includes(search)) return true;
      if(searchCode){
        if(c.creditPurchases.some(p=>normalizeCode(p.receiptNo).includes(searchCode))) return true;
        if(c.payments.some(p=>normalizeCode(p.receiptNo).includes(searchCode))) return true;
      }
      return false;
    });
    if(debts.length===0){
      return `<div class="card empty">${t("credit.noResult")} "${esc(state.creditSearch)}".</div>`;
    }
  }
  // Détecte les homonymes (même nom, fiches différentes) pour afficher un petit repère
  // discret qui aide à les distinguer visuellement — sans jamais modifier le nom affiché.
  const nameCounts = {};
  debts.forEach(c=>{ const k=(c.client||"").toLowerCase(); nameCounts[k]=(nameCounts[k]||0)+1; });

  let html = "";
  debts.forEach(c=>{
    const isPaid = c.remaining<=0;
    const histKey = "credit:"+c.clientId;
    const isHistOpen = state.expandedPaymentHistory.has(histKey);
    const purchasesKey = "creditpurchases:"+c.clientId;
    const isPurchasesOpen = state.expandedPaymentHistory.has(purchasesKey);
    const hasHomonym = nameCounts[(c.client||"").toLowerCase()]>1;
    const purchasesHtml = c.creditPurchases.length>0 ? `
      <div style="margin-top:8px;">
        <div class="row-between" style="cursor:pointer;padding:6px 0;" data-action="togglePaymentHistory" data-key="${esc(purchasesKey)}">
          <span style="font-size:11px;color:var(--gold);">${t("credit.creditPurchases")} (${c.creditPurchases.length})</span>
          <span style="color:var(--gold);font-size:12px;">${isPurchasesOpen?"▲":"▾"}</span>
        </div>
        ${isPurchasesOpen?`<div style="border-top:1px solid var(--border);padding-top:6px;">
          ${c.creditPurchases.map(p=>`<div class="row-between" style="font-size:11px;color:var(--sub);padding:5px 0;cursor:pointer;" data-action="openReceipt" data-id="${esc(p.groupId)}">
            <span>${esc(p.date)}${p.receiptNo?(" · "+esc(p.receiptNo)):""}</span>
            <span style="display:flex;align-items:center;gap:6px;"><span style="color:var(--green);font-weight:bold;">${fmt(p.total)}</span><span style="color:var(--gold);">🧾</span></span>
          </div>`).join("")}
        </div>`:""}
      </div>` : "";
    // Paiements de ce client mis à la corbeille INDIVIDUELLEMENT (pas ceux partis avec
    // une vente : ceux-là se restaurent via la vente). Ils sont récupérables ici.
    const trashedPays = (state.data.payments||[]).filter(p=>p.clientId===c.clientId && !isCounted(p) && !p.trashedWith)
      .sort((a,b)=> (b.id||"").localeCompare(a.id||""));
    const paymentsHtml = (c.payments.length>0 || trashedPays.length>0) ? `
      <div style="margin-top:8px;">
        <div class="row-between" style="cursor:pointer;padding:6px 0;" data-action="togglePaymentHistory" data-key="${esc(histKey)}">
          <span style="font-size:11px;color:var(--gold);">${t("credit.paymentHistory")} (${c.payments.length})</span>
          <span style="color:var(--gold);font-size:12px;">${isHistOpen?"▲":"▾"}</span>
        </div>
        ${isHistOpen?`<div style="border-top:1px solid var(--border);padding-top:6px;">
          ${c.payments.map(p=>`<div class="row-between" style="font-size:11px;color:var(--sub);padding:5px 0;">
            <span data-action="openPaymentReceipt" data-id="${esc(p.id)}" style="cursor:pointer;flex:1;">${esc(p.date)}</span>
            <span style="display:flex;align-items:center;gap:10px;">
              <span style="color:var(--green);font-weight:bold;">${fmt(p.amount)}</span>
              <span data-action="openPaymentReceipt" data-id="${esc(p.id)}" style="color:var(--gold);cursor:pointer;">🧾</span>
              ${!sellerRO() ? `<span data-action="trashPayment" data-id="${esc(p.id)}" style="color:var(--red);cursor:pointer;">🗑</span>` : ""}
            </span>
          </div>`).join("")}
          ${trashedPays.map(p=>`<div class="row-between" style="font-size:11px;color:var(--sub);padding:5px 0;opacity:0.5;">
            <span style="flex:1;text-decoration:line-through;">${esc(p.date)} · ${t("credit.payDeleted")}</span>
            <span style="display:flex;align-items:center;gap:10px;">
              <span style="text-decoration:line-through;">${fmt(p.amount)}</span>
              <span data-action="restorePayment" data-id="${esc(p.id)}" style="color:var(--green);cursor:pointer;text-decoration:none;">↩</span>
            </span>
          </div>`).join("")}
        </div>`:""}
      </div>` : "";
    html += `<div class="card" style="margin-bottom:10px;border-left:3px solid ${isPaid?'var(--green)':'var(--red)'};">
      <div class="row-between" style="align-items:flex-start;">
        <div>
          <div style="font-weight:bold;color:var(--goldL);font-size:15px;">${esc(c.client)}</div>
          <div style="font-size:11px;color:var(--sub);">${c.clientPhone?esc(c.clientPhone):t("credit.noPhone")}${hasHomonym?` · réf. ${c.clientId.slice(-4).toUpperCase()}`:""}</div>
          <div style="font-size:11px;color:var(--sub);margin-top:4px;">${t("credit.totalOwed")} ${fmt(c.owed)} · ${t("credit.paid")} ${fmt(c.paid)}</div>
        </div>
        <div style="text-align:right;">
          ${isPaid
            ? `<div style="color:var(--green);font-weight:bold;font-size:13px;">${t("credit.settled")}</div>`
            : `<div style="color:var(--red);font-weight:bold;font-size:15px;">${fmt(c.remaining)}</div><div style="font-size:10px;color:var(--sub);">${t("credit.remaining")}</div>`}
        </div>
      </div>
      ${!isPaid?`<button class="btn" style="background:var(--green);margin-top:10px;" data-action="openAddPayment" data-clientid="${esc(c.clientId)}" data-client="${esc(c.client)}" data-phone="${esc(c.clientPhone)}" data-remaining="${c.remaining}">${t("credit.recordPayment")}</button>`:""}
      <button class="btn" style="background:transparent;border:1px solid var(--border);color:var(--gold);margin-top:8px;" data-action="openClientStatement" data-clientid="${esc(c.clientId)}">${t("credit.statementBtn")}</button>
      ${purchasesHtml}
      ${paymentsHtml}
    </div>`;
  });
  return html;
}


/* ════════════════════════════════════════════════
   EXPENSES
════════════════════════════════════════════════ */
function renderExpenses(stats){
  const d = state.data;
  const filter = state.expFilter || "active";
  const visibleExpenses = d.expenses.filter(e=>(e.status||"active")===filter);
  let html = `
    <div class="row-between" style="margin-bottom:14px;">
      <div>
        <div style="font-size:13px;color:var(--sub);">${t("exp.totalAll")}</div>
        <div style="font-size:20px;font-weight:bold;color:var(--red);">${fmt(stats.totalDepenses)}</div>
      </div>
      <button class="btn" style="background:#7a4a10;width:auto;padding:11px 18px;" data-action="openAddExpense">${t("exp.add")}</button>
    </div>
    <div id="expFilterPills" style="display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;">
      <button class="pill ${filter==='active'?'active':''}" data-action="setExpFilter" data-filter="active">${t("ops.all")}</button>
      <button class="pill ${filter==='archived'?'active':''}" data-action="setExpFilter" data-filter="archived">${t("ops.archives")}</button>
      <button class="pill ${filter==='trash'?'active':''}" data-action="setExpFilter" data-filter="trash">${t("ops.trash")}</button>
    </div>`;

  if(visibleExpenses.length===0){
    html += `<div class="card empty">${filter==='active'?t("exp.emptyActive"):(filter==='archived'?t("exp.emptyArchived"):t("exp.emptyTrash"))}</div>`;
    return html;
  }

  // Dessine UNE dépense (rendu inchangé).
  function renderOneExpense(e){
    let actionBtns;
    if(filter==="trash"){
      actionBtns = `<button class="del-btn" style="background:rgba(94,201,138,0.15);color:var(--green);" data-action="restoreExpense" data-id="${e.id}">${t("btn.restore")}</button>
        ${sellerRO() ? "" : `<button class="del-btn" data-action="permDeleteExpense" data-id="${e.id}">${t("btn.permDelete")}</button>`}`;
    } else if(filter==="archived"){
      actionBtns = `<button class="del-btn" style="background:rgba(212,149,106,0.15);color:var(--gold);" data-action="unarchiveExpense" data-id="${e.id}">${t("btn.unarchive")}</button>`;
    } else {
      actionBtns = `<button class="del-btn" style="background:rgba(91,155,213,0.15);color:var(--blue);" data-action="editExpense" data-id="${e.id}">${t("btn.edit")}</button>
        <button class="del-btn" style="background:rgba(122,79,174,0.15);color:#a87fd4;" data-action="archiveExpense" data-id="${e.id}">${t("btn.archive")}</button>
        <button class="del-btn" data-action="deleteExpense" data-id="${e.id}">${t("btn.delete")}</button>`;
    }
    return `<div style="border-top:1px solid var(--border);padding:7px 0;">
      <div class="row-between" style="align-items:flex-start;gap:8px;">
        <div style="flex:1;min-width:0;">
          <div style="font-size:13px;">${esc((e.label && e.label.trim()) ? e.label : (e.category||t("exp.defaultLabel")))}</div>
          ${(e.label && e.label.trim()) ? `<div style="font-size:10px;color:var(--sub);">${esc(e.category)}</div>` : ""}
        </div>
        <span style="color:var(--red);font-weight:bold;white-space:nowrap;">${fmt(e.amount)}</span>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:8px;">
        ${actionBtns}
      </div>
    </div>`;
  }

  html += buildDateNavHtml(visibleExpenses, e=>e.date, e=>e.amount||0, renderOneExpense, "exp", "var(--red)");
  return html;
}


/* ════════════════════════════════════════════════
   MODAL: ADD PURCHASE
════════════════════════════════════════════════ */
let purchaseItems = [];
function openAddPurchaseModal(existingPurchase){
  const d = state.data;
  const isEdit = !!existingPurchase;
  if(isEdit){
    purchaseItems = existingPurchase.items.map(it=>({
      variantId: it.variantId, qty: it.qty, unitCost: Math.round(fromGNF(it.unitCost, cur()))
    }));
    purchaseItems._note = existingPurchase.note || "";
    purchaseItems._delivery = existingPurchase.deliveryFee ? Math.round(fromGNF(existingPurchase.deliveryFee, cur())) : "";
    purchaseItems._customs = existingPurchase.customsFee ? Math.round(fromGNF(existingPurchase.customsFee, cur())) : "";
  } else {
    purchaseItems = [{variantId:"",qty:"",unitCost:""}];
  }

  function variantTriggerLabel(variantId){
    if(!variantId) return "";
    const v = d.variants.find(x=>x.id===variantId);
    const p = v ? d.products.find(x=>x.id===v.productId) : null;
    return v ? ((p?p.name+" — ":"")+v.label) : "";
  }

  function openVariantPickerFor(idx){
    const groups = d.products.map(p=>({
      label: p.name,
      items: d.variants.filter(v=>v.productId===p.id).map(v=>({value:v.id, label:v.label}))
    })).filter(g=>g.items.length>0);
    openCustomPicker({
      title:t("form.chooseItem"),
      selectedValue: purchaseItems[idx].variantId,
      groups,
      emptyText:t("pick.emptyVariants"),
      onSelect:(val)=>{
        purchaseItems[idx].variantId = val;
        const wrap = document.getElementById("piTriggerWrap"+idx);
        if(wrap){
          wrap.innerHTML = pickerTriggerHtml("piTrigger"+idx, variantTriggerLabel(val), t("form.chooseItem"));
          document.getElementById("piTrigger"+idx).onclick = ()=>openVariantPickerFor(idx);
        }
      }
    });
  }

  function itemsHtml(){
    return purchaseItems.map((it,idx)=>`
      <div style="background:rgba(255,255,255,0.03);border-radius:10px;padding:12px;margin-bottom:8px;border:1px solid var(--border);">
        <div class="field"><label>${t("form.item")} ${idx+1}</label>
          <div id="piTriggerWrap${idx}">${pickerTriggerHtml("piTrigger"+idx, variantTriggerLabel(it.variantId), t("form.chooseItem"))}</div></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
          <div class="field"><label>${t("form.qty")}</label><input type="number" class="pi-qty" data-idx="${idx}" value="${it.qty}" placeholder="10"></div>
          <div class="field"><label>${t("pur.unitPrice")} (${curSym()})</label><input type="number" class="pi-cost" data-idx="${idx}" value="${it.unitCost}" placeholder="5000"></div>
        </div>
        ${purchaseItems.length>1?`<button class="pi-remove" data-idx="${idx}" style="background:none;border:none;color:var(--red);cursor:pointer;font-size:12px;padding:0;">${t("form.removeItem")}</button>`:""}
      </div>`).join("");
  }

  function computeTotal(){
    const delivery = +document.getElementById("mpuDelivery")?.value || 0;
    const customs = +document.getElementById("mpuCustoms")?.value || 0;
    const itemsTotal = purchaseItems.reduce((s,it)=>s+(+it.qty||0)*(+it.unitCost||0),0);
    return itemsTotal + delivery + customs;
  }

  function renderModalBody(scrollToBottom){
    const prevBox = document.querySelector("#modalRoot .modal-box");
    const prevScroll = prevBox ? prevBox.scrollTop : 0;
    openModal(`
      <div class="modal-head"><div class="modal-title">${isEdit?t("pur.editTitle"):t("pur.newTitle")}</div>
        <button class="modal-close" onclick="closeModal()">✕</button></div>
      <div class="field"><label>${t("pur.note")}</label>
        <input id="mpuNote" placeholder="${t("pur.notePh")}" value="${esc(purchaseItems._note||"")}"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        <div class="field"><label>${t("pur.deliveryFee")} (${curSym()})</label><input type="number" id="mpuDelivery" value="${purchaseItems._delivery||""}" placeholder="0"></div>
        <div class="field"><label>${t("pur.customsFee")} (${curSym()})</label><input type="number" id="mpuCustoms" value="${purchaseItems._customs||""}" placeholder="0"></div>
      </div>
      <div style="font-size:10px;color:var(--sub);letter-spacing:0.8px;margin-bottom:8px;margin-top:4px;">${t("form.itemsBought")}</div>
      <div id="piList">${itemsHtml()}</div>
      <button class="add-dashed" id="piAdd">${t("form.addItem")}</button>
      <div class="row-between" style="padding:10px 14px;background:rgba(212,149,106,0.1);border-radius:10px;margin-bottom:14px;">
        <span style="color:var(--sub);">${t("pur.opTotal")}</span>
        <span style="font-weight:bold;color:var(--gold);font-size:15px;" id="mpuTotal">${fmtRaw(computeTotal())}</span>
      </div>
      <button class="btn" style="background:#8b2e2e;" id="mpuSave">${isEdit?t("pur.saveEdit"):t("pur.saveNew")}</button>
    `);
    bindEvents();
    const newBox = document.querySelector("#modalRoot .modal-box");
    if(newBox){ newBox.scrollTop = scrollToBottom ? newBox.scrollHeight : prevScroll; }
  }

  function bindEvents(){
    document.getElementById("mpuDelivery").oninput = ()=>{ purchaseItems._delivery=document.getElementById("mpuDelivery").value; updateTotal(); };
    document.getElementById("mpuCustoms").oninput = ()=>{ purchaseItems._customs=document.getElementById("mpuCustoms").value; updateTotal(); };
    document.getElementById("mpuNote").oninput = ()=>{ purchaseItems._note=document.getElementById("mpuNote").value; };
    purchaseItems.forEach((it,idx)=>{
      const trig = document.getElementById("piTrigger"+idx);
      if(trig) trig.onclick = ()=>openVariantPickerFor(idx);
    });
    document.querySelectorAll(".pi-qty").forEach(el=>el.oninput=()=>{ purchaseItems[+el.dataset.idx].qty=el.value; updateTotal(); });
    document.querySelectorAll(".pi-cost").forEach(el=>el.oninput=()=>{ purchaseItems[+el.dataset.idx].unitCost=el.value; updateTotal(); });
    document.querySelectorAll(".pi-remove").forEach(el=>el.onclick=()=>{
      purchaseItems.splice(+el.dataset.idx,1);
      renderModalBody();
    });
    document.getElementById("piAdd").onclick = ()=>{
      purchaseItems.push({variantId:"",qty:"",unitCost:""});
      renderModalBody(true); // défile vers le bas pour montrer le nouvel article ajouté
    };
    document.getElementById("mpuSave").onclick = ()=>{
      const valid = purchaseItems.filter(it=>it.variantId && +it.qty>0 && +it.unitCost>0);
      if(!valid.length){ alert(t("form.noValidItem")); return; }
      const newItems = valid.map(it=>({variantId:it.variantId,qty:+it.qty,unitCost:toGNF(+it.unitCost, cur())}));
      const newDelivery = toGNF(+purchaseItems._delivery||0, cur());
      const newCustoms = toGNF(+purchaseItems._customs||0, cur());
      if(isEdit){
        existingPurchase.note = purchaseItems._note||"";
        existingPurchase.deliveryFee = newDelivery;
        existingPurchase.customsFee = newCustoms;
        existingPurchase.items = newItems;
        closeModal(); saveData();
        showToast(t("pur.edited"));
      } else {
        state.data.purchases.push({
          id:uid(), date:todayFR(), note:purchaseItems._note||"",
          deliveryFee: newDelivery, customsFee: newCustoms, items: newItems,
        });
        closeModal(); saveData();
        showToast(t("pur.saved"));
      }
    };
  }

  function updateTotal(){
    const el = document.getElementById("mpuTotal");
    if(el) el.textContent = fmtRaw(computeTotal());
  }

  renderModalBody();
}


/* ════════════════════════════════════════════════
   MODAL: COMMANDE (réservation — n'affecte NI l'argent NI le stock)
════════════════════════════════════════════════ */
let orderItems = [];
function openAddOrderModal(existing){
  const d = state.data;
  const isEdit = !!existing;

  if(isEdit){
    orderItems = (existing.items||[]).map(it=>({
      variantId: it.variantId, qty: it.qty, salePrice: Math.round(fromGNF(it.salePrice, cur()))
    }));
    orderItems._client = existing.client||"";
    orderItems._clientPhone = existing.clientPhone||"";
    orderItems._deliveryPlace = existing.deliveryPlace||"";
    orderItems._dueDate = existing.dueDate||"";
    orderItems._note = existing.note||"";
  } else {
    orderItems = [{variantId:"",qty:"",salePrice:""}];
    orderItems._client = ""; orderItems._clientPhone = "";
    orderItems._deliveryPlace = ""; orderItems._dueDate = ""; orderItems._note = "";
  }

  function variantLabel(variantId){
    if(!variantId) return "";
    const v = d.variants.find(x=>x.id===variantId);
    const p = v ? d.products.find(x=>x.id===v.productId) : null;
    return v ? ((p?p.name+" — ":"")+v.label) : "";
  }

  // Une commande peut porter sur un article même s'il n'est pas encore en stock
  // (le client réserve, on se réapprovisionnera avant de livrer) : on n'exige donc
  // PAS de stock ici. Le contrôle du stock se fera au moment de la livraison.
  function openVariantPickerForOrder(idx){
    const stats = computeStats();
    const groups = d.products.map(p=>{
      const items = d.variants.filter(v=>v.productId===p.id).map(v=>{
        const st = (stats.sm[v.id]&&stats.sm[v.id].stock)||0;
        return {value:v.id, label:v.label, sub: st+" en stock"+(v.salePrice?" · prix "+fmt(v.salePrice):"")};
      });
      return {label:p.name, items};
    }).filter(g=>g.items.length>0);
    openCustomPicker({
      title:t("form.chooseItem"),
      selectedValue: orderItems[idx].variantId,
      groups,
      emptyText:t("pick.emptyCatalog"),
      onSelect:(val)=>{
        orderItems[idx].variantId = val;
        const v = d.variants.find(x=>x.id===val);
        if(v && v.salePrice) orderItems[idx].salePrice = Math.round(fromGNF(v.salePrice, cur()));
        renderOrderBody();
      }
    });
  }

  function orderTotalDisplay(){
    return orderItems.filter(it=>it.variantId && +it.qty>0 && +it.salePrice>0)
      .reduce((sum,it)=>sum + (+it.qty)*(+it.salePrice), 0);
  }

  function itemsHtml(){
    const stats = computeStats();
    return orderItems.map((it,idx)=>{
      const stock = (stats.sm[it.variantId]&&stats.sm[it.variantId].stock)||0;
      const short = it.variantId && +it.qty>0 && (+it.qty)>stock;
      return `
      <div style="background:rgba(255,255,255,0.03);border-radius:10px;padding:12px;margin-bottom:8px;border:1px solid var(--border);">
        <div class="field"><label>${t("form.item")} ${idx+1}</label>
          <div id="oiTriggerWrap${idx}">${pickerTriggerHtml("oiTrigger"+idx, variantLabel(it.variantId), t("form.chooseItem"))}</div></div>
        ${it.variantId?`<div style="font-size:11px;color:${short?'var(--red)':'var(--green)'};margin-bottom:8px;">${t("ord.stockNow")} ${stock}${short?t("ord.restock"):""}</div>`:""}
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
          <div class="field"><label>${t("form.qty")}</label><input type="number" class="oi-qty" data-idx="${idx}" value="${it.qty}" placeholder="1"></div>
          <div class="field"><label>${t("ord.expectedPrice")} (${curSym()})</label><input type="number" class="oi-price" data-idx="${idx}" value="${it.salePrice}" placeholder="15000"></div>
        </div>
        ${orderItems.length>1?`<button class="oi-remove" data-idx="${idx}" style="background:none;border:none;color:var(--red);cursor:pointer;font-size:12px;padding:0;">${t("form.removeItem")}</button>`:""}
      </div>`;
    }).join("");
  }

  function bodyHtml(){
    return `
    <div class="modal-head"><div class="modal-title">📋 ${isEdit?t("ord.editTitle"):t("ord.newTitle")}</div>
      <button class="modal-close" onclick="closeModal()">✕</button></div>
    <div style="font-size:11px;color:var(--sub);background:rgba(91,155,213,0.10);border:1px solid rgba(91,155,213,0.25);border-radius:8px;padding:9px;margin-bottom:12px;">
      ${t("ord.reservationHint")}
    </div>
    <div class="field"><label>${t("ord.clientName")}</label>
      <input id="moClient" placeholder="${t("ord.clientPh")}" value="${esc(orderItems._client)}"></div>
    <div class="field"><label>${t("ord.phone")}</label>
      <input id="moPhone" placeholder="${t("ord.phonePh")}" value="${esc(orderItems._clientPhone)}"></div>
    <div id="orderItemsWrap">${itemsHtml()}</div>
    <button class="btn" id="oiAdd" style="background:#3a3040;margin-bottom:12px;">${t("form.addItem")}</button>
    <div class="field"><label>${t("ord.deliveryPlace")}</label>
      <input id="moPlace" placeholder="${t("ord.placePh")}" value="${esc(orderItems._deliveryPlace)}"></div>
    <div class="field"><label>${t("ord.dueFor")}</label>
      <input id="moDue" placeholder="${t("ord.duePh")}" value="${esc(orderItems._dueDate)}"></div>
    <div class="field"><label>${t("ord.note")}</label>
      <input id="moNote" placeholder="${t("ord.notePh")}" value="${esc(orderItems._note)}"></div>
    <div class="row-between" style="padding:10px 0;border-top:1px solid var(--border);margin-bottom:10px;">
      <span style="color:var(--sub);font-size:13px;">${t("ord.expectedTotal")}</span>
      <span id="orderTotal" style="color:var(--goldL);font-weight:bold;font-size:16px;">${fmtRaw(orderTotalDisplay())}</span>
    </div>
    <button class="btn" style="background:#3a6ea8;" id="oiSave">📋 ${isEdit?t("ord.saveEdit"):t("ord.saveNew")}</button>`;
  }

  function renderOrderBody(scrollBottom){
    const prevBox = document.querySelector("#modalRoot .modal-box");
    const prevScroll = prevBox ? prevBox.scrollTop : 0;
    openModal(bodyHtml());
    bindOrderHandlers();
    const box = document.querySelector("#modalRoot .modal-box");
    if(box) box.scrollTop = scrollBottom ? box.scrollHeight : prevScroll;
  }

  function updateOrderTotal(){
    const el = document.getElementById("orderTotal");
    if(el) el.textContent = fmtRaw(orderTotalDisplay());
  }

  function bindOrderHandlers(){
    orderItems.forEach((it,idx)=>{
      const trig = document.getElementById("oiTrigger"+idx);
      if(trig) trig.onclick = ()=>openVariantPickerForOrder(idx);
    });
    document.querySelectorAll(".oi-qty").forEach(el=>el.oninput=()=>{ orderItems[+el.dataset.idx].qty=el.value; updateOrderTotal(); });
    document.querySelectorAll(".oi-price").forEach(el=>el.oninput=()=>{ orderItems[+el.dataset.idx].salePrice=el.value; updateOrderTotal(); });
    document.querySelectorAll(".oi-remove").forEach(el=>el.onclick=()=>{ orderItems.splice(+el.dataset.idx,1); renderOrderBody(); });
    const addBtn = document.getElementById("oiAdd");
    if(addBtn) addBtn.onclick = ()=>{ orderItems.push({variantId:"",qty:"",salePrice:""}); renderOrderBody(true); };
    const cl = document.getElementById("moClient"); if(cl) cl.oninput = ()=>{ orderItems._client = cl.value; };
    const ph = document.getElementById("moPhone"); if(ph) ph.oninput = ()=>{ orderItems._clientPhone = ph.value; };
    const pl = document.getElementById("moPlace"); if(pl) pl.oninput = ()=>{ orderItems._deliveryPlace = pl.value; };
    const du = document.getElementById("moDue"); if(du) du.oninput = ()=>{ orderItems._dueDate = du.value; };
    const nt = document.getElementById("moNote"); if(nt) nt.oninput = ()=>{ orderItems._note = nt.value; };

    const save = document.getElementById("oiSave");
    if(save) save.onclick = ()=>{
      const client = (document.getElementById("moClient").value||"").trim();
      if(!client){ alert(t("ord.clientReqAlert")); return; }
      const valid = orderItems.filter(it=>it.variantId && +it.qty>0 && +it.salePrice>0);
      if(!valid.length){ alert(t("ord.noValidItem")); return; }
      const items = valid.map(it=>({variantId:it.variantId, qty:+it.qty, salePrice: toGNF(+it.salePrice, cur())}));
      const payload = {
        client,
        clientPhone: (document.getElementById("moPhone").value||"").trim(),
        deliveryPlace: (document.getElementById("moPlace").value||"").trim(),
        dueDate: (document.getElementById("moDue").value||"").trim(),
        note: (document.getElementById("moNote").value||"").trim(),
        items
      };
      if(isEdit){
        const o = state.data.orders.find(x=>x.id===existing.id);
        if(o) Object.assign(o, payload); // id, orderNo, date et statut préservés
        closeModal(); saveData();
        showToast(t("ord.editedToast"));
      } else {
        state.data.orders.push(Object.assign({
          id: uid(),
          orderNo: generateReceiptNumber("OR"),
          date: todayFR(),
          status: "pending",
          recordedBy: (settings && settings.ownerName) || "",
          recordedById: currentActorId()
        }, payload));
        closeModal(); saveData();
        showToast(t("ord.savedToast"));
      }
    };
  }

  openModal(bodyHtml());
  bindOrderHandlers();
}

/* ════════════════════════════════════════════════
   MODAL: ADD SALE (multi-articles, prix auto-rempli)
════════════════════════════════════════════════ */
let saleItems = [];
function openAddSaleModal(existingGroup, fromOrder){
  const d = state.data;
  const isEdit = !!existingGroup;
  // Quantités déjà "consommées" par la vente d'origine, par variante — on les rend disponibles
  // au stock pendant la validation, puisqu'on est en train de corriger cette même vente
  // (sinon la vente se bloquerait elle-même en pensant qu'il n'y a plus assez de stock).
  const originalQtyByVariant = {};
  if(isEdit){
    existingGroup.lines.forEach(s=>{ originalQtyByVariant[s.variantId] = (originalQtyByVariant[s.variantId]||0) + s.qty; });
    saleItems = existingGroup.lines.map(s=>({
      variantId: s.variantId, qty: s.qty, salePrice: Math.round(fromGNF(s.salePrice, cur()))
    }));
    saleItems._sellerName = existingGroup.sellerName || settings.ownerName || "";
    saleItems._isCredit = !!existingGroup.isCredit;
    saleItems._client = existingGroup.client || "";
    saleItems._clientPhone = existingGroup.clientPhone || "";
  } else if(fromOrder){
    // Livraison d'une commande : on pré-remplit la vente avec ce qui avait été réservé.
    // Le prix reste modifiable ici (il a pu changer depuis la commande), et le choix
    // comptant/crédit se fait maintenant. C'est CETTE vente qui bougera l'argent et le stock.
    saleItems = (fromOrder.items||[]).map(it=>({
      variantId: it.variantId, qty: it.qty, salePrice: Math.round(fromGNF(it.salePrice, cur()))
    }));
    saleItems._sellerName = settings.ownerName || "";
    saleItems._isCredit = false;
    saleItems._client = fromOrder.client || "";
    saleItems._clientPhone = fromOrder.clientPhone || "";
  } else {
    saleItems = [{variantId:"",qty:"",salePrice:""}];
    saleItems._sellerName = settings.ownerName || "";
    saleItems._isCredit = false;
  }

  function effectiveStock(variantId, stats){
    const base = (stats.sm[variantId]&&stats.sm[variantId].stock)||0;
    return base + (originalQtyByVariant[variantId]||0);
  }

  function variantTriggerLabel(variantId){
    if(!variantId) return "";
    const v = d.variants.find(x=>x.id===variantId);
    const p = v ? d.products.find(x=>x.id===v.productId) : null;
    return v ? ((p?p.name+" — ":"")+v.label) : "";
  }

  function openVariantPickerForSale(idx){
    const stats = computeStats();
    const groups = d.products.map(p=>{
      const items = d.variants.filter(v=>v.productId===p.id && (effectiveStock(v.id,stats)>0 || v.id===saleItems[idx].variantId)).map(v=>{
        const st = effectiveStock(v.id,stats);
        return {value:v.id, label:v.label, sub: st+" "+t("pick.avail")+(v.salePrice?" · "+t("pick.fixedPrice")+" "+fmt(v.salePrice):"")};
      });
      return {label:p.name, items};
    }).filter(g=>g.items.length>0);
    openCustomPicker({
      title:t("form.chooseItem"),
      selectedValue: saleItems[idx].variantId,
      groups,
      emptyText:t("pick.emptyStock"),
      onSelect:(val)=>{
        saleItems[idx].variantId = val;
        const v = d.variants.find(x=>x.id===val);
        if(v && v.salePrice){
          saleItems[idx].salePrice = Math.round(fromGNF(v.salePrice, cur()));
        }
        renderModalBody();
      }
    });
  }

  function itemsHtml(){
    const stats = computeStats();
    return saleItems.map((it,idx)=>{
      const stock = effectiveStock(it.variantId, stats);
      return `
      <div style="background:rgba(255,255,255,0.03);border-radius:10px;padding:12px;margin-bottom:8px;border:1px solid var(--border);">
        <div class="field"><label>${t("form.item")} ${idx+1}</label>
          <div id="siTriggerWrap${idx}">${pickerTriggerHtml("siTrigger"+idx, variantTriggerLabel(it.variantId), t("form.chooseItem"))}</div></div>
        ${it.variantId?`<div style="font-size:11px;color:var(--green);margin-bottom:8px;">${t("form.stockAvailable")} ${stock}</div>`:""}
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
          <div class="field"><label>${t("form.qty")}</label><input type="number" class="si-qty" data-idx="${idx}" value="${it.qty}" placeholder="1"></div>
          <div class="field"><label>${t("sale.unitPrice")} (${curSym()})</label><input type="number" class="si-price" data-idx="${idx}" value="${it.salePrice}" placeholder="15000"></div>
        </div>
        ${saleItems.length>1?`<button class="si-remove" data-idx="${idx}" style="background:none;border:none;color:var(--red);cursor:pointer;font-size:12px;padding:0;">${t("form.removeItem")}</button>`:""}
      </div>`;
    }).join("");
  }

  function computeSummary(){
    const stats = computeStats();
    let totalDisplay=0, profitGNF=0, hasCost=false;
    saleItems.forEach(it=>{
      const q=+it.qty, p=+it.salePrice;
      if(q>0 && p>0){
        totalDisplay += q*p;
        const pGNF = toGNF(p, cur());
        const smd = stats.sm[it.variantId];
        const avg = smd && smd.totalQtyIn>0 ? smd.totalCostIn/smd.totalQtyIn : 0;
        if(avg>0){ profitGNF += q*(pGNF-avg); hasCost=true; }
      }
    });
    return {totalDisplay, profitGNF, hasCost};
  }

  function renderModalBody(scrollToBottom){
    const sum = computeSummary();
    const isCredit = !!saleItems._isCredit;
    const prevBox = document.querySelector("#modalRoot .modal-box");
    const prevScroll = prevBox ? prevBox.scrollTop : 0;
    openModal(`
      <div class="modal-head"><div class="modal-title">${isEdit?t("sale.editTitle"):t("sale.newTitle")}</div>
        <button class="modal-close" onclick="closeModal()">✕</button></div>
      ${isEdit?`<div style="font-size:11px;color:var(--sub);background:rgba(212,149,106,0.08);border:1px dashed var(--border);border-radius:8px;padding:10px 12px;margin-bottom:14px;">
        ${t("sale.sharedReceiptWarn")}
      </div>`:""}
      <div style="font-size:10px;color:var(--sub);letter-spacing:0.8px;margin-bottom:8px;">${t("form.itemsSold")}</div>
      <div id="siList">${itemsHtml()}</div>
      <button class="add-dashed" id="siAdd">${t("form.addItem")}</button>
      <div class="field"><label>${t("sale.soldBy")}</label>
        <input id="msSeller" value="${esc(saleItems._sellerName!==undefined?saleItems._sellerName:(settings.ownerName||""))}" placeholder="${t("sale.sellerPh")}" ${sellerRO()?'readonly style="opacity:0.7;"':''}></div>
      <div class="field"><label>${t("sale.type")}${isEdit?t("sale.typeFixed"):""}</label>
        ${isEdit
          ? `<div class="pill active" style="width:100%;text-align:center;opacity:0.75;">${isCredit?t("sale.credit"):t("sale.cash")}</div>`
          : `<div style="display:flex;gap:8px;">
               <button type="button" id="saleTypeCash" class="pill ${!isCredit?'active':''}" style="flex:1;">${t("sale.cash")}</button>
               <button type="button" id="saleTypeCredit" class="pill ${isCredit?'active':''}" style="flex:1;">${t("sale.credit")}</button>
             </div>`}
      </div>
      <div class="field"><label>${t("sale.clientName")}${isCredit?t("sale.clientReq"):t("sale.clientOpt")}</label>
        <input id="msClient" value="${esc(saleItems._client||"")}" placeholder="${t("sale.clientPh")}"></div>
      <div class="field"><label>${t("sale.clientPhone")}</label>
        <input id="msClientPhone" type="tel" value="${esc(saleItems._clientPhone||"")}" placeholder="${t("sale.phonePh")}"></div>
      ${(isCredit && !isEdit)?`<div class="field"><label>${t("sale.paidNow")}</label>
        <input type="number" id="msPaidNow" value="${esc(saleItems._paidNow||"")}" placeholder="${t("pay.amountPh")}"></div>
        <div style="font-size:11px;color:var(--sub);margin-bottom:14px;margin-top:-6px;">
          ${t("sale.creditHint")}
        </div>`:""}
      <div class="row-between" style="padding:10px 14px;background:rgba(94,201,138,0.1);border-radius:10px;margin-bottom:${sum.hasCost?'6px':'14px'};">
        <span style="color:var(--sub);font-size:13px;">${isCredit?t("sale.totalCredit"):t("sale.totalCash")}</span>
        <span style="font-weight:bold;color:var(--green);" id="siTotal">${fmtRaw(sum.totalDisplay)}</span>
      </div>
      <div class="row-between" id="siProfitRow" style="padding:0 14px 14px;display:${(sum.hasCost && !sellerRO())?'flex':'none'};">
        <span style="color:var(--sub);font-size:13px;">${t("rep.estProfit")}</span>
        <span style="font-weight:bold;color:${sum.profitGNF>=0?'var(--green)':'var(--red)'};" id="siProfit">${sum.profitGNF>=0?"+":""}${fmt(sum.profitGNF)}</span>
      </div>
      <button class="btn" style="background:#1e6640;" id="siSave">${isEdit?t("sale.saveEdit"):(isCredit?t("sale.saveCredit"):t("sale.saveCash"))}</button>
    `);
    bindEvents();
    const newBox = document.querySelector("#modalRoot .modal-box");
    if(newBox){ newBox.scrollTop = scrollToBottom ? newBox.scrollHeight : prevScroll; }
  }

  function bindEvents(){
    saleItems.forEach((it,idx)=>{
      const trig = document.getElementById("siTrigger"+idx);
      if(trig) trig.onclick = ()=>openVariantPickerForSale(idx);
    });
    document.querySelectorAll(".si-qty").forEach(el=>el.oninput=()=>{ saleItems[+el.dataset.idx].qty=el.value; updateSummary(); });
    document.querySelectorAll(".si-price").forEach(el=>el.oninput=()=>{ saleItems[+el.dataset.idx].salePrice=el.value; updateSummary(); });
    document.querySelectorAll(".si-remove").forEach(el=>el.onclick=()=>{ saleItems.splice(+el.dataset.idx,1); renderModalBody(); });
    document.getElementById("siAdd").onclick = ()=>{ saleItems.push({variantId:"",qty:"",salePrice:""}); renderModalBody(true); }; // défile vers le bas
    document.getElementById("msSeller").oninput = ()=>{ saleItems._sellerName = document.getElementById("msSeller").value; };
    document.getElementById("msClient").oninput = ()=>{ saleItems._client = document.getElementById("msClient").value; };
    document.getElementById("msClientPhone").oninput = ()=>{ saleItems._clientPhone = document.getElementById("msClientPhone").value; };
    const saleTypeCash = document.getElementById("saleTypeCash");
    const saleTypeCredit = document.getElementById("saleTypeCredit");
    if(saleTypeCash) saleTypeCash.onclick = ()=>{ saleItems._isCredit = false; renderModalBody(); };
    if(saleTypeCredit) saleTypeCredit.onclick = ()=>{ saleItems._isCredit = true; renderModalBody(); };
    const paidNowEl = document.getElementById("msPaidNow");
    if(paidNowEl) paidNowEl.oninput = ()=>{ saleItems._paidNow = paidNowEl.value; };

    document.getElementById("siSave").onclick = ()=>{
      const stats = computeStats();
      const valid = saleItems.filter(it=>it.variantId && +it.qty>0 && +it.salePrice>0);
      if(!valid.length){ alert(t("form.noValidItem")); return; }
      // On additionne d'abord les quantités par variante sur TOUTE la vente avant de
      // comparer au stock — sinon, si le même article apparaît sur 2 lignes différentes,
      // chaque ligne passerait la vérification individuellement même si le total dépasse le stock.
      const consumedByVariant = {};
      valid.forEach(it=>{ consumedByVariant[it.variantId] = (consumedByVariant[it.variantId]||0) + (+it.qty); });
      for(const variantId in consumedByVariant){
        const stock = effectiveStock(variantId, stats);
        const demanded = consumedByVariant[variantId];
        if(demanded>stock){
          const v = d.variants.find(x=>x.id===variantId);
          alert(t("sale.stockShortA")+" "+(v?v.label:t("sale.anItem"))+" : "+stock+" "+t("sale.stockShortB")+" "+demanded+" "+t("sale.stockShortC"));
          return;
        }
      }
      const isCredit = !!saleItems._isCredit;
      const clientVal = document.getElementById("msClient").value.trim();
      const clientPhoneVal = document.getElementById("msClientPhone").value.trim();
      const sellerVal = document.getElementById("msSeller").value.trim() || settings.ownerName || "";
      if(isCredit && !clientVal){ alert(t("sale.clientReqAlert")); return; }

      const sum = computeSummary();
      let paidNow = 0;
      if(isCredit){
        const paidNowInput = document.getElementById("msPaidNow");
        paidNow = paidNowInput ? (+paidNowInput.value || 0) : 0;
        if(paidNow < 0){ alert(t("sale.paidNeg")); return; }
        if(paidNow > sum.totalDisplay){ alert(t("sale.paidTooMuch")+" ("+fmtRaw(sum.totalDisplay)+")."); return; }
      }

      function finalizeSale(clientId){
        const groupId = isEdit ? existingGroup.id : uid();
        const receiptNo = isEdit ? existingGroup.receiptNo : generateReceiptNumber();
        const date = isEdit ? existingGroup.date : todayFR();
        if(isEdit){
          // Retire les anciennes lignes de cette vente avant de pousser les nouvelles — même
          // groupe, même numéro de reçu, même date : c'est une correction, pas une nouvelle vente.
          state.data.sales = state.data.sales.filter(s=>(s.groupId||s.id)!==groupId);
        }
        // Prix fixé (l'« étiquette ») au moment de la vente, gelé sur chaque ligne à côté
        // du prix réellement pratiqué. Permet au propriétaire de repérer chaque remise que
        // le vendeur (ou lui-même) a accordée. En corrigeant une vente existante, on PRÉSERVE
        // le prix fixé d'origine — celui qui avait cours le jour de la vente — même si
        // l'étiquette du produit a changé depuis : un reçu déjà émis ne se réécrit jamais.
        const originalListByVariant = {};
        if(isEdit){
          existingGroup.lines.forEach(s=>{ if(s.listPrice!=null) originalListByVariant[s.variantId] = s.listPrice; });
        }
        const pushedSales = [];
        valid.forEach(it=>{
          let listPriceGNF;
          if(isEdit && originalListByVariant[it.variantId]!=null){
            listPriceGNF = originalListByVariant[it.variantId];
          } else {
            const vRef = d.variants.find(x=>x.id===it.variantId);
            if(vRef && vRef.salePrice){
              // On fait passer le prix fixé par le MÊME aller-retour d'arrondi que le prix
              // saisi (GNF → devise affichée → arrondi → GNF). Ainsi, si le vendeur ne
              // change rien, prix fixé et prix vendu tombent EXACTEMENT sur le même nombre :
              // aucune "fausse remise" ne peut naître d'un simple arrondi de conversion.
              const fixedInDisplay = Math.round(fromGNF(vRef.salePrice, cur()));
              listPriceGNF = toGNF(fixedInDisplay, cur());
            } else {
              listPriceGNF = 0;
            }
          }
          const saleRecord = {
            id:uid(), groupId, receiptNo, date, client:clientVal, clientPhone:clientPhoneVal,
            clientId: isCredit ? clientId : null,
            sellerName: sellerVal, isCredit,
            status: isEdit ? (existingGroup.status||"active") : "active",
            variantId:it.variantId, qty:+it.qty,
            salePrice: toGNF(+it.salePrice, cur()),
            listPrice: listPriceGNF,
            recordedById: currentActorId()
          };
          state.data.sales.push(saleRecord);
          pushedSales.push(saleRecord);
        });
        let initialPayment = null;
        if(!isEdit && isCredit && paidNow>0){
          initialPayment = {
            id:uid(), clientId, client:clientVal, clientPhone:clientPhoneVal,
            amount:toGNF(paidNow,cur()), date, receiptNo: generateReceiptNumber("PAY"),
            recordedBy: saleItems._sellerName || (settings && settings.ownerName) || ""
          };
          state.data.payments.push(initialPayment);
        }
        if(isCredit){
          // On fige l'état du compte (payé/reste) tel qu'il est à CET INSTANT précis sur le
          // reçu de cette vente — pour qu'il reste un document historique fixe, qui ne changera
          // plus jamais même si d'autres paiements arrivent ensuite. Chaque paiement reçu plus
          // tard générera son propre reçu séparé avec son propre instantané, sans jamais modifier
          // les reçus déjà émis.
          const debtEntry = getDebtsByClient().find(c=>c.clientId===clientId);
          const snapPaid = debtEntry ? debtEntry.paid : 0;
          const snapRemaining = debtEntry ? debtEntry.remaining : 0;
          pushedSales.forEach(s=>{ s.accountPaidSnapshot = snapPaid; s.accountRemainingSnapshot = snapRemaining; });
          // L'acompte reçoit SA photo maintenant, au même instant que la vente.
          // Sans cela, son reçu resterait incomplet et afficherait plus tard un état
          // du compte postérieur — donc faux — figé pour toujours.
          if(initialPayment){
            initialPayment.paidSnapshot = snapPaid;
            initialPayment.remainingSnapshot = snapRemaining;
          }
        }
        closeModal(); saveData();
        // Si cette vente vient de la livraison d'une commande, on marque la commande comme
        // livrée et on la relie à la vente créée (pour pouvoir retrouver le reçu plus tard).
        if(fromOrder && !isEdit){
          const ord = state.data.orders.find(o=>o.id===fromOrder.id);
          if(ord){
            ord.status = "delivered";
            ord.saleGroupId = groupId;
            ord.deliveredAt = date;
            saveData();
          }
        }
        showToast(isEdit?t("toast.saleEdited"):(fromOrder?t("toast.orderDelivered"):(isCredit?t("toast.creditSaved"):t("toast.saleSaved"))));
      }

      if(isCredit){
        if(isEdit){
          // Le client est déjà identifié (clientId figé) — pas besoin de redemander confirmation
          // d'identité, seul le nom affiché peut être corrigé, pas la fiche client liée.
          finalizeSale(existingGroup.clientId);
        } else {
          // On résout d'abord l'identité du client (avec confirmation si le nom existe déjà)
          // avant de finaliser la vente — garantit qu'on ne rattache jamais une dette à la
          // mauvaise personne, même en cas d'homonymie.
          resolveClientForCreditSale(clientVal, clientPhoneVal, (clientId)=> finalizeSale(clientId));
        }
      } else {
        finalizeSale(null);
      }
    };
  }

  function updateSummary(){
    const sum = computeSummary();
    const totalEl = document.getElementById("siTotal");
    if(totalEl) totalEl.textContent = fmtRaw(sum.totalDisplay);
    const profitRow = document.getElementById("siProfitRow");
    const profitEl = document.getElementById("siProfit");
    if(profitRow && profitEl){
      profitRow.style.display = (sum.hasCost && !sellerRO()) ? "flex" : "none";
      profitEl.textContent = (sum.profitGNF>=0?"+":"")+fmt(sum.profitGNF);
      profitEl.style.color = sum.profitGNF>=0 ? "var(--green)" : "var(--red)";
    }
  }

  renderModalBody();
}

function openAddExpenseModal(existing){
  const isEdit = !!existing;
  // En édition, on pré-remplit avec la catégorie de la dépense (même si elle a été
  // supprimée de la liste depuis) ; sinon on prend la première catégorie disponible.
  let meCategory = isEdit ? (existing.category || getExpenseCategories()[0] || "") : (getExpenseCategories()[0] || "");
  const amountDisplay = isEdit ? fromGNF(existing.amount, cur()) : "";
  openModal(`
    <div class="modal-head"><div class="modal-title">💸 ${isEdit?t("exp.editTitle"):t("exp.newTitle")}</div>
      <button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="field"><label>${t("exp.description")}</label>
      <input id="meLabel" placeholder="${t("exp.descPh")}" value="${isEdit?esc(existing.label||""):""}"></div>
    <div class="field"><label>${t("prod.category")}</label>
      <div id="meCatTriggerWrap">${pickerTriggerHtml("meCatTrigger", meCategory, t("prod.chooseCategory"))}</div></div>
    <div class="field"><label>${t("exp.amount")} (${curSym()})</label>
      <input type="number" id="meAmount" placeholder="50000" value="${amountDisplay}"></div>
    <button class="btn" style="background:#7a4a10;" id="meSave">💸 ${isEdit?t("exp.saveEdit"):t("exp.saveNew")}</button>
  `);

  function updateMeCatTrigger(){
    document.getElementById("meCatTriggerWrap").innerHTML = pickerTriggerHtml("meCatTrigger", meCategory, t("prod.chooseCategory"));
    document.getElementById("meCatTrigger").onclick = ()=>{
      openCustomPicker({
        title:t("exp.catPickerTitle"),
        selectedValue: meCategory,
        groups:[{items: getExpenseCategories().map(c=>({value:c,label:c}))}],
        onSelect:(val)=>{ meCategory = val; updateMeCatTrigger(); }
      });
    };
  }
  updateMeCatTrigger();

  document.getElementById("meSave").onclick = ()=>{
    // Description facultative : si elle est vide, la catégorie servira de titre à l'affichage.
    const label = document.getElementById("meLabel").value.trim();
    const amount = +document.getElementById("meAmount").value;
    if(!amount || amount<=0){ alert(t("pay.invalidAmount")); return; }
    if(isEdit){
      // Correction d'une dépense existante : on garde son id, sa date et son statut
      // (actif/archivé) ; on ne met à jour que la description, la catégorie et le montant.
      const ex = state.data.expenses.find(x=>x.id===existing.id);
      if(ex){ ex.label = label; ex.category = meCategory; ex.amount = toGNF(amount,cur()); }
      closeModal(); saveData();
      showToast(t("exp.edited"));
    } else {
      state.data.expenses.push({id:uid(),date:todayFR(),label,category:meCategory,amount:toGNF(amount,cur())});
      closeModal(); saveData();
      showToast(t("exp.saved"));
    }
  };
}
