// Drapeau construit à partir des deux lettres du pays (GN → 🇬🇳).
function countryFlag(code){
  try{
    return String.fromCodePoint(...code.toUpperCase().split("").map(c=>0x1F1E6 + c.charCodeAt(0) - 65));
  }catch(e){ return ""; }
}
// Nom du pays dans la langue de l'application. Si le téléphone est trop ancien
// pour connaître les noms de pays, on affiche au moins le code — jamais rien de vide.
let _regionNames = null;
function countryName(code){
  try{
    if(!_regionNames || _regionNames.lang !== lang()){
      _regionNames = { lang: lang(), dn: new Intl.DisplayNames([lang()], {type:"region"}) };
    }
    return _regionNames.dn.of(code) || code;
  }catch(e){ return code; }
}

// sa propre case à côté du numéro de téléphone, le répéter n'apporte rien.
function countryLabel(code){
  const c = COUNTRIES.find(x=>x.code===code);
  if(!c) return "";
  return countryFlag(code) + "  " + countryName(code);
}
function countryDial(code){
  const c = COUNTRIES.find(x=>x.code===code);
  return c ? c.dial : "";
}
// Si la personne écrit son numéro complet avec le +, on retrouve son pays toute seule.
// Sans le +, aucun logiciel au monde ne peut deviner : c'est pourquoi le pays est
// demandé AVANT le téléphone, et l'indicatif est alors déjà rempli.
function detectCountryFromNumber(raw){
  const s = (raw||"").replace(/[^0-9+]/g,"");
  if(s.indexOf("+") !== 0) return null;
  const digits = s.slice(1);
  let best = null;
  COUNTRIES.forEach(c=>{
    if(digits.indexOf(c.dial) === 0){
      if(!best || c.dial.length > best.dial.length) best = c;
    }
  });
  return best ? best.code : null;

:IN,Asia/Dhaka:BD,Asia/Bangkok:TH,Asia/Jakarta:ID,Asia/Kuala_Lumpur:MY,Asia/Singapore:SG,Asia/Manila:PH,Asia/Ho_Chi_Minh:VN,Asia/Shanghai:CN,Asia/Hong_Kong:HK,Asia/Taipei:TW,Asia/Seoul:KR,Asia/Tokyo:JP,Australia/Sydney:AU,Australia/Melbourne:AU,Australia/Perth:AU,Pacific/Auckland:NZ";
let _tzCountryMap = null;
function countryFromTimezone(){
  try{
    if(!_tzCountryMap){
      _tzCountryMap = {};
      TZ_COUNTRY_RAW.split(",").forEach(function(pair){
        const i = pair.lastIndexOf(":");
        _tzCountryMap[pair.slice(0,i)] = pair.slice(i+1);
      });
    }
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
    if(tz && _tzCountryMap[tz]) return _tzCountryMap[tz];
  }catch(e){}
  return null;
}
function guessCountry(){
  const byTz = countryFromTimezone();
  if(byTz && COUNTRIES.some(c=>c.code===byTz)) return byTz;
  try{
    const l = (navigator.language || "").toUpperCase();
    const m = l.match(/[-_]([A-Z]{2})$/);
    if(m && COUNTRIES.some(c=>c.code===m[1])) return m[1];
  }catch(e){}
  return "GN";
}

// Sélecteur de pays dédié : la liste compte près de 200 pays, une recherche est
// indispensable — on ne fait pas défiler 200 lignes sur un téléphone.
function openCountryPicker(current, onSelect){
  const root = document.getElementById("pickerRoot");
  const sorted = COUNTRIES.slice().sort((a,b)=>countryName(a.code).localeCompare(countryName(b.code), lang()));
  function itemsHtml(filter){
    const f = (filter||"").trim().toLowerCase();
    const list = sorted.filter(c=>{
      if(!f) return true;
      return countryName(c.code).toLowerCase().indexOf(f) >= 0
          || c.code.toLowerCase().indexOf(f) >= 0
          || ("+"+c.dial).indexOf(f) >= 0
          || c.dial.indexOf(f) === 0;
    });
    if(list.length === 0) return `<div class="picker-empty">${esc(t("au.noCountry"))}</div>`;
    return list.map(c=>{
      const sel = String(c.code) === String(current);
      return `<div class="picker-item ${sel?'selected':''}" data-value="${esc(c.code)}">
        <div class="pi-text"><span class="pi-label">${esc(countryFlag(c.code)+"  "+countryName(c.code))}</span><span class="pi-sub">+${esc(c.dial)}</span></div>
        ${sel?'<span class="pi-check">✓</span>':""}
      </div>`;
    }).join("");
  }
  function bindItems(){
    root.querySelectorAll(".picker-item").forEach(el=>{
      el.onclick = ()=>{
        const val = el.dataset.value;
        closePicker();
        if(onSelect) onSelect(val);
      };
    });
  }
  root.innerHTML = `
    <div class="modal-overlay" id="pickerOverlay">
      <div class="modal-box">
        <div class="modal-head"><div class="modal-title">${esc(t("au.country"))}</div>
          <button class="modal-close" id="pickerCloseBtn">✕</button></div>
        <div style="padding:0 0 10px;"><input id="countrySearch" placeholder="${esc(t("au.countrySearch"))}"></div>
        <div class="picker-list" id="pickerListZone">${itemsHtml("")}</div>
      </div>
    </div>`;
  document.getElementById("pickerCloseBtn").onclick = closePicker;
  document.getElementById("pickerOverlay").addEventListener("click", e=>{ if(e.target.id==="pickerOverlay") closePicker(); });
  document.getElementById("countrySearch").oninput = (e)=>{
    document.getElementById("pickerListZone").innerHTML = itemsHtml(e.target.value);
    bindItems();
  };
  bindItems();
  if(typeof window!=="undefined" && window.rpArmBack) window.rpArmBack();
}

/* ════════════════════════════════════════════════
   PRÉFÉRENCES D'AVANT-COMPTE (langue et thème)
   ════════════════════════════════════════════════
   Avant qu'un compte existe, aucun réglage n'est encore enregistré. On garde
   pourtant le choix de la personne dans un petit coin de mémoire à part : si elle
   ferme et rouvre l'application au milieu de l'inscription, elle retrouve sa langue
   et son thème, au lieu de tout revoir en français sombre.
════════════════════════════════════════════════ */
const PREF_KEY = "registrepro_prefs_v1";
let obTheme = "dark";
(function loadPrefs(){
  try{
    const p = JSON.parse(localStorage.getItem(PREF_KEY));
    if(p && p.lang && LANGUAGES[p.lang]) obLang = p.lang;
    if(p && (p.theme === "light" || p.theme === "dark")) obTheme = p.theme;
  }catch(e){}
})();
function savePrefs(){
  try{ localStorage.setItem(PREF_KEY, JSON.stringify({lang:obLang, theme:obTheme})); }catch(e){}
}

// Thème en cours : celui du compte s'il existe, sinon celui choisi sur l'écran d'accueil.
function currentTheme(){ return (settings && settings.theme) ? settings.theme : obTheme; }
function themeLabel(v){ return v === "light" ? t("au.themeLight") : t("au.themeDark"); }

function openLangPicker(current, onSelect){
  openCustomPicker({
    title: t("au.language"),
    selectedValue: current,
    groups: [{items:[{value:"fr", label:"🇫🇷 Français"}, {value:"en", label:"🇬🇧 English"}]}],
    onSelect: onSelect
  });
}
function openThemePicker(current, onSelect){
  openCustomPicker({
    title: t("au.theme"),
    selectedValue: current,
    groups: [{items:[{value:"dark", label:t("au.themeDark")}, {value:"light", label:t("au.themeLight")}]}],
    onSelect: onSelect
  });
}


/* ════════════════════════════════════════════════

   ════════════════════════════════════════════════
   Ordre voulu, celui des grandes applications : on vérifie QUI vous êtes
   avant de vous faire remplir quoi que ce soit d'autre.

     1. Email + mot de passe   → le code part
     2. Le code à 6 chiffres   → le compte existe pour de bon
     3. Le commerce            → l'application s'ouvre

   Si l'adresse est déjà inscrite, on le dit dès le premier écran, avec un
   bouton qui emmène directement à la connexion — jamais après avoir fait
   remplir dix cases pour rien.

   Le code de verrouillage (PIN) n'est PAS demandé ici : c'est un confort,

════════════════════════════════════════════════ */

// L'œil est dessiné au trait, sans couleur propre : il prend la teinte discrète des
// libellés. Masqué : un œil simple. Visible : le même œil barré d'un trait incliné.
function eyeIconSvg(shown){
  const common = `width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"`;
  const eye = `<path d="M1.9 12S5.5 5.3 12 5.3 22.1 12 22.1 12 18.5 18.7 12 18.7 1.9 12 1.9 12Z"/><circle cx="12" cy="12" r="3.1"/>`;
  const slash = shown ? `<line x1="4.2" y1="19.8" x2="19.8" y2="4.2"/>` : "";
  return `<svg ${common}>${eye}${slash}</svg>`;
}
function pwFieldHtml(id, value, ph, autocomplete){
  const shown = !!authUI.showPw[id];
  return `<div style="position:relative;">
    <input id="${id}" type="${shown?"text":"password"}" autocomplete="${autocomplete}" value="${esc(value||"")}" placeholder="${esc(ph)}" style="padding-right:46px;">
    <button type="button" id="${id}Eye" aria-label="${esc(t("au.showPw"))}" style="position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--sub);line-height:0;cursor:pointer;padding:8px 10px;">${eyeIconSvg(shown)}</button>
  </div>`;
}
// L'œil change l'affichage sur place, sans redessiner l'écran : ce qui a déjà été
// tapé ne peut donc jamais être perdu en appuyant dessus.
function bindPwToggle(id){
  const btn = document.getElementById(id+"Eye");
  const inp = document.getElementById(id);
  if(!btn || !inp) return;
  btn.onclick = ()=>{
    const shown = (inp.type === "text");
    inp.type = shown ? "password" : "text";
    btn.innerHTML = eyeIconSvg(!shown);
    authUI.showPw[id] = !shown;
  };
}

function passwordProblem(pw){
  if((pw||"").length < 8) return t("au.errPwShort");
  if(!/[a-zA-Z]/.test(pw) || !/[0-9]/.test(pw)) return t("au.errPwWeak");

}

      <div class="ob-title" style="font-size:18px;">${esc(t("au.newPwTitle"))}</div>
      <div class="ob-sub">${esc(t("au.newPwSub"))}</div>
      ${errHtml}
      <div class="field"><label>${esc(t("au.password"))}</label>
        ${pwFieldHtml("auPw", "", t("au.passwordPh"), "new-password")}</div>
      <div class="field"><label>${esc(t("au.password2"))}</label>
        ${pwFieldHtml("auPw2", "", t("au.password2Ph"), "new-password")}</div>
      <button class="btn" style="background:var(--gold);margin-top:6px;" id="auSavePw" ${authUI.busy?"disabled":""}>${esc(t("au.savePassword"))}</button>`;
  }

  ob.innerHTML = `<div class="ob-box">${body}</div>`;
  bindAuthScreen();
}

function bindAuthScreen(){
  const S = authUI.screen;
  const $ = (id)=>document.getElementById(id);

  const back = $("auBack");
  if(back) back.onclick = ()=>{
    // Reculer depuis l'écran du code est un abandon volontaire : la note doit partir,
    // sinon l'application y reviendrait au prochain démarrage.
    if(S === "otp" || S === "forgotOtp") clearPendingOtp();
    authGo(back.dataset.target);
  };
  const goLogin = $("auGoLogin");
  if(goLogin) goLogin.onclick = ()=>{ authGo("login"); };

  if(S === "welcome"){
    $("auLangTrigger").onclick = ()=>{
      openLangPicker(lang(), (L)=>{
        if(!LANGUAGES[L]) return;
        obLang = L;
        if(settings){ settings.lang = L; saveSettings(settings); }
        savePrefs();
        renderAuth();
      });
    };
    $("auThemeTrigger").onclick = ()=>{
      openThemePicker(currentTheme(), (v)=>{
        obTheme = v;
        if(settings){ settings.theme = v; saveSettings(settings); }
        savePrefs();
        applyTheme();
        renderAuth();
      });
    };
    $("auToSignup").onclick = ()=>authGo("signup1");
    $("auToLogin").onclick = ()=>authGo("login");
    $("auToSellerLogin").onclick = ()=>authGo("sellerLogin");
  }

  else if(S === "signup1"){
    bindPwToggle("auPw"); bindPwToggle("auPw2");
    $("auSendSignup").onclick = async ()=>{
      if(authUI.busy) return;
      const email = $("auEmail").value.trim();
      const pw = $("auPw").value;
      const pw2 = $("auPw2").value;
      authUI.d.email = email; authUI.d.password = pw; authUI.d.password2 = pw2;
      authUI.showEmailTaken = false;
      if(!validEmail(email)) return authFail(t("au.errEmail"));
      const pwErr = passwordProblem(pw);
      if(pwErr) return authFail(pwErr);
      if(pw !== pw2) return authFail(t("au.errPwMatch"));

      authUI.busy = true; authUI.error = ""; renderAuth();
      const r = await authSignUp(email, pw);
      authUI.busy = false;
      if(!r.ok){
        if(isAlreadyRegistered(r)){ authUI.showEmailTaken = true; return authFail(t("au.errExists")); }
        return authFail(authErrorText(r));
      }
      // Le serveur ne dit jamais tout haut « cette adresse a déjà un compte » — ce serait
      // un moyen de découvrir qui est inscrit. Il répond « d'accord » et n'envoie rien.
      // Le seul indice honnête est la liste d'identités vide : on la lit ici, pour ne
      // JAMAIS laisser quelqu'un attendre un code qui ne viendra pas.
      if(r.data && Array.isArray(r.data.identities) && r.data.identities.length === 0){
        authUI.showEmailTaken = true;
        return authFail(t("au.errExists"));
      }
      authUI.d.otp = "";
      savePendingOtp("otp", email);
      authGo("otp");
      authUI.info = t("au.emailSent");
      renderAuth();
    };
  }

  else if(S === "otp" || S === "forgotOtp"){
    const isReset = (S === "forgotOtp");
    $("auOtp").oninput = (e)=>{ e.target.value = e.target.value.replace(/[^0-9]/g,""); };
    $("auVerify").onclick = async ()=>{
      if(authUI.busy) return;
      const code = $("auOtp").value.trim();
      authUI.d.otp = code;
      if(!/^\d{6}$/.test(code)) return authFail(t("au.errOtpFormat"));
      authUI.busy = true; authUI.error = ""; renderAuth();
      const r = await authVerifyOtp(authUI.d.email, code, isReset ? "recovery" : "signup");
      authUI.busy = false;
      if(!r.ok) return authFail(authErrorText(r));
      // Le code a joué son rôle : la note n'a plus lieu d'être.
      clearPendingOtp();
      if(isReset){ authGo("forgotNew"); return; }
      // Compte vérifié : il existe pour de bon. Même si l'application se ferme
      // maintenant, on pourra se connecter plus tard avec cet email.
      authUI.d.joining = false;
      // Nouveau compte : le formulaire du commerce repart vierge, pour ne pas hériter
      // du nom / téléphone saisis lors d'une inscription précédente sur cet appareil.
      authUI.d.businessName = ""; authUI.d.ownerName = ""; authUI.d.phone = "";
      authUI.d.currency = ""; authUI.d.capital = "";
      authGo("setup");
    };
    $("auResend").onclick = async ()=>{
      if(authUI.busy) return;
      authUI.busy = true; renderAuth();
      let r;
      if(isReset){
        r = await authRecover(authUI.d.email);
      } else if(authUI.d.password){
        // Chemin habituel, inchangé : le mot de passe est encore en mémoire.
        r = await authSignUp(authUI.d.email, authUI.d.password);
      } else {
        // Écran remonté après un redémarrage de l'application : le mot de passe a été
        // perdu avec la mémoire, et on ne l'écrit jamais sur l'appareil. Ce chemin-là
        // ne demande que l'adresse, si bien que le bouton reste utilisable.
        r = await authResendSignup(authUI.d.email);
      }
      authUI.busy = false;
      if(!r.ok) return authFail(authErrorText(r));
      authUI.error = ""; authUI.info = t("au.resent"); renderAuth();
    };
  }

  else if(S === "setup"){
    const bindCountry = ()=>{
      $("auCountryTrigger").onclick = ()=>{
        openCountryPicker(authUI.d.country, (code)=>{
          authUI.d.country = code;
          captureSetupFields();
          renderAuth();
        });
      };
    };
    const captureSetupFields = ()=>{
      if($("auBiz")) authUI.d.businessName = $("auBiz").value;
      if($("auOwner")) authUI.d.ownerName = $("auOwner").value;
      if($("auPhone")) authUI.d.phone = $("auPhone").value;
      if($("auCap")) authUI.d.capital = $("auCap").value;
    };
    bindCountry();
    $("auDial").onclick = ()=>{
      captureSetupFields();
      openCountryPicker(authUI.d.country, (code)=>{ authUI.d.country = code; renderAuth(); });
    };
    $("auPhone").oninput = (e)=>{
      const detected = detectCountryFromNumber(e.target.value);
      if(detected && detected !== authUI.d.country){
        authUI.d.country = detected;
        captureSetupFields();
        renderAuth();
      }
    };
    if($("auCurTrigger")){
      const bindCur = ()=>{
        $("auCurTrigger").onclick = ()=>{
          captureSetupFields();
          openCurrencyPicker(authUI.d.currency, (val)=>{
            authUI.d.currency = val;
            $("auCurWrap").innerHTML = pickerTriggerHtml("auCurTrigger", CURRENCY_LABELS[val], t("set.chooseCurrency"));
            bindCur();
          });
        };
      };
      bindCur();
    }
    $("auFinish").onclick = async ()=>{
      if(authUI.busy) return;
      captureSetupFields();
      authUI.d.businessName = (authUI.d.businessName||"").trim();
      authUI.d.ownerName = (authUI.d.ownerName||"").trim();
      authUI.d.phone = (authUI.d.phone||"").trim();
      if(!authUI.d.businessName) return authFail(t("au.errBusiness"));
      if(authUI.d.phone.replace(/[^0-9]/g,"").length < 6) return authFail(t("au.errPhone"));
      if(!authUI.d.joining && !authUI.d.currency) return authFail(t("au.errCurrency"));
      authUI.busy = true; authUI.error = ""; renderAuth();
      await finishAccountSetup();
    };
  }

  else if(S === "sellerLogin"){
    bindPwToggle("auPw");
    $("auSellerGo").onclick = async ()=>{
      if(authUI.busy) return;
      const wait = Math.ceil((authUI.loginBlockedUntil - Date.now())/1000);
      if(wait > 0) return authFail(t("au.tooManyTries").replace("{n}", wait));
      const login = $("auSellerLogin").value.trim();
      const pw = $("auPw").value;
      authUI.d.sellerLogin = login;
      if(login.length < 3) return authFail(t("sel.errLoginFormat"));
      if(!pw) return authFail(t("au.errPwEmpty"));

      authUI.busy = true; authUI.error = ""; renderAuth();
      const r = await sellerSignIn(login, pw);
      authUI.busy = false;
      if(!r.ok){
        if(r.error === "seller-suspended") return authFail(t("sel.errSuspended"));
        if(r.error !== "network"){
          authUI.loginFails++;
          if(authUI.loginFails >= 5){
            const secs = Math.min(1800, 30 * Math.pow(2, authUI.loginFails - 5));
            authUI.loginBlockedUntil = Date.now() + secs*1000;
          }
        }
        if(r.status === 400) return authFail(t("sel.errCredentials"));
        return authFail(authErrorText(r));
      }
      authUI.loginFails = 0; authUI.loginBlockedUntil = 0;
      await afterSignedIn();
    };
  }

  else if(S === "login"){
    bindPwToggle("auPw");
    $("auLogin").onclick = async ()=>{
      if(authUI.busy) return;
      // Garde-fou local : après plusieurs mots de passe ratés, on impose une pause
      // qui s'allonge. Cela n'enlève rien aux protections du serveur, cela s'ajoute.
      const wait = Math.ceil((authUI.loginBlockedUntil - Date.now())/1000);
      if(wait > 0) return authFail(t("au.tooManyTries").replace("{n}", wait));
      const email = $("auEmail").value.trim();
      const pw = $("auPw").value;
      authUI.d.email = email;
      if(!validEmail(email)) return authFail(t("au.errEmail"));
      if(!pw) return authFail(t("au.errPwEmpty"));
      authUI.busy = true; authUI.error = ""; renderAuth();
      const r = await authSignIn(email, pw);
      authUI.busy = false;
      if(!r.ok){
        if(r.error !== "network"){
          authUI.loginFails++;
          if(authUI.loginFails >= 5){
            const secs = Math.min(1800, 30 * Math.pow(2, authUI.loginFails - 5));
            authUI.loginBlockedUntil = Date.now() + secs*1000;
          }
        }
        return authFail(authErrorText(r));
      }
      authUI.loginFails = 0; authUI.loginBlockedUntil = 0;
      await afterSignedIn();
    };
    $("auForgot").onclick = ()=>authGo("forgot");
  }

  else if(S === "forgot"){
    $("auSendCode").onclick = async ()=>{
      if(authUI.busy) return;
      const email = $("auEmail").value.trim();
      authUI.d.email = email;
      if(!validEmail(email)) return authFail(t("au.errEmail"));
      authUI.busy = true; authUI.error = ""; renderAuth();
      const r = await authRecover(email);
      authUI.busy = false;
      if(!r.ok) return authFail(authErrorText(r));
      authUI.d.otp = "";
      savePendingOtp("forgotOtp", email);
      authGo("forgotOtp");
      // Message honnête : on ne révèle pas si l'adresse a un compte, et on ne
      // promet pas non plus un code qui ne viendrait jamais.
      authUI.info = t("au.resetSentMaybe");
      renderAuth();
    };
  }

  else if(S === "forgotNew"){
    bindPwToggle("auPw"); bindPwToggle("auPw2");
    $("auSavePw").onclick = async ()=>{
      if(authUI.busy) return;
      const pw = $("auPw").value;
      const pw2 = $("auPw2").value;
      const pwErr = passwordProblem(pw);
      if(pwErr) return authFail(pwErr);
      if(pw !== pw2) return authFail(t("au.errPwMatch"));
      authUI.busy = true; authUI.error = ""; renderAuth();
      const r = await authSetPassword(pw);
      authUI.busy = false;
      if(!r.ok) return authFail(authErrorText(r));
      showToast(t("au.pwChanged"));
      await afterSignedIn();
    };
  }
}

// Reconnaît un refus explicite du serveur pour cause d'adresse déjà inscrite.
function isAlreadyRegistered(r){
  const e = String((r && r.error) || "").toLowerCase();
  return e.indexOf("already registered") >= 0 || e.indexOf("already been registered") >= 0;
}

// ── Après une connexion réussie ──────────────────────────────────────────
async function afterSignedIn(){
  authUI.busy = true; authUI.error = ""; renderAuth();
  const r = await profileFetch();
  authUI.busy = false;
  if(!r.ok) return authFail(authErrorText(r));
  const row = Array.isArray(r.data) ? r.data[0] : r.data;

  // Sécurité : si cet appareil contient déjà le registre d'une AUTRE BOUTIQUE, on ne
  // mélange jamais deux commerces. On demande clairement avant d'effacer.
  // On compare bien la BOUTIQUE, pas le compte : le propriétaire et ses vendeurs
  // partagent la même boutique, passer de l'un à l'autre ne doit rien effacer.
  const hasData = state.data && (state.data.products.length || state.data.sales.length ||
                  state.data.purchases.length || state.data.expenses.length || state.data.capitalInitial);
  const previousShop = settings && settings.account ? settings.account.shopId : null;
  const incomingShop = row ? row.shop_id : null;
  if(hasData && previousShop && incomingShop && previousShop !== incomingShop){
    if(!confirm(t("au.otherAccountData"))){
      await authSignOutServer();
      return authFail(t("au.loginCancelled"));
    }
    state.data = {capitalInitial:0, products:[], variants:[], purchases:[], sales:[], expenses:[], payments:[], clients:[], deletedLog:[], orders:[], receiptCounter:0};
    _recordSignatures = new Map();
    if(typeof resetSyncState === "function") resetSyncState();
  }

  // Compte vérifié mais dont la fiche commerce n'a jamais été terminée
  // (application fermée juste après le code) : on reprend là où c'était.
  if(!row){
    authUI.d.joining = false;
    authUI.d.profile = null;
    authUI.d.businessName = ""; authUI.d.ownerName = ""; authUI.d.currency = ""; authUI.d.capital = "";
    return authGo("setup");
  }

  authUI.d.profile = row;
  authUI.d.businessName = row.business_name || "";
  authUI.d.ownerName = row.owner_name || "";
  authUI.d.currency = row.currency || "GNF";
  authUI.d.country = row.country || authUI.d.country;
  authUI.d.phone = "";
  authUI.d.capital = "";
  authUI.d.joining = true; // appareil qui rejoint un compte : pas de capital à ressaisir
  await applyAccountToDevice(row);
}

// ── Dernière étape de l'inscription : la fiche du commerce, puis l'app s'ouvre ──
async function finishAccountSetup(){
  let row = authUI.d.profile;
  const fullPhone = "+" + countryDial(authUI.d.country) + authUI.d.phone.replace(/[^0-9]/g,"");
  if(!authUI.d.joining){
    const r = await profileCreate({
      businessName: authUI.d.businessName,
      ownerName: authUI.d.ownerName,
      phone: fullPhone,
      country: authUI.d.country,
      currency: authUI.d.currency
    });
    if(!r.ok){ authUI.busy = false; return authFail(authErrorText(r)); }
    row = Array.isArray(r.data) ? r.data[0] : r.data;
    authUI.d.profile = row;
  }
  await applyAccountToDevice(row || {});
}

// Enregistre le compte sur CET appareil et ouvre l'application.
async function applyAccountToDevice(row){
  const L = lang();
  const prevSettings = settings || {};
  const fullPhone = row.phone || ("+" + countryDial(authUI.d.country) + (authUI.d.phone||"").replace(/[^0-9]/g,""));

  // Le contact affiché sur les reçus est celui du COMMERCE, jamais celui d'un vendeur.
  // Un client qui rappelle doit joindre la boutique, pas le portable personnel d'un
  // employé qui peut partir demain. Le numéro du vendeur reste rangé dans son compte.
  const isSellerAccount = (row.role === "seller");
  const shopContact = isSellerAccount
    ? (prevSettings.contact || "")   // conservé, et complété par la synchronisation
    : (fullPhone || prevSettings.contact || "");

  settings = {
    businessName: authUI.d.businessName || prevSettings.businessName || "RegistrePro",
    ownerName: authUI.d.ownerName || prevSettings.ownerName || "",
    contact: shopContact,
    currency: authUI.d.currency || row.currency || "GNF",
    lang: L,
    theme: prevSettings.theme || obTheme,
    // Le verrouillage de l'appareil n'est plus imposé : il s'active dans les Réglages.
    pinHash: prevSettings.pinHash || null,
    pinLength: prevSettings.pinLength || 4,
    pinFailCount: 0,
    pinLockedUntil: 0,
    rates: prevSettings.rates || {...DEFAULT_RATES},
    ratesUpdatedAt: prevSettings.ratesUpdatedAt || null,
    categories: (prevSettings.categories && prevSettings.categories.length) ? prevSettings.categories : defaultCategories(L),
    expenseCategories: (prevSettings.expenseCategories && prevSettings.expenseCategories.length) ? prevSettings.expenseCategories : defaultExpenseCategories(L),
    deviceId: prevSettings.deviceId || newDeviceId(),
    deviceChar: prevSettings.deviceChar || null,
    account: {
      userId: auth.user_id,
      email: auth.email || authUI.d.email,
      shopId: row.shop_id || "",
      role: row.role || "owner",
      country: row.country || authUI.d.country,
      phone: fullPhone,
      // Identifiant stable du vendeur (BS-…), pour relier ses ventes/paiements à lui seul
      // même si un autre vendeur porte le même nom. Vide pour le propriétaire.
      sellerLogin: (row.role === "seller") ? (authUI.d.sellerLogin || "") : ""
    }
  };
  saveSettings(settings);
  clearPendingOtp(); // le compte est en place : plus aucune inscription en attente

  // Capital de départ : uniquement à la création du commerce, jamais sur un appareil
  // qui rejoint un compte existant (le capital y viendra de la synchronisation).
  if(!authUI.d.joining){
    // Nouveau commerce : il démarre FORCÉMENT vierge. On efface tout registre qu'un
    // compte précédent aurait laissé sur cet appareil — sinon ses ventes réapparaîtraient
    // dans le nouveau compte, et pourraient même remonter au serveur sous ce nouveau
    // commerce. Un compte qui REJOINT (joining) n'est pas concerné : ses données viennent
    // de la synchronisation, et le garde-fou de connexion s'occupe déjà du changement de boutique.
    state.data = {capitalInitial:0, products:[], variants:[], purchases:[], sales:[], expenses:[], payments:[], clients:[], deletedLog:[], orders:[], receiptCounter:0};
    _recordSignatures = new Map();
    if(typeof resetSyncState === "function") resetSyncState();
    const capRaw = +authUI.d.capital || 0;
    let usedFallback = false;
    if(settings.currency !== "GNF"){
      const ok = await refreshRatesOnline();
      if(!ok) usedFallback = true;
    }
    state.data.capitalInitial = toGNF(capRaw, settings.currency);
    if(usedFallback) alert(t("ob.noRate"));
  } else {
    /* Cet appareil REJOINT un commerce qui existe déjà. Il arrive aveugle : il ne
       connaît encore ni le capital de départ, ni le compteur de reçus, ni les
       catégories — son registre local vaut zéro partout.
       S'il envoyait ses réglages maintenant, il annoncerait « capital = 0 » au coffre
       et écraserait le vrai chiffre pour TOUS les appareils du commerce. C'est
       exactement ce qui est arrivé : le capital de départ effacé après un changement
       de compte, alors que ventes et achats étaient intacts.
       Règle : on écoute d'abord, on parle ensuite. Ce drapeau bloque l'envoi des
       réglages et ne retombe qu'après une descente réussie. Un commerce tout neuf
       n'est pas concerné : lui détient la vérité, son capital part immédiatement. */
    syncState = syncState || {};
    syncState.awaitingFirstPull = true;
    saveSyncState(syncState);
  }
  persist(); // marque au passage toutes les opérations avec la boutique et l'heure

  authUI.busy = false;
  isUnlocked = true;
  applyTheme();
  showAppScreen();
  render();
  showToast(t("au.accountReady"));
  refreshRatesInBackground();

  // La boutique est maintenant connue : c'est SEULEMENT ici que la synchronisation
  // peut réellement travailler. Au démarrage de l'application, la boucle ne partait
  // que si un compte existait déjà ; en se connectant pendant que l'application
  // tourne, elle ne partait jamais et les données ne descendaient qu'au bouton
  // « Synchroniser maintenant ». startSyncLoop() se protège lui-même des doubles
  // départs, on peut donc l'appeler à chaque entrée sans risque.
  if(typeof startSyncLoop === "function") startSyncLoop();
}

// ── Déconnexion : la session part, le registre reste sur l'appareil ──
// (le mot-clé async est réinjecté par le script de montage lors de l'ajout du menu)
// Pastille discrète de synchronisation : un petit point sur le rond profil quand des
// opérations attendent de monter vers le coffre. Discret : rien quand tout est à jour.
function updateSyncBadge(){
  const btn = document.getElementById("profileBtn");
  if(!btn) return;
  let dot = document.getElementById("syncDot");
  const online = !!(settings && settings.account && auth && auth.access_token);
  const n = (online && typeof pendingCount === "function") ? pendingCount() : 0;
  if(n > 0){
    if(!dot){
      dot = document.createElement("span");
      dot.id = "syncDot";
      dot.style.cssText = "position:absolute;top:-2px;right:-2px;width:13px;height:13px;border-radius:50%;background:var(--gold);border:2px solid var(--fieldBg);";
      btn.style.position = "relative";
      btn.appendChild(dot);
    }
  } else if(dot){
    dot.remove();
  }
}

// Applique les restrictions du vendeur à l'écran : onglets retirés, capital masqué.
// Ce n'est PAS la seule barrière — le serveur, lui, cloisonne déjà les boutiques.
// Ici on évite simplement de montrer au vendeur ce qui ne le regarde pas.
function applySellerRestrictions(){
  const seller = (typeof isSeller === "function") && isSeller();

  // Onglets réservés au propriétaire
  ["expenses","reports"].forEach(function(tab){
    const btn = document.querySelector('[data-tab="' + tab + '"]');
    if(btn) btn.style.display = seller ? "none" : "";
  });

  // Le capital disponible ne regarde pas le vendeur
  const capBox = document.querySelector(".cap-box");
  if(capBox) capBox.style.display = seller ? "none" : "";

  // Si un vendeur se trouvait sur un onglet désormais interdit, on le ramène à l'accueil
  if(seller && (state.tab === "expenses" || state.tab === "reports")){
    state.tab = "home";
  }
}

// Le vendeur ne modifie et ne supprime que SES ventes. Il voit celles des autres
// (pour retrouver le reçu d'un client servi par un collègue), mais n'y touche pas.
function canEditSale(sale){
  if(typeof isSeller !== "function" || !isSeller()) return true; // le propriétaire peut tout
  const me = (settings && settings.ownerName) ? settings.ownerName : "";
  if(!sale) return false;
  if(!sale.sellerName) return false;      // vente sans auteur : réservée au propriétaire
  return sale.sellerName === me;
}

// Raccourci de lecture : « ce compte est-il en lecture seule sur le commerce ? »
// Autrement dit : est-ce un vendeur ? Nommé court car utilisé dans de nombreux écrans.
function sellerRO(){
  return (typeof isSeller === "function") && isSeller();
}

// Reconstitue l'état du compte d'un client juste après un paiement donné, en rejouant
// l'historique dans l'ordre. Sert uniquement à réparer les vieux reçus incomplets :
// une fois la valeur figée, elle ne bouge plus jamais.
function rebuildPaymentSnapshot(payment){
  const d = state.data;
  if(!payment || !payment.clientId) return {paid: payment ? payment.amount : 0, remaining: 0};

  // Total dû par ce client (ses ventes à crédit qui comptent encore).
  let totalDue = 0;
  (d.sales||[]).forEach(function(s){
    if(!s || !s.isCredit) return;
    if(s.clientId !== payment.clientId) return;
    if((s.status||"active") === "trash") return;
    totalDue += (s.qty||0) * (s.salePrice||0);
  });

  // Paiements du client, remis dans leur ordre d'enregistrement.
  // Un paiement mis à la corbeille est ignoré (il est réputé n'avoir jamais eu lieu).
  const list = (d.payments||[])
    .filter(function(p){ return p && p.clientId === payment.clientId && isCounted(p); })
    .sort(function(a,b){ return String(a.id).localeCompare(String(b.id)); });

  let cumul = 0;
  for(const p of list){
    cumul += (p.amount || 0);
    if(p.id === payment.id) break;   // on s'arrête juste après CE paiement
  }
  return { paid: cumul, remaining: Math.max(0, totalDue - cumul) };
}

/* ════════════════════════════════════════════════
   COMPTES VENDEURS
   ════════════════════════════════════════════════
   Le propriétaire crée les comptes de ses vendeurs depuis son téléphone.
   Il choisit le nom et le mot de passe ; le SERVEUR attribue l'identifiant
   (ex. BS-136890526) et garantit qu'il est unique.

   Aucune clé secrète ne se trouve dans l'application : toute création passe
   par la fonction serveur, qui vérifie elle-même que le demandeur est bien
   propriétaire de sa boutique. Même en décortiquant l'application, personne
   ne peut fabriquer de comptes.

   Le vendeur, lui, se connecte avec DEUX informations seulement :
   son identifiant et son mot de passe. Pas d'email à retenir.
════════════════════════════════════════════════ */

const SELLERS_FN = SUPA_URL + "/functions/v1/sellers";
const MAX_SELLERS = 25;

// L'adresse technique cachée derrière un identifiant de vendeur.
// Règle fixe et publique : sans le mot de passe, elle ne donne accès à rien.
function sellerLoginToEmail(login){
  return String(login || "").trim().toLowerCase() + "@sellers.registrepro.app";
}

// Appelle le serrurier (la fonction serveur). Renvoie {ok, data, error}.
async function sellersCall(payload){
  if(!auth || !auth.access_token) return {ok:false, data:null, error:"no-session"};
  try{
    const res = await fetch(SELLERS_FN, {
      method: "POST",
      headers: {
        "apikey": SUPA_KEY,
        "Authorization": "Bearer " + auth.access_token,
        "Content-Type": "application/json"
      },
      body: JSON.stringify(payload)
    });
    let data = null;
    const txt = await res.text();
    if(txt){ try{ data = JSON.parse(txt); }catch(e){ data = null; } }
    if(!res.ok) return {ok:false, data:data, error:(data && data.error) || ("HTTP " + res.status)};
    return {ok:true, data:data, error:null};
  }catch(e){
    return {ok:false, data:null, error:"network"};
  }
}

// Suppression définitive du compte propriétaire. Comme effacer un compte et ses données
// exige la clé secrète du serveur (jamais dans l'app), tout passe par une fonction serveur
// dédiée qui vérifie elle-même, à partir de la session, que le demandeur est bien le titulaire.
const DELETE_ACCOUNT_FN = SUPA_URL + "/functions/v1/delete-account";
async function deleteAccountCall(){
  if(!auth || !auth.access_token) return {ok:false, data:null, error:"no-session"};
  try{
    const res = await fetch(DELETE_ACCOUNT_FN, {
      method: "POST",
      headers: {
        "apikey": SUPA_KEY,
        "Authorization": "Bearer " + auth.access_token,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ action: "delete" })
    });
    let data = null;
    const txt = await res.text();
    if(txt){ try{ data = JSON.parse(txt); }catch(e){ data = null; } }
    if(!res.ok) return {ok:false, data:data, error:(data && data.error) || ("HTTP " + res.status)};
    return {ok:true, data:data, error:null};
  }catch(e){
    return {ok:false, data:null, error:"network"};
  }
}

// Traduit les messages du serveur (en anglais) en phrases compréhensibles.
function sellerErrorText(code){
  const c = String(code || "");
  if(c === "network") return t("au.errNetwork");
  if(c === "not-owner") return t("sel.errNotOwner");
  if(c === "max-sellers") return t("sel.errMax").replace("{n}", MAX_SELLERS);
  if(c === "name-too-short") return t("sel.errName");
  if(c === "password-too-short") return t("sel.errPw");
  if(c === "not-your-seller") return t("sel.errNotYours");
  if(c === "no-session" || c === "not-authenticated") return t("sel.errSession");
  return t("au.errGeneric");
}

// Le propriétaire est-il aux commandes ? (les vendeurs ne gèrent pas les vendeurs)
function isOwner(){
  return !!(settings && settings.account && settings.account.role !== "seller");
}
function isSeller(){
  return !!(settings && settings.account && settings.account.role === "seller");
}
/* ── CE QU'ON MONTRE POUR IDENTIFIER LE COMPTE ────────────────────────────
   Le serveur ne sait travailler qu'avec des adresses email. Un vendeur n'en a pas :
   l'application lui en fabrique donc une à partir de son identifiant
   (la-099993683@sellers.registrepro.app). C'est un rouage interne — le vendeur ne la
   tape jamais, elle ne reçoit aucun courrier, et personne ne doit la voir.
   On affiche donc son identifiant, celui qu'il saisit pour se connecter.
   Pour le propriétaire, rien ne change : sa vraie adresse est utile et reste affichée. */
function accountHandle(){
  const acc = (settings && settings.account) || {};
  if(acc.role === "seller") return acc.sellerLogin || "";
  return acc.email || "";
}
// Étiquette qui va avec : « Identifiant » pour un vendeur, « Email du compte » sinon.
function accountHandleLabel(){
  return isSeller() ? t("sel.loginLabel") : t("au.accountEmail");
}
// Identifiant stable de qui agit maintenant : le login BS- du vendeur connecté,
// ou "" pour le propriétaire. Gravé sur chaque nouvel enregistrement (recordedById).
function currentActorId(){
  return (settings && settings.account && settings.account.sellerLogin) || "";
}

/* ── MODIFIER UN VENDEUR ───────────────────────────────────────────── */
// Écran d'activité d'UN vendeur : uniquement SES ventes et SES paiements, reliés à lui
// par son identifiant (recordedById === son login BS-), jamais par son nom — ainsi deux
// vendeurs homonymes ne se mélangent jamais. Les enregistrements faits avant cette mise à
// jour n'ont pas d'identifiant : ils n'apparaissent donc pas ici (mais restent dans l'historique).
function openSellerActivity(login, name){
  const groups = (typeof getSaleGroups === "function" ? getSaleGroups() : []).filter(function(g){
    return isCounted(g) && g.lines && g.lines[0] && g.lines[0].recordedById === login;
  });
  const pays = (state.data.payments||[]).filter(function(p){ return isCounted(p) && p.recordedById === login; });

  const items = [];
  groups.forEach(function(g){
    const total = g.lines.reduce(function(s,l){ return s + l.qty*l.salePrice; }, 0);
    items.push({kind:"sale", id:g.id, date:g.date, receiptNo:g.receiptNo||"", client:g.client||"", amount:total, isCredit:g.isCredit});
  });
  pays.forEach(function(p){
    items.push({kind:"pay", id:p.id, date:p.date, receiptNo:p.receiptNo||"", client:p.client||"", amount:p.amount||0});
  });
  items.sort(function(a,b){ return (b.id||"").localeCompare(a.id||""); });

  const salesCount = groups.length;
  const salesTotal = items.filter(function(e){ return e.kind==="sale"; }).reduce(function(s,e){ return s+e.amount; }, 0);
  const paysCount = pays.length;
  const paysTotal = items.filter(function(e){ return e.kind==="pay"; }).reduce(function(s,e){ return s+e.amount; }, 0);

  const rows = items.length===0
    ? `<div style="text-align:center;color:var(--sub);font-size:12px;padding:18px 0;">${t("sel.actEmpty")}</div>`
    : items.map(function(e){
        const isSale = e.kind==="sale";
        const icon = isSale ? "💵" : "💰";
        const label = isSale ? t("sel.actSaleLine") : t("sel.actPayLine");
        return `<div style="border-top:1px solid var(--border);padding:8px 0;">
          <div class="row-between" style="align-items:flex-start;">
            <div style="flex:1;min-width:0;padding-right:8px;">
              <div style="font-size:10px;font-weight:bold;color:var(--sub);">${icon} ${label} · ${esc(e.date)}${e.isCredit?` · <span style="color:var(--red);">${t("op.credit")}</span>`:""}</div>
              ${e.client?`<div style="font-size:12px;color:var(--text);word-break:break-word;">${esc(e.client)}</div>`:""}
              ${e.receiptNo?`<div style="font-size:10px;color:var(--sub);">${esc(e.receiptNo)}</div>`:""}
            </div>
            <div style="font-weight:bold;color:var(--green);white-space:nowrap;">${fmt(e.amount)}</div>
          </div>
        </div>`;
      }).join("");

  openModal(`
    <div class="modal-head"><div class="modal-title">${esc(name||"")}</div>
      <button class="modal-close" onclick="closeModal()">✕</button></div>
    <div style="font-size:11px;color:var(--sub);font-family:Arial,sans-serif;margin-bottom:12px;">${esc(login||"")}</div>
    <div style="display:flex;gap:10px;margin-bottom:14px;">
      <div style="flex:1;border:1px solid var(--border);border-radius:10px;padding:10px;text-align:center;">
        <div style="font-size:10px;color:var(--sub);">${t("sel.actSales")} (${salesCount})</div>
        <div style="font-size:14px;font-weight:bold;color:var(--green);">${fmt(salesTotal)}</div>
      </div>
      <div style="flex:1;border:1px solid var(--border);border-radius:10px;padding:10px;text-align:center;">
        <div style="font-size:10px;color:var(--sub);">${t("sel.actPayments")} (${paysCount})</div>
        <div style="font-size:14px;font-weight:bold;color:var(--green);">${fmt(paysTotal)}</div>
      </div>
    </div>
    <div style="border:1px solid var(--border);border-radius:12px;padding:2px 12px;">${rows}</div>
  `);
}

    const name = document.getElementById("esName").value.trim();
    const phone = document.getElementById("esPhone").value.trim();
    const pw = document.getElementById("esPw").value;
    if(name.length < 2){ alert(t("sel.errName")); return; }
    if(pw && pw.length < 8){ alert(t("sel.errPw")); return; }

    sellersBusy = true;
    const btn = document.getElementById("esSave");
    btn.disabled = true;
    const payload = {action:"update", sellerId:sellerId, fullName:name, phone:phone};
    if(pw) payload.password = pw;
    const r = await sellersCall(payload);
    sellersBusy = false;
    if(!r.ok){ btn.disabled = false; alert(sellerErrorText(r.error)); return; }
    closeModal();
    await refreshSellersList();
    showToast(t("sel.updated"));
  };
}

/* ── SUSPENDRE / RÉACTIVER ─────────────────────────────────────────── */
async function toggleSeller(sellerId){
  const s = sellersList.find(function(x){ return x.id === sellerId; });
  if(!s || sellersBusy) return;
  const msg = s.active ? t("sel.suspendConfirm") : t("sel.reactivateConfirm");
  if(!confirm(msg.replace("{name}", s.full_name))) return;
  sellersBusy = true;
  const r = await sellersCall({action:"update", sellerId:sellerId, active:!s.active});
  sellersBusy = false;
  if(!r.ok){ alert(sellerErrorText(r.error)); return; }
  await refreshSellersList();
  showToast(s.active ? t("sel.suspendedToast") : t("sel.reactivatedToast"));
}

/* ── SUPPRIMER UN VENDEUR ──────────────────────────────────────────── */
// Son compte de connexion disparaît. Ses VENTES restent dans le registre :
// l'histoire du commerce ne doit jamais perdre ce qui a réellement eu lieu.
async function deleteSeller(sellerId){
  const s = sellersList.find(function(x){ return x.id === sellerId; });
  if(!s || sellersBusy) return;
  if(!confirm(t("sel.deleteConfirm").replace("{name}", s.full_name))) return;
  sellersBusy = true;
  const r = await sellersCall({action:"delete", sellerId:sellerId});
  sellersBusy = false;
  if(!r.ok){ alert(sellerErrorText(r.error)); return; }
  await refreshSellersList();
  showToast(t("sel.deletedToast"));
}

/* ── CONNEXION D'UN VENDEUR ────────────────────────────────────────── */
// Deux informations seulement : identifiant et mot de passe.
async function sellerSignIn(login, password){
  const email = sellerLoginToEmail(login);
  const r = await authSignIn(email, password);
  if(!r.ok) return r;

  // Le compte existe — mais est-il encore autorisé ? Un vendeur suspendu ne doit
  // pas pouvoir entrer, même s'il connaît toujours ses identifiants.
  const chk = await supaCall("/rest/v1/sellers?select=active,full_name&id=eq." + encodeURIComponent(auth.user_id), {withToken:true});
  const row = (chk.ok && Array.isArray(chk.data)) ? chk.data[0] : null;
  if(row && row.active === false){
    await authSignOutServer();
    return {ok:false, status:403, data:null, error:"seller-suspended"};
  }
  return r;
}

async function doSignOut(){
  if(!confirm(t("au.signOutConfirm"))) return;

// Un render() complet reconstruit tout l'écran, donc une rangée de boutons qu'on avait fait défiler
// (ex: pour atteindre "Corbeille" plus loin à droite) "oublierait" sa position et repartirait tout
// à gauche, donnant l'impression trompeuse que ça "revient" vers un autre bouton. On sauvegarde donc
// la position juste avant, puis on la restaure juste après, exactement comme on l'a déjà fait pour
// le défilement vertical des formulaires d'achat/vente.
function renderPreservingScroll(pillsElementId){
  const el = document.getElementById(pillsElementId);
  const savedScroll = el ? el.scrollLeft : 0;
  render();
  const newEl = document.getElementById(pillsElementId);
  if(newEl) newEl.scrollLeft = savedScroll;
}

// Applique le thème choisi (sombre par défaut, clair si choisi) en posant/retirant une classe
// sur <body> — toutes les couleurs de l'app étant déjà des variables CSS, ce seul changement
// suffit à tout adapter d'un coup, sans toucher au reste du code.
function applyTheme(){
  // Avant qu'un compte existe, on suit le thème choisi sur l'écran d'accueil.
  const isLight = currentTheme()==="light";
  document.body.classList.toggle("theme-light", isLight);
  // On annonce au système le thème RÉELLEMENT actif. Sans ça, un téléphone en mode
  // sombre repeint lui-même l'application quand elle est installée (pas dans le navigateur).
  document.documentElement.style.colorScheme = isLight ? "light" : "dark";
}

// Réinitialisation totale — logique pure, réutilisable quel que soit l'endroit qui la déclenche.
function performFullReset(){
  localStorage.removeItem(STORE_KEY);
  localStorage.removeItem(SETTINGS_KEY);
  localStorage.removeItem(AUTH_KEY); // la session de cet appareil part aussi
  auth = null;
  _recordSignatures = new Map();
  settings = null;
  state.data = loadData();
  state.tab = "home";
  isUnlocked = false;
  render();
}

// perdu (pas juste "tout sera effacé" dans l'abstrait), et un mot à taper explicitement —
// pour qu'on ne puisse jamais traverser ça par un double-appui réflexe comme avec deux
// fenêtres OK/Annuler classiques.

    </div>
    <div style="background:rgba(224,92,92,0.08);border:1px solid var(--red);border-radius:10px;padding:14px;margin-bottom:16px;font-size:13px;">
      ${t("rst.aboutToA")} <strong>${t("rst.aboutToB")}</strong> :
      <ul style="margin:8px 0 0;padding-left:20px;line-height:1.5;">
        <li>${d.products.length} ${t("cat.productCount")}</li>
        <li>${d.purchases.length} ${t("rst.purchases")}</li>
        <li>${nSales} ${t("rst.sales")}</li>
        <li>${d.clients.length} ${t("rst.clients")}</li>
      </ul>
      <div style="margin-top:8px;">${t("rst.currentCapital")} <strong>${fmt(stats.capitalDispo)}</strong></div>
    </div>
    <div style="font-size:13px;margin-bottom:8px;">${t("rst.confirmA")} <strong style="color:var(--red);">${t("rst.word")}</strong> ${t("rst.confirmB")}</div>
    <input id="${inputId}" placeholder="${t("rst.typeVerb")} ${t("rst.word")}" autocomplete="off" style="margin-bottom:14px;text-align:center;letter-spacing:1px;">
    <button class="btn" id="${btnId}" style="background:#8b2e2e;opacity:0.4;pointer-events:none;">${t("rst.confirmBtn")}</button>`;

// Branche l'activation du bouton uniquement quand le mot exact est tapé — jamais avant.
function wireResetConfirmInputs(inputId, btnId, onConfirmed){
  const input = document.getElementById(inputId);
  const btn = document.getElementById(btnId);
  if(!input || !btn) return;
  input.oninput = ()=>{
    const ok = input.value.trim().toUpperCase()===t("rst.word");
    btn.style.opacity = ok ? "1" : "0.4";
    btn.style.pointerEvents = ok ? "auto" : "none";
  };
  btn.onclick = ()=>{
    if(input.value.trim().toUpperCase()!==t("rst.word")) return; // garde-fou supplémentaire
    onConfirmed();
  };
}

function checkLockOrRender(){
  applyTheme();
  // Sans compte en ligne, ou sans session ouverte : parcours du compte.
  // Le registre déjà présent sur l'appareil n'est jamais effacé pour autant.
  if(!settings || !settings.account || !auth || !auth.access_token){ renderAuth(); return; }
  if(hasPinSet() && !isUnlocked){ renderLockScreen(); return; }
  showAppScreen();
  render();
}

function renderLockDots(){
  const len = settings.pinLength||4;
  const dotsEl = document.getElementById("lockDots");
  if(!dotsEl) return;
  let html = "";
  for(let i=0;i<len;i++){
    html += `<div style="width:14px;height:14px;border-radius:50%;border:1px solid var(--gold);background:${i<lockBuffer.length?'var(--gold)':'transparent'};"></div>`;
  }
  dotsEl.innerHTML = html;
}

function renderLockScreen(){
  document.getElementById("app").style.display="none";
  document.getElementById("onboarding").style.display="none";
  const ls = document.getElementById("lockScreen");
  ls.style.display="flex";
  lockBuffer = "";

  if(isCurrentlyLocked()){
    renderLockCountdown(ls);
    return;
  }

  ls.innerHTML = `
    <div class="ob-box" style="text-align:center;">
      <div class="ob-logo">🔒</div>
      <div class="ob-title">${esc(settings.businessName)}</div>
      <div class="ob-sub">${t("lock.enterPin")}</div>
      <div id="lockDots" style="display:flex;justify-content:center;gap:14px;margin-bottom:22px;flex-wrap:wrap;"></div>
      <div id="lockError" style="color:var(--red);font-size:12px;height:16px;margin-bottom:10px;"></div>
      <div class="keypad" id="keypad"></div>
      <div style="margin-top:20px;">
        <span style="color:var(--sub);font-size:12px;text-decoration:underline;cursor:pointer;" id="forgotPin">${t("lock.forgot")}</span>
      </div>
    </div>`;
  renderLockDots();
  const keys = ["1","2","3","4","5","6","7","8","9","","0","⌫"];
  const kp = document.getElementById("keypad");
  kp.innerHTML = keys.map(k=>k===""?`<div></div>`:`<button class="key-btn" data-key="${k}">${k}</button>`).join("");
  // pinVerifying empêche qu'un double-appui rapide (fréquent sur certains écrans tactiles)
  // ne déclenche deux vérifications pour un seul code saisi — ce qui compterait à tort
  // comme deux essais faux au lieu d'un seul vis-à-vis du blocage progressif.
  let pinVerifying = false;
  kp.querySelectorAll(".key-btn").forEach(b=>{
    b.onclick = async ()=>{
      if(pinVerifying) return;
      const k = b.dataset.key;
      const len = settings.pinLength||4;
      if(k==="⌫"){ lockBuffer = lockBuffer.slice(0,-1); }
      else if(lockBuffer.length<len){ lockBuffer += k; }
      renderLockDots();
      if(lockBuffer.length===len){
        pinVerifying = true;
        const entered = lockBuffer;
        const ok = await verifyPin(entered);
        if(ok){
          registerPinSuccess();
          isUnlocked = true;
          document.getElementById("lockScreen").style.display="none";
          render();
        } else {
          registerPinFailure();
          if(isCurrentlyLocked()){ renderLockScreen(); return; }
          const errEl = document.getElementById("lockError");
          if(errEl) errEl.textContent = t("lock.wrong");
          setTimeout(()=>{ lockBuffer=""; pinVerifying=false; renderLockDots(); if(errEl) errEl.textContent=""; }, 600);
          return;
        }
        pinVerifying = false;
      }
    };
  });
  document.getElementById("forgotPin").onclick = ()=>{
    ls.innerHTML = `
      <div class="ob-box">
        ${buildResetConfirmHtml("resetConfirmInputLock","resetConfirmBtnLock")}
        <div style="text-align:center;margin-top:12px;">
          <span style="color:var(--sub);font-size:12px;text-decoration:underline;cursor:pointer;" id="cancelResetLock">${t("lock.cancelBack")}</span>
        </div>
      </div>`;
    wireResetConfirmInputs("resetConfirmInputLock","resetConfirmBtnLock", ()=>{
      performFullReset();
    });
    document.getElementById("cancelResetLock").onclick = ()=> renderLockScreen();
  };
}

// Écran de blocage progressif : affiché après plusieurs codes faux d'affilée.
// Compte à rebours en direct ; le clavier ne réapparaît qu'une fois le délai écoulé.
function renderLockCountdown(ls){
  function remainingSeconds(){ return Math.max(0, Math.ceil((settings.pinLockedUntil-Date.now())/1000)); }
  let interval;
  function draw(){
    const secs = remainingSeconds();
    const mm = String(Math.floor(secs/60)).padStart(2,"0");
    const ss = String(secs%60).padStart(2,"0");
    ls.innerHTML = `
      <div class="ob-box" style="text-align:center;">
        <div class="ob-logo">⏳</div>
        <div class="ob-title">${esc(settings.businessName)}</div>
        <div class="ob-sub" style="color:var(--red);">${t("lock.tooMany")}</div>
        <div style="font-size:34px;font-weight:bold;color:var(--gold);letter-spacing:2px;margin:18px 0;font-family:Arial,Helvetica,sans-serif;">${mm}:${ss}</div>
        <div style="font-size:12px;color:var(--sub);margin-bottom:20px;">${t("lock.retryLater")}</div>
        <span style="color:var(--sub);font-size:12px;text-decoration:underline;cursor:pointer;" id="forgotPinLocked">${t("lock.forgot")}</span>
      </div>`;
    const fp = document.getElementById("forgotPinLocked");
    if(fp) fp.onclick = ()=>{
      clearInterval(interval); // on quitte le compte à rebours — sinon il écraserait cette vue chaque seconde
      ls.innerHTML = `
        <div class="ob-box">
          ${buildResetConfirmHtml("resetConfirmInputLock2","resetConfirmBtnLock2")}
          <div style="text-align:center;margin-top:12px;">
            <span style="color:var(--sub);font-size:12px;text-decoration:underline;cursor:pointer;" id="cancelResetLock2">${t("act.forgotCancel")}</span>
          </div>
        </div>`;
      wireResetConfirmInputs("resetConfirmInputLock2","resetConfirmBtnLock2", ()=>{
        performFullReset();
      });
      document.getElementById("cancelResetLock2").onclick = ()=> renderLockCountdown(ls);
    };
  }
  draw();
  interval = setInterval(()=>{
    if(!isCurrentlyLocked()){
      clearInterval(interval);
      renderLockScreen();
      return;
    }
    draw();
  }, 1000);
}

/* ════════════════════════════════════════════════
   NOTIFICATIONS DISCRÈTES (toasts)
   Apparaissent brièvement après une action (ajout, modification,
   suppression...) puis disparaissent seules — pas de bouton à fermer.
════════════════════════════════════════════════ */
function showToast(message, type){
  type = type || "success";
  const root = document.getElementById("toastRoot");
  if(!root) return;
  const el = document.createElement("div");
  el.className = "toast " + type;
  el.textContent = message;
  root.appendChild(el);
  requestAnimationFrame(()=>{ el.classList.add("show"); });
  setTimeout(()=>{
    el.classList.remove("show");
    setTimeout(()=>{ if(el.parentNode) el.parentNode.removeChild(el); }, 300);
  }, 2200);
}


/* ════════════════════════════════════════════════
   MAIN RENDER
════════════════════════════════════════════════ */
function render(){
  if(!settings){ renderOnboarding(); return; }
  document.getElementById("onboarding").style.display="none";
  document.getElementById("lockScreen").style.display="none";
  document.getElementById("app").style.display="block";

  document.getElementById("brandName").textContent = settings.businessName;
  applySellerRestrictions();
  const pfBtn = document.getElementById("profileBtn");
  if(pfBtn){
    const initial = ((settings.businessName||"R").trim()[0] || "R").toUpperCase();
    pfBtn.textContent = initial;
    pfBtn.onclick = openAccountMenu;
  }
  updateSyncBadge();
  document.getElementById("brandSub").textContent = t("header.register");
  const capLabel = document.querySelector(".cap-label");
  if(capLabel) capLabel.textContent = t("header.capital");

  const stats = computeStats();
  document.getElementById("capVal").textContent = fmt(stats.capitalDispo);
  document.getElementById("capVal").style.color = stats.capitalDispo<0 ? "var(--red)" : "var(--gold)";

  // Libellés du menu du bas (traduits selon la langue choisie)
  const NAV_KEYS = {home:"nav.home", catalog:"nav.stock", ops:"nav.ops", expenses:"nav.expenses", reports:"nav.reports", settings:"nav.settings"};
  document.querySelectorAll("#bottomNav button").forEach(b=>{
    b.classList.toggle("active", b.dataset.tab===state.tab);
    const lab = b.querySelector(".nlab");
    if(lab && NAV_KEYS[b.dataset.tab]) lab.textContent = t(NAV_KEYS[b.dataset.tab]);
  });

  const content = document.getElementById("content");
  if(state.tab==="home") content.innerHTML = renderHome(stats);
  else if(state.tab==="catalog") content.innerHTML = renderCatalog(stats);
  else if(state.tab==="ops") content.innerHTML = renderOps(stats);
  else if(state.tab==="expenses") content.innerHTML = renderExpenses(stats);
  else if(state.tab==="reports") content.innerHTML = renderReports(stats);
  else if(state.tab==="settings") content.innerHTML = renderSettings();

  attachContentHandlers(stats);
  if(state.tab==="reports") drawEvoChart();
}

document.getElementById("bottomNav").addEventListener("click", e=>{
  const btn = e.target.closest("button[data-tab]");
  if(!btn) return;
  state.tab = btn.dataset.tab;
  render();
});

// Total des ventes que CE vendeur a enregistrées aujourd'hui.
function sellerSalesTodayTotal(){
  const me = (settings && settings.ownerName) ? settings.ownerName : "";
  const today = todayFR();
  let total = 0;
  (state.data.sales||[]).forEach(function(s){
    if(!s || s.status === "trash") return;
    if(s.date !== today) return;
    if(me && s.sellerName && s.sellerName !== me) return;
    total += (s.qty||0) * (s.salePrice||0);
  });
  return total;
}

/* ════════════════════════════════════════════════
   EVENT HANDLERS (delegation)
════════════════════════════════════════════════ */
function bindActionHandlers(container, stats){
  if(!container) return;
  container.querySelectorAll("[data-action]").forEach(el=>{
    // Sécurité générale : empêche qu'un clic sur un bouton imbriqué (ex: 🗑 à l'intérieur
    // d'une carte qui se déplie/replie au clic) ne déclenche AUSSI l'action du parent.
    el.addEventListener("click", e=>{ if(e&&e.stopPropagation) e.stopPropagation(); });
    const action = el.dataset.action;
    if(action==="signOut") el.onclick=()=>doSignOut();
    else if(action==="openAddProduct") el.onclick=()=>openAddProductModal();
    else if(action==="openAddVariant") el.onclick=()=>openVariantFormModal(null);
    else if(action==="editVariant") el.onclick=()=>{
      const v = state.data.variants.find(x=>x.id===el.dataset.id);
      if(v) openVariantFormModal(v);
    };
    else if(action==="openAddPurchase") el.onclick=()=>openAddPurchaseModal();
    else if(action==="editPurchase") el.onclick=()=>{
      const p = state.data.purchases.find(x=>x.id===el.dataset.id);
      if(p) openAddPurchaseModal(p);
    };
    else if(action==="openAddSale") el.onclick=()=>openAddSaleModal();
    else if(action==="editSaleGroup") el.onclick=()=>{
      const g = getSaleGroups().find(x=>x.id===el.dataset.id);
      if(g) openAddSaleModal(g);
    };
    else if(action==="openAddExpense") el.onclick=()=>openAddExpenseModal();
    else if(action==="openReceipt") el.onclick=()=>openReceiptModal(el.dataset.id);
    else if(action==="editProduct") el.onclick=(e)=>{
      // Le bouton est posé sur une carte qui se replie au clic : sans cette ligne,
      // appuyer sur le crayon replierait le produit en même temps.
      if(e && e.stopPropagation) e.stopPropagation();
      openEditProductModal(el.dataset.id);
    };
    else if(action==="toggleProduct") el.onclick=()=>{
      const id = el.dataset.id;
      state.expandedProductId = state.expandedProductId===id ? null : id;
      render();
    };
    else if(action==="deleteVariant") el.onclick=()=>{
      if(!confirm(t("var.deleteConfirm"))) return;
      if(typeof markDeletedForSync === "function") markDeletedForSync("variants", el.dataset.id);
      state.data.variants = state.data.variants.filter(v=>v.id!==el.dataset.id);
      saveData();
      showToast(t("var.deletedToast"),"error");
    };
    else if(action==="openDateFolder") el.onclick=()=>{
      const scope = el.dataset.scope || "ops";
      // Pas d'année = retour à la racine ; année seule = dans l'année ; +mois = dans le mois ; +jour = dans le jour.
      const path = {};
      if(el.dataset.year) path.year = el.dataset.year;
      if(el.dataset.month) path.month = el.dataset.month;
      if(el.dataset.day) path.day = el.dataset.day;
      setDatePath(scope, path);
      render();
      // On revient en haut de l'écran : on vient de changer de "dossier", pas de déplier.
      const content = document.getElementById("content");
      if(content) content.scrollTop = 0;
      window.scrollTo(0,0);
    };
    else if(action==="setOpsFilter") el.onclick=()=>{
      state.opsFilter = el.dataset.filter;
      setDatePath("ops", {}); // on repart de la racine en changeant de filtre
      renderPreservingScroll("opsFilterPills");
    };
    else if(action==="setOrderFilter") el.onclick=()=>{ state.orderFilter = el.dataset.filter; renderPreservingScroll("opsList"); };
    else if(action==="openAddOrder") el.onclick=()=>openAddOrderModal();
    else if(action==="toggleOrder") el.onclick=()=>{
      const id = el.dataset.id;
      if(state.expandedOrders.has(id)) state.expandedOrders.delete(id); else state.expandedOrders.add(id);
      renderPreservingScroll("opsList");
    };
    else if(action==="editOrder") el.onclick=()=>{
      const o = (state.data.orders||[]).find(x=>x.id===el.dataset.id);
      if(o) openAddOrderModal(o);
    };
    else if(action==="openOrderReceipt") el.onclick=()=>openOrderReceiptModal(el.dataset.id);
    else if(action==="deliverOrder") el.onclick=()=>{
      const o = (state.data.orders||[]).find(x=>x.id===el.dataset.id);
      if(!o) return;
      // La livraison ouvre le formulaire de vente pré-rempli : c'est CETTE vente qui
      // bougera l'argent et le stock (contrôle de stock, comptant/crédit, reçu...).
      openAddSaleModal(null, o);
    };
    else if(action==="cancelOrder") el.onclick=()=>{
      const o = (state.data.orders||[]).find(x=>x.id===el.dataset.id);
      if(!o) return;
      if(!confirm(t("act.cancelOrderConfirmA")+(o.client||t("act.thisClient"))+t("act.cancelOrderConfirmB"))) return;
      o.status = "cancelled";
      saveData();
      showToast(t("act.orderCancelled"),"error");
    };
    else if(action==="reopenOrder") el.onclick=()=>{
      const o = (state.data.orders||[]).find(x=>x.id===el.dataset.id);
      if(!o) return;
      o.status = "pending";
      saveData();
      showToast(t("act.orderReopened"));
    };
    else if(action==="permDeleteOrder") el.onclick=()=>{
      if(sellerRO()){ showToast(t("sel.notAllowed"), "error"); return; }
      const o = (state.data.orders||[]).find(x=>x.id===el.dataset.id);
      if(!o) return;
      if(!confirm(t("act.permDeleteOrderConfirm"))) return;
      if(typeof markDeletedForSync === "function") markDeletedForSync("orders", o.id);
      state.data.orders = state.data.orders.filter(x=>x.id!==o.id);
      (state.data.deletedLog = state.data.deletedLog || []).push({type:"commande", id:o.id, label:(o.orderNo||"")+" — "+(o.client||"")+" — "+fmt(orderTotalGNF(o)), deletedAt:todayFR()});
      saveData();
      showToast(t("act.orderDeleted"),"error");
    };
    else if(action==="toggleOpExpanded") el.onclick=()=>{
      const key = el.dataset.key;
      if(state.expandedOps.has(key)) state.expandedOps.delete(key); else state.expandedOps.add(key);
      render();
    };
    else if(action==="togglePaymentHistory") el.onclick=()=>{
      const key = el.dataset.key;
      if(state.expandedPaymentHistory.has(key)) state.expandedPaymentHistory.delete(key); else state.expandedPaymentHistory.add(key);
      render();
    };
    else if(action==="toggleStockInventory") el.onclick=()=>{ state.stockInventoryExpanded = !state.stockInventoryExpanded; render(); };
    else if(action==="setReportMode") el.onclick=()=>{ state.reportMode = el.dataset.mode; render(); };
    else if(action==="toggleReportMovements") el.onclick=()=>{ state.reportMovementsExpanded = !state.reportMovementsExpanded; render(); };
    else if(action==="setReportMovementFilter") el.onclick=()=>{ state.reportMovementFilter = el.dataset.filter; renderPreservingScroll("reportMovementFilterPills"); };
    else if(action==="openStatement") el.onclick=()=>{ openStatementModal(el.dataset.from, el.dataset.to, el.dataset.filter); };
    else if(action==="openClientStatement") el.onclick=()=>openClientStatementModal(el.dataset.clientid);
    else if(action==="trashPayment") el.onclick=()=>{
      if(sellerRO()){ showToast(t("sel.notAllowed"), "error"); return; }
      const pid = el.dataset.id;
      const p = (state.data.payments||[]).find(x=>x.id===pid);
      if(!p) return;
      // Supprimer un paiement fait remonter la dette du client (il n'a plus versé cette somme).
      // C'est récupérable : le paiement passe à la corbeille, il n'est pas détruit.
      if(!confirm(t("credit.trashPayConfirmA")+fmt(p.amount)+t("credit.trashPayConfirmB"))) return;
      p.status = "trash";
      saveData();
      showToast(t("credit.payTrashedToast"),"error");
    };
    else if(action==="restorePayment") el.onclick=()=>{
      if(sellerRO()){ showToast(t("sel.notAllowed"), "error"); return; }
      const pid = el.dataset.id;
      const p = (state.data.payments||[]).find(x=>x.id===pid);
      if(!p) return;
      p.status = "active";
      saveData();
      showToast(t("credit.payRestoredToast"));
    };
    else if(action==="openAddPayment") el.onclick=()=>{
      openAddPaymentModal(el.dataset.clientid, el.dataset.client, el.dataset.phone, +el.dataset.remaining);
    };
    else if(action==="openPaymentReceipt") el.onclick=()=>openPaymentReceiptModal(el.dataset.id);
    else if(action==="deletePurchase") el.onclick=()=>{
      const msg = t("act.trashPurchaseConfirm");
      if(!confirm(msg)) return;
      const p = state.data.purchases.find(x=>x.id===el.dataset.id);
      if(p) p.status = "trash";
      saveData();
      showToast(t("act.purchaseTrashed"),"error");
    };
    else if(action==="archivePurchase") el.onclick=()=>{
      const p = state.data.purchases.find(x=>x.id===el.dataset.id);
      if(p) p.status = "archived";
      saveData();
      showToast(t("act.purchaseArchived"));
    };
    else if(action==="unarchivePurchase") el.onclick=()=>{
      const p = state.data.purchases.find(x=>x.id===el.dataset.id);
      if(p) p.status = "active";
      saveData();
      showToast(t("act.purchaseUnarchived"));
    };
    else if(action==="restorePurchase") el.onclick=()=>{
      const p = state.data.purchases.find(x=>x.id===el.dataset.id);
      if(p) p.status = "active";
      saveData();
      showToast(t("act.purchaseRestored"));
    };
    else if(action==="permDeletePurchase") el.onclick=()=>{
      if(sellerRO()){ showToast(t("sel.notAllowed"), "error"); return; }
      if(!confirm(t("act.permDeletePurchaseConfirm"))) return;
      const p = state.data.purchases.find(x=>x.id===el.dataset.id);
      if(p){
        state.data.deletedLog.push({type:"achat", id:p.id, label:(p.note||t("act.noteless"))+" — "+p.items.length+" article(s)", deletedAt:todayFR()});
        if(typeof markDeletedForSync === "function") markDeletedForSync("purchases", p.id);
        state.data.purchases = state.data.purchases.filter(x=>x.id!==el.dataset.id);
      }
      saveData();
      showToast(t("act.purchasePermDeleted"),"error");
    };
    else if(action==="deleteSaleGroup") el.onclick=()=>{
      const gid = el.dataset.id;
      const group = getSaleGroups().find(g=>g.id===gid);
      // Cas particulier des ventes à crédit qui ont déjà reçu des paiements : un paiement
      // n'est pas rattaché à une vente précise (il tombe sur l'ardoise entière du client),
      // donc on ne peut pas jeter la vente sans réfléchir à ce que deviennent ses paiements.
      if(group && group.isCredit && group.clientId){
        const d = state.data;
        const owedWithout = d.sales
          .filter(s=>s.isCredit && s.clientId===group.clientId && isCounted(s) && (s.groupId||s.id)!==gid)
          .reduce((sum,s)=>sum+s.qty*s.salePrice,0);
        const clientPayments = (d.payments||[]).filter(p=>p.clientId===group.clientId && isCounted(p));
        const paid = clientPayments.reduce((sum,p)=>sum+(p.amount||0),0);
        if(paid > 0 && owedWithout === 0){
          // CAS 1 : c'est la seule ardoise de crédit du client → tous ses paiements vont
          // forcément dessus. On propose de jeter la vente ET ses paiements ensemble.
          // Chaque paiement est étiqueté (trashedWith) pour ne remonter QUE lui à la restauration.
          if(!confirm(t("act.trashCreditWithPayA")+fmt(paid)+t("act.trashCreditWithPayB"))) return;
          state.data.sales.forEach(s=>{ if((s.groupId||s.id)===gid) s.status = "trash"; });
          clientPayments.forEach(p=>{ p.status = "trash"; p.trashedWith = gid; });
          saveData();
          showToast(t("act.saleTrashed"),"error");
          return;
        }
        if(paid > owedWithout){
          // CAS 2 : le client a d'autres ardoises, et ses paiements dépasseraient ce qu'il
          // resterait à devoir sans cette vente → impossible de séparer proprement. On refuse.
          alert(t("act.trashCreditBlockedMulti"));
          return;
        }
        // Sinon (paiements encore couverts par les autres ardoises) : mise à la corbeille normale.
      }
      const msg = t("act.trashSaleConfirm");
      if(!confirm(msg)) return;
      state.data.sales.forEach(s=>{ if((s.groupId||s.id)===gid) s.status = "trash"; });
      saveData();
      showToast(t("act.saleTrashed"),"error");
    };
    else if(action==="archiveSaleGroup") el.onclick=()=>{
      const gid = el.dataset.id;
      state.data.sales.forEach(s=>{ if((s.groupId||s.id)===gid) s.status = "archived"; });
      saveData();
      showToast(t("act.saleArchived"));
    };
    else if(action==="unarchiveSaleGroup") el.onclick=()=>{
      const gid = el.dataset.id;
      state.data.sales.forEach(s=>{ if((s.groupId||s.id)===gid) s.status = "active"; });
      saveData();
      showToast(t("act.saleUnarchived"));
    };
    else if(action==="restoreSaleGroup") el.onclick=()=>{
      const gid = el.dataset.id;
      state.data.sales.forEach(s=>{ if((s.groupId||s.id)===gid) s.status = "active"; });
      // Si des paiements étaient partis à la corbeille AVEC cette vente (cas 1), on les
      // ramène — mais UNIQUEMENT ceux étiquetés avec cette vente-là, pour ne pas réveiller
      // par erreur les paiements d'une autre vente encore à la corbeille.
      (state.data.payments||[]).forEach(p=>{ if(p.trashedWith===gid){ p.status = "active"; delete p.trashedWith; } });
      saveData();
      showToast(t("act.saleRestored"));
    };
    else if(action==="permDeleteSaleGroup") el.onclick=()=>{
      if(sellerRO()){ showToast(t("sel.notAllowed"), "error"); return; }
      if(!confirm(t("act.permDeleteSaleConfirm"))) return;
      const gid = el.dataset.id;
      const group = getSaleGroups().find(g=>g.id===gid);
      if(group){
        state.data.deletedLog.push({type:"vente", id:gid, label:(group.receiptNo||t("act.logSale"))+" — "+(group.client||t("act.counterClient")), deletedAt:todayFR()});
        // Une vente peut compter plusieurs lignes (panier) : chacune doit être notée.
        if(typeof markDeletedForSync === "function"){
          state.data.sales.filter(s=>(s.groupId||s.id)===gid).forEach(s=>markDeletedForSync("sales", s.id));
        }
        state.data.sales = state.data.sales.filter(s=>(s.groupId||s.id)!==gid);
        // Les paiements qui avaient été jetés AVEC cette vente (cas 1) disparaissent avec elle.
        const buriedPays = (state.data.payments||[]).filter(p=>p.trashedWith===gid);
        if(buriedPays.length && typeof markDeletedForSync === "function"){
          buriedPays.forEach(p=>markDeletedForSync("payments", p.id));
        }
        state.data.payments = (state.data.payments||[]).filter(p=>p.trashedWith!==gid);
      }
      saveData();
      showToast(t("act.salePermDeleted"),"error");
    };
    else if(action==="editExpense") el.onclick=()=>{
      const ex = state.data.expenses.find(x=>x.id===el.dataset.id);
      if(ex) openAddExpenseModal(ex);
    };
    else if(action==="deleteExpense") el.onclick=()=>{
      const msg = "Cette dépense a-t-elle vraiment eu lieu ? Si oui, utilise plutôt 🗄️ Archiver — la corbeille retire cette dépense de tes totaux, comme si elle n'avait jamais existé.\n\nMettre quand même cette dépense à la corbeille ?";
      if(!confirm(msg)) return;
      const ex = state.data.expenses.find(x=>x.id===el.dataset.id);
      if(ex) ex.status = "trash";
      saveData();
      showToast(t("exp.toastTrash"),"error");
    };
    else if(action==="archiveExpense") el.onclick=()=>{
      const ex = state.data.expenses.find(x=>x.id===el.dataset.id);
      if(ex) ex.status = "archived";
      saveData();
      showToast(t("exp.toastArchived"));
    };
    else if(action==="unarchiveExpense") el.onclick=()=>{
      const ex = state.data.expenses.find(x=>x.id===el.dataset.id);
      if(ex) ex.status = "active";
      saveData();
      showToast(t("exp.toastUnarchived"));
    };
